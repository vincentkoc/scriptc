      - name: Admit disk capacity before LLVM
        shell: python
        run: |
          probe = r"""import json
          import os
          import pathlib
          import sys

          phase = sys.argv[1]
          minimum_gib, minimum_inodes = {
              "pre-llvm": (32, 1000000),
              "post-llvm": (16, 500000),
              "pre-proof": (16, 250000),
