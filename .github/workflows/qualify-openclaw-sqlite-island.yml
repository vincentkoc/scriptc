name: Qualify OpenClaw launcher runtime admission

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/qualify-openclaw-sqlite-island.yml]

permissions:
  contents: read

concurrency:
  group: qualify-openclaw-sqlite-island
  cancel-in-progress: false

jobs:
  sqlite_island:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: 923a57d63cc1a32324cd0a4d514935db3f2ad264
          persist-credentials: false
      - name: Verify source before setup
        run: |
          test "$(git rev-parse HEAD)" = 923a57d63cc1a32324cd0a4d514935db3f2ad264
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: ./.github/actions/llvm-linux
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zig
      - uses: ./.github/actions/native-packages
        with:
          target: linux-x64-gnu
      - run: pnpm build
      - name: Disable piped core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Observe unchanged launcher admission in native and explicit island modes
        env:
          SCRIPTC_LIBNODE: ${{ runner.temp }}/openclaw-libnode
        run: |
          cat > "$RUNNER_TEMP/openclaw-sqlite-island.mjs" <<'PROOF'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { existsSync, lstatSync, mkdirSync, readFileSync, readdirSync, writeFileSync } from "node:fs";
          import { basename, join, relative } from "node:path";
          import { pathToFileURL } from "node:url";

          const root = process.cwd();
          const head = "923a57d63cc1a32324cd0a4d514935db3f2ad264";
          const openclawHead = "6f8c9bad8bd1a8c339f2d61985e637f9e557550d";
          const out = join(process.env.RUNNER_TEMP, "openclaw-sqlite-proof");
          const fixture = join(process.env.RUNNER_TEMP, "openclaw-sqlite-fixture");
          mkdirSync(out, { recursive: true });
          const report = {
            source: head, openclawSource: openclawHead,
            workflow: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT, status: "running",
            scope: "unchanged OpenClaw launcher admission in native and explicit module island modes",
            entryExecution: "native", callerVersionSource: "native process.versions.node",
            pureNativeSqlite: false, completeGateway: false, completeSuite: false,
            diagnosticComplete: false, qualificationComplete: false,
            startedAt: new Date().toISOString(), steps: [], results: {}, artifacts: {}, modes: {},
          };
          const hash = path => createHash("sha256").update(readFileSync(path)).digest("hex");
          const scrub = value => String(value).split(root).join("<repo>").split(process.env.RUNNER_TEMP).join("<temp>");
          const save = () => writeFileSync(join(out, "summary.json"), scrub(JSON.stringify(report, null, 2)) + "\n");
          let sequence = 0;
          const execute = (name, command, args, seconds = 60, env = {}, observeFailure = false) => {
            const stem = String(++sequence).padStart(2, "0") + "-" + name;
            const start = Date.now();
            // GNU timeout owns the command group and escalates TERM after five seconds.
            const result = spawnSync("timeout", ["--signal=TERM", "--kill-after=5s", seconds + "s", command, ...args], {
              cwd: root, env: { ...process.env, ...env }, encoding: "utf8",
              maxBuffer: 1024 * 1024, killSignal: "SIGTERM",
            });
            const stdout = result.stdout ?? "", stderr = result.stderr ?? "";
            writeFileSync(join(out, stem + ".stdout.log"), stdout);
            writeFileSync(join(out, stem + ".stderr.log"), stderr);
            report.steps.push({
              name, command, args, seconds: (Date.now() - start) / 1000,
              limitSeconds: seconds, code: result.status, signal: result.signal,
              error: result.error?.message, stdout: stem + ".stdout.log", stderr: stem + ".stderr.log",
              stdoutSha256: hash(join(out, stem + ".stdout.log")),
              stderrSha256: hash(join(out, stem + ".stderr.log")),
            });
            save();
            if (observeFailure) return {
              code: result.status, signal: result.signal, error: result.error?.message,
              stdout: stdout.trim(), stderr, step: stem,
            };
            if (result.error || result.status !== 0 || result.signal)
              throw new Error(name + " failed: " + scrub(JSON.stringify({ code: result.status, signal: result.signal, error: result.error?.message, stderr: stderr.slice(-4000) })));
            return stdout.trim();
          };
          const processOutcome = result => result.error ? "tool-error" : result.signal ? "signal" :
            result.code === 124 ? "timeout" : result.code === 137 ? "killed" :
            result.code === 0 ? "completed" : "nonzero-exit";
          const inputs = {
            "packages/compiler/src/backend/runtime-abi.ts": "410942a8aec11d7ca9a7e2c9c2eb5f2881978b2bce77c867a48bdc8859e2691f",
            "packages/compiler/src/node-islands/libnode.ts": "2edc204155bf59fd173a1e940b469e097eb6e4442c62ddd0b5f227a4a028816d",
            "packages/compiler/src/node-islands/libnode-pack.ts": "4c08376cd8d4869a5fdc633e7f143b3b86746e80955cc0b9ce8afe7a63d370fd",
            "packages/libnode-common/dev-pack.json": "5e3480eb55bdc799ced4bc963265728d037847b93f45691bf5eaeaf7efe66c7b",
            "packages/libnode-common/fetch-dev-pack.mjs": "d99c18e0d407f3aebc5470449a7fb10958e172f731c13c45a1ebf472f07eff71",
            "packages/node/index.js": "3f4ada7e53d93fc7b57c27540f8e4f5f19f3dbbf190de8f33a8c35604876b665",
            "packages/node/index.d.ts": "00f09914126b6f3e72d4cb10c2d04820f9dcf5d164b5431f12a721fb2e85f803",
            "packages/runtime/src/scr_node_bridge.h": "ba7341a77633ab992e2059ec3377292a7d524fa8c30156cc8c50532c97f50d16",
            "packages/runtime/src/scr_array.c": "9b0f3372277e8331b6df433a540e2645b2d91eb856d4a84c2d4eca8b276c3ac3",
            "packages/runtime/src/scr_message.c": "4a95016e2b278140eb5328e75732323338f0b19b334f6b6caca8b58d5788eca7",
            "packages/runtime/src/scr_region.c": "db8dbd71d0f1f4d67dda0f46ad04df07d8aa34fc6b979f20316fa2f0631a5b21",
            "pnpm-lock.yaml": "f4bfbdc670252a428c20be1b9e104a573858ed596322294f80bed876b53d6353",
            "packages/compiler/src/frontend/program.ts": "8892f772dc1801fc7465da89de9c479a54cc4a45d6265d5dd4bfe9ae1b154130",
            "packages/compiler/src/frontend/resolve.ts": "61137787b745444a26ac2f2b2dd9938731b1f902b074351d3460aa9c536bd657",
            "packages/compiler/src/frontend/ts7/program-host.ts": "adc5a76dcda60708bed553f07e6401ebfb5440492df87497e73a51229d620d5e",
            "packages/compiler/src/frontend/npm-static-type-exports-host.ts": "a85deb5382748ff712e08a494856a12eaaff76f752a08e2effcec26107d0037c",
            "packages/compiler/src/frontend/program-node.ts": "ffb2931f97266923981eac111f04bfd441099f614fcb02860ef74a56b5c330a5",
            "packages/compiler/src/frontend/project-sidecars.ts": "89605378de27b0ea05dcf1d43814ce07c0c6f69ca696401223fe1b39ca0b1995",
            "packages/compiler/src/frontend/lowering/builtins/process.ts": "92db7d1019dadcb07bb2710f11e4238c47c89e9a05b2f77cdbb8099c1df8f40e",
            "packages/compiler/src/frontend/builtin-modules.ts": "59e413122acfbb61c57794ba62be50d08fa34804f7ae737f73161a8e03b87f9e",
            "packages/compiler/src/frontend/lowering/lower-builtin-values.ts": "5d22f7a84244eeec800104a249592249feff78b4dacc7aec1eadb99f7eec87fe",
            "packages/compiler/src/executable/prepare.ts": "299c8b71c40db653f10a8aef2dfef3e7c274309144bb6df577a7e2673de3a85d",
            "packages/compiler/src/node-islands/policy.ts": "e651aac43783cb63c37654d0d4e678db79569d22eb096ed91cfb061e9d338dcc",
            "packages/compiler/src/node-islands/modules.ts": "18d6288bfe7b274126cad65fb898b8d80e6c3f4082105f5867dd122b3a4beb54",
            "packages/compiler/src/index.ts": "33d01caceab22072703683256a406c29894f9c1fc87c66d2878703dbec1f691c",
            "packages/compiler/src/cli/command.ts": "1aedc02304a6fc5044d98c2102f53b77a41b5b92b1fd19df6edd2e48af6a60b4",
            "packages/compiler/src/diagnostics/envelope.ts": "edc9782d8f2935c6204d0d3f76023c6cd3cdc9c20a0fecfe1df75c0ae41143e1",
            "packages/runtime/src/scr_lib.c": "3b59b6e99e950f251260a7417fbf814a1bb4960d9657ecb9578a9ebe20ffa2ef",
            "packages/runtime/src/scr_node_builtin.c": "99ad4f3f795b1d70f7fabc99cffbebb613ff6a57ad0f8f21051d4971ec09d26f"
          };
          const openclawInputs = {
            "node-sqlite.mjs": "3d4ea2eaca499c7ece12ce75e4c47fe8c5d67c1c468b55a8e88139e25851870c",
            "node-sqlite.d.mts": "40da05d66d624b829a56aef9053d36df9782a4b5c4847c732752d78fd3e5fcc1",
            "node-version.mjs": "7227aeb44e2aa356dd7173f4e18bc1543c30e957609ee88e9279bd109c8219ba",
            "node-version.d.mts": "6477afab8530172170e18c6cfc30dbc6472bba7680c64f9f2e11e173c6ae2e08",
            "node-sqlite-capabilities.mjs": "bdc5cc1082ed101b02dc67dac8bc625adb9c65c3471bfa908f2bcd5470fc54a0",
            "node-sqlite-capabilities.d.mts": "579ece58ca424a210e769ad2fdc96ae8c71911dae3e8ce7ac6f9ec87e24ebad9",
          };
          const entry = join(fixture, "main.mts");
          const verifyFixture = () => {
            for (const [file, expected] of Object.entries(openclawInputs)) assert.equal(hash(join(fixture, file)), expected, file);
            assert.equal(hash(entry), report.fixtureSha256);
          };
          const moduleFiles = (dir, base = dir) => readdirSync(dir).sort().flatMap(name => {
            const path = join(dir, name), info = lstatSync(path);
            if (info.isDirectory()) return moduleFiles(path, base);
            assert.ok(info.isFile(), "unexpected non-file in shipped module tree");
            return [{ path: relative(base, path), size: info.size, sha256: hash(path) }];
          });
          const source = () => {
            assert.equal(execute("source-head", "git", ["rev-parse", "HEAD"]), head);
            assert.equal(execute("source-status", "git", ["status", "--porcelain"]), "");
            for (const [file, expected] of Object.entries(inputs)) assert.equal(hash(file), expected, file);
            report.inputs = inputs;
          };
          const validateOracle = result => {
            assert.equal(result.node, "24.22.1");
            for (const key of ["available", "text", "blob", "json"]) assert.equal(result.sqlite[key], true, key);
            assert.equal(typeof result.sqlite.version, "string");
            assert.equal(Object.hasOwn(result.sqlite, "error"), false);
            assert.equal(result.failure, null);
          };
          save();
          try {
            source(); report.sourceVerifiedBefore = true;
            assert.equal(process.platform, "linux"); assert.equal(process.arch, "x64");
            assert.equal(process.version, "v24.22.1"); assert.notEqual(process.getuid(), 0);
            report.host = { node: process.version, uid: process.getuid(), platform: process.platform, arch: process.arch };
            report.tools = {
              pnpm: execute("pnpm-version", "pnpm", ["--version"]),
              llvm: execute("llvm-version", "llvm-config", ["--version"]),
              zig: execute("zig-version", "zig", ["version"]),
            };
            assert.deepEqual(report.tools, { pnpm: "11.1.3", llvm: "22.1.8", zig: "0.16.0" });
            execute("runtime-pack-verify", process.execPath, ["packages/runtime-linux-x64-gnu/scripts/verify.mjs"]);
            const runtimeManifest = "packages/runtime-linux-x64-gnu/runtime-pack.json";
            const runtime = JSON.parse(readFileSync(runtimeManifest, "utf8"));
            assert.equal(runtime.runtime_abi.version, 48);
            assert.equal(runtime.runtime_abi.marker, "scr_runtime_abi_v48");
            report.runtimePack = { abi: runtime.runtime_abi, manifestSha256: hash(runtimeManifest) };

            assert.equal(existsSync(fixture), false, "fixture already exists");
            mkdirSync(fixture);
            for (const [file, expected] of Object.entries(openclawInputs)) {
              const url = "https://raw.githubusercontent.com/openclaw/openclaw/" + openclawHead + "/" + file;
              execute("fetch-" + file, "curl", ["--fail", "--location", "--silent", "--show-error", "--connect-timeout", "15", "--max-time", "45", "--max-filesize", "65536", "--output", join(fixture, file), url]);
              assert.equal(hash(join(fixture, file)), expected, file);
            }
            report.openclawInputs = openclawInputs;
            writeFileSync(entry, [
              'import { detectCurrentSqliteCapabilities, nodeRuntimeFailure } from "./node-sqlite.mjs";',
              'const node = process.versions.node;',
              'const probe = await detectCurrentSqliteCapabilities();',
              'const failure = nodeRuntimeFailure(node, probe);',
              'const sqlite = { available: probe.available, version: probe.version, text: probe.text,',
              '  blob: probe.blob, json: probe.json, error: probe.error };',
              'console.log(JSON.stringify({ node, sqlite, failure }));',
              '',
            ].join("\n"));
            report.fixtureSha256 = hash(entry);
            verifyFixture(); report.fixtureVerifiedBefore = true;
            const oracle = JSON.parse(execute("node-oracle", process.execPath, [entry], 60, { SCRIPTC_SAN: "" }));
            report.results.node = oracle;
            validateOracle(oracle);
            for (const mode of ["native", "island"]) {
              const island = mode === "island";
              const modeReport = report.modes[mode] = {
                policy: island ? "explicit" : "off",
                requestedAdmissionExecution: island ? "embedded-node" : "native",
                markedModules: island ? ["node-sqlite.mjs"] : [],
                libnodePlacement: island ? "beside" : "none", cases: {},
                setup: { status: island ? "pending" : "not-required" },
              };
              report.results[mode] = {};
              let readLibnodePack, pack;
              if (island) {
                try {
                  assert.equal(existsSync(process.env.SCRIPTC_LIBNODE), false, "libnode output already exists");
                  execute("prepare-dev-libnode", process.execPath, ["packages/libnode-common/fetch-dev-pack.mjs", "--out", process.env.SCRIPTC_LIBNODE], 600);
                  ({ readLibnodePack } = await import(pathToFileURL(join(root, "packages/compiler/dist/node-islands/libnode-pack.js"))));
                  pack = readLibnodePack(process.env.SCRIPTC_LIBNODE, { verifyHashes: true });
                  assert.equal(pack.manifest.nodeVersion, "24.22.1"); assert.equal(pack.manifest.bridgeAbi, 10);
                  assert.equal(pack.manifest.platform, "linux"); assert.equal(pack.manifest.arch, "x64");
                  report.libnode = { manifest: pack.manifest, manifestSha256: hash(join(pack.root, "manifest.json")) };
                  modeReport.setup.status = "passed";
                } catch (error) {
                  modeReport.setup = { status: "failed", error: scrub(error.stack ?? error) };
                  for (const flavor of ["plain", "san"]) modeReport.cases[flavor] = {
                    status: "setup-failed", reason: "explicit island libnode setup failed",
                    compile: { status: "not-reached" }, execution: { status: "not-reached" }, parity: "not-compared",
                  };
                  save(); continue;
                }
              }
              let frontendRefusal = false;
              for (const flavor of ["plain", "san"]) {
                const name = mode + "-" + flavor;
                const observed = modeReport.cases[flavor] = {
                  status: "running", compile: { status: "not-started" }, execution: { status: "not-reached" }, parity: "not-compared",
                };
                if (frontendRefusal) {
                  Object.assign(observed, { status: "not-reached", reason: "plain compilation refused in the frontend" });
                  observed.compile.status = "not-reached"; save(); continue;
                }
                try {
                  verifyFixture();
                  const binary = join(fixture, "sqlite-" + name), cache = join(fixture, "cache-" + name);
                  assert.equal(existsSync(binary), false); assert.equal(existsSync(binary + ".libnode"), false);
                  mkdirSync(cache, { mode: 0o700 });
                  const env = { SCRIPTC_CACHE_DIR: cache, SCRIPTC_SAN: "", SCRIPTC_LIBNODE: island ? pack.root : "" };
                  const args = ["packages/cli/dist/main.js", "build", entry, "--print=diagnostics", "-o", binary,
                    ...(island ? ["--node-islands=explicit", "--node-island=" + join(fixture, "node-sqlite.mjs"), "--libnode=beside"] : ["--node-islands=off"])];
                  if (flavor === "san") args.push("--sanitize");
                  const compiled = execute("compile-" + name, process.execPath, args, 600, env, true);
                  observed.compile = { status: processOutcome(compiled), code: compiled.code, signal: compiled.signal, error: compiled.error, step: compiled.step };
                  assert.equal(compiled.error, undefined); assert.equal(compiled.signal, null);
                  assert.ok(compiled.code === 0 || compiled.code === 1, "compiler did not produce a normal result");
                  observed.compile.status = "invalid-diagnostics";
                  const diagnostics = JSON.parse(compiled.stdout);
                  assert.equal(diagnostics.schema, "scriptc-diagnostics"); assert.equal(diagnostics.schemaVersion, 1);
                  assert.equal(diagnostics.command, "build"); assert.equal(diagnostics.entry, entry);
                  assert.ok(Array.isArray(diagnostics.diagnostics));
                  observed.compile.diagnostics = diagnostics;
                  const errors = diagnostics.diagnostics.filter(item => item.severity === "error");
                  if (compiled.code !== 0) {
                    assert.equal(diagnostics.success, false); assert.ok(errors.length > 0);
                    const refused = ["preflight", "compile"].includes(diagnostics.phase) &&
                      errors.every(item => ["invalid-source", "unsupported"].includes(item.category));
                    observed.compile.status = refused ? "frontend-refusal" : "failed";
                    frontendRefusal = flavor === "plain" && refused;
                    throw new Error(name + " compilation failed; see recorded diagnostics");
                  }
                  assert.equal(diagnostics.success, true); assert.equal(diagnostics.phase, "complete");
                  assert.equal(diagnostics.artifact, binary); assert.equal(errors.length, 0);
                  observed.compile.status = "passed";
                  const notes = diagnostics.diagnostics.filter(item => item.code === "SC8001");
                  if (island) {
                    assert.equal(notes.length, 1, "explicit island selection differs");
                    assert.equal(notes[0].file, join(fixture, "node-sqlite.mjs"));
                  } else assert.equal(notes.length, 0, "native case selected a Node island");
                  const artifact = report.artifacts[name] = { binarySha256: hash(binary), binaryBytes: lstatSync(binary).size };
                  if (island) {
                    const beside = readLibnodePack(binary + ".libnode", { verifyHashes: true });
                    assert.deepEqual(beside.manifest, pack.manifest);
                    artifact.libnodeManifestSha256 = hash(join(beside.root, "manifest.json"));
                    artifact.modules = moduleFiles(join(beside.root, "modules"));
                    for (const [file, expected] of Object.entries(openclawInputs).filter(([file]) => file.endsWith(".mjs"))) {
                      const copies = artifact.modules.filter(item => basename(item.path) === file);
                      assert.equal(copies.length, 1, "missing or duplicated shipped module: " + file);
                      assert.equal(copies[0].sha256, expected, file);
                    }
                  } else assert.equal(existsSync(binary + ".libnode"), false, "native case produced a beside libnode pack");
                  observed.execution.status = "started"; save();
                  const executed = execute("execute-" + name, binary, [], 60, { ...env, SCRIPTC_LIBNODE: "" }, true);
                  observed.execution = { status: processOutcome(executed), code: executed.code, signal: executed.signal, error: executed.error, step: executed.step };
                  assert.equal(observed.execution.status, "completed", name + " execution failed");
                  const actual = JSON.parse(executed.stdout);
                  report.results[mode][flavor] = actual;
                  observed.admissionAccepted = actual.failure === null;
                  observed.callerNode = actual.node;
                  assert.equal(hash(binary), artifact.binarySha256);
                  if (island) {
                    assert.deepEqual(readLibnodePack(binary + ".libnode", { verifyHashes: true }).manifest, pack.manifest);
                    assert.deepEqual(moduleFiles(join(binary + ".libnode", "modules")), artifact.modules);
                  } else assert.equal(existsSync(binary + ".libnode"), false);
                  observed.parity = "mismatch";
                  assert.deepEqual(actual, oracle, name + " differs from the Node oracle");
                  observed.parity = "matched"; observed.status = "passed";
                } catch (error) {
                  observed.status = "failed"; observed.error = scrub(error.stack ?? error);
                } finally {
                  verifyFixture(); save();
                }
              }
            }
            report.diagnosticComplete = Object.values(report.modes).length === 2 &&
              Object.values(report.modes).every(mode => Object.keys(mode.cases).length === 2 &&
                Object.values(mode.cases).every(result => ["passed", "failed", "not-reached", "setup-failed"].includes(result.status)));
            assert.equal(report.diagnosticComplete, true, "incomplete mode inventory");
            assert.ok(Object.values(report.modes).every(mode => Object.values(mode.cases).every(result => result.status === "passed")),
              "launcher qualification refused, mismatched, or incomplete; see per-mode results");
            verifyFixture();
            report.qualificationComplete = true;
            report.status = "passed";
          } catch (error) {
            report.status = "failed"; report.error = scrub(error.stack ?? error); process.exitCode = 1;
          } finally {
            try { source(); report.sourceVerifiedAfter = true; }
            catch (error) { report.status = "failed"; report.sourceError = scrub(error.stack ?? error); process.exitCode = 1; }
            if (report.fixtureSha256 !== undefined) {
              try { verifyFixture(); report.fixtureVerifiedAfter = true; }
              catch (error) { report.status = "failed"; report.fixtureError = scrub(error.stack ?? error); process.exitCode = 1; }
            }
            if (report.status !== "passed") report.qualificationComplete = false;
            report.finishedAt = new Date().toISOString(); save();
            console.log(JSON.stringify({ status: report.status, results: report.results, scope: report.scope }));
            if (process.exitCode) console.error("[openclaw-sqlite-island] FAILED (exit 1)");
          }
          PROOF
          ulimit -c 0
          node "$RUNNER_TEMP/openclaw-sqlite-island.mjs"
      - name: Retain a failed setup receipt
        if: always()
        run: |
          node --input-type=module <<'RECEIPT'
          import { spawnSync } from "node:child_process";
          import { existsSync, mkdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const out = join(process.env.RUNNER_TEMP, "openclaw-sqlite-proof");
          const summary = join(out, "summary.json");
          if (!existsSync(summary)) {
            mkdirSync(out, { recursive: true });
            const head = spawnSync("git", ["rev-parse", "HEAD"], { encoding: "utf8", timeout: 30000, maxBuffer: 65536 });
            const status = spawnSync("git", ["status", "--porcelain"], { encoding: "utf8", timeout: 30000, maxBuffer: 65536 });
            writeFileSync(summary, JSON.stringify({
              source: "923a57d63cc1a32324cd0a4d514935db3f2ad264",
              openclawSource: "6f8c9bad8bd1a8c339f2d61985e637f9e557550d",
              workflow: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
              attempt: process.env.GITHUB_RUN_ATTEMPT, status: "failed",
              error: "setup failed before the proof runner produced a receipt",
              scope: "unchanged OpenClaw launcher admission in native and explicit module island modes",
