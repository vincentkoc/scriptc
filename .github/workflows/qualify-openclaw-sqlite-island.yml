name: Qualify OpenClaw SQLite admission through embedded Node

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/qualify-openclaw-sqlite-island.yml]

permissions:
  contents: read

concurrency:
  group: qualify-openclaw-sqlite-island
  cancel-in-progress: false

jobs:
  sqlite_island:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: 16e10a269eabd82fe42f22d314e87a33ffc16969
          persist-credentials: false
      - name: Verify source before setup
        run: |
          test "$(git rev-parse HEAD)" = 16e10a269eabd82fe42f22d314e87a33ffc16969
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: ./.github/actions/llvm-linux
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zig
      - uses: ./.github/actions/native-packages
        with:
          target: linux-x64-gnu
      - run: pnpm build
      - name: Disable piped core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Compare the unchanged admission module with Node
        env:
          SCRIPTC_LIBNODE: ${{ runner.temp }}/openclaw-libnode
        run: |
          cat > "$RUNNER_TEMP/openclaw-sqlite-island.mjs" <<'PROOF'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { existsSync, mkdirSync, readFileSync, symlinkSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { pathToFileURL } from "node:url";

          const root = process.cwd();
          const head = "16e10a269eabd82fe42f22d314e87a33ffc16969";
          const openclawHead = "6f8c9bad8bd1a8c339f2d61985e637f9e557550d";
          const out = join(process.env.RUNNER_TEMP, "openclaw-sqlite-proof");
          const fixture = join(process.env.RUNNER_TEMP, "openclaw-sqlite-fixture");
          mkdirSync(out, { recursive: true });
          const report = {
            source: head, openclawSource: openclawHead,
            workflow: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT, status: "running",
            scope: "compiled SQLite admission using embedded Node",
            pureNativeSqlite: false, completeGateway: false, completeSuite: false,
            startedAt: new Date().toISOString(), steps: [], results: {}, artifacts: {},
          };
          const hash = path => createHash("sha256").update(readFileSync(path)).digest("hex");
          const scrub = value => String(value).split(root).join("<repo>").split(process.env.RUNNER_TEMP).join("<temp>");
          const save = () => writeFileSync(join(out, "summary.json"), scrub(JSON.stringify(report, null, 2)) + "\n");
          let sequence = 0;
          const execute = (name, command, args, seconds = 60, env = {}) => {
            const stem = String(++sequence).padStart(2, "0") + "-" + name;
            const start = Date.now();
            // GNU timeout owns the command group and escalates TERM after five seconds.
            const result = spawnSync("timeout", ["--signal=TERM", "--kill-after=5s", seconds + "s", command, ...args], {
              cwd: root, env: { ...process.env, ...env }, encoding: "utf8",
              maxBuffer: 1024 * 1024, killSignal: "SIGTERM",
            });
            const stdout = result.stdout ?? "", stderr = result.stderr ?? "";
            writeFileSync(join(out, stem + ".stdout.log"), stdout);
            writeFileSync(join(out, stem + ".stderr.log"), stderr);
            report.steps.push({
              name, command, args, seconds: (Date.now() - start) / 1000,
              limitSeconds: seconds, code: result.status, signal: result.signal,
              error: result.error?.message, stdout: stem + ".stdout.log", stderr: stem + ".stderr.log",
              stdoutSha256: hash(join(out, stem + ".stdout.log")),
              stderrSha256: hash(join(out, stem + ".stderr.log")),
            });
            save();
            if (result.error || result.status !== 0 || result.signal)
              throw new Error(name + " failed: " + scrub(JSON.stringify({ code: result.status, signal: result.signal, error: result.error?.message, stderr: stderr.slice(-4000) })));
            return stdout.trim();
          };
          const inputs = {
            "packages/compiler/src/backend/runtime-abi.ts": "8e4d37b4b31b2bc03e93398f340534e8d72b4c6685b71823cd1d172b08116bd0",
            "packages/compiler/src/node-islands/libnode.ts": "2edc204155bf59fd173a1e940b469e097eb6e4442c62ddd0b5f227a4a028816d",
            "packages/compiler/src/node-islands/libnode-pack.ts": "4c08376cd8d4869a5fdc633e7f143b3b86746e80955cc0b9ce8afe7a63d370fd",
            "packages/libnode-common/dev-pack.json": "5e3480eb55bdc799ced4bc963265728d037847b93f45691bf5eaeaf7efe66c7b",
            "packages/libnode-common/fetch-dev-pack.mjs": "d99c18e0d407f3aebc5470449a7fb10958e172f731c13c45a1ebf472f07eff71",
            "packages/node/index.js": "3f4ada7e53d93fc7b57c27540f8e4f5f19f3dbbf190de8f33a8c35604876b665",
            "packages/node/index.d.ts": "00f09914126b6f3e72d4cb10c2d04820f9dcf5d164b5431f12a721fb2e85f803",
            "packages/runtime/src/scr_node_bridge.h": "ba7341a77633ab992e2059ec3377292a7d524fa8c30156cc8c50532c97f50d16",
            "packages/runtime/src/scr_array.c": "7648691ca463e216ab20c9b86b4353e011ae342c0b6101c573f9371d0d71360d",
            "packages/runtime/src/scr_message.c": "12b7d3d7f7317cad6f3ee6ae8f5029737bff48961f959f0571d1c3484bb276bf",
            "packages/runtime/src/scr_region.c": "9f6c6ffac906d79c9c643a043cabdb117c5576cbc85190e174f2d863425fdf30",
            "pnpm-lock.yaml": "f4bfbdc670252a428c20be1b9e104a573858ed596322294f80bed876b53d6353",
          };
          const source = () => {
            assert.equal(execute("source-head", "git", ["rev-parse", "HEAD"]), head);
            assert.equal(execute("source-status", "git", ["status", "--porcelain"]), "");
            for (const [file, expected] of Object.entries(inputs)) assert.equal(hash(file), expected, file);
            report.inputs = inputs;
          };
          const validate = result => {
            assert.equal(result.node, "24.22.1");
            for (const key of ["available", "text", "blob", "json"]) assert.equal(result.sqlite[key], true, key);
            assert.equal(typeof result.sqlite.version, "string");
            assert.equal(Object.hasOwn(result.sqlite, "error"), false);
            assert.equal(result.walSafe, true);
          };
          save();
          try {
            source(); report.sourceVerifiedBefore = true;
            assert.equal(process.platform, "linux"); assert.equal(process.arch, "x64");
            assert.equal(process.version, "v24.22.1"); assert.notEqual(process.getuid(), 0);
            report.host = { node: process.version, uid: process.getuid(), platform: process.platform, arch: process.arch };
            report.tools = {
              pnpm: execute("pnpm-version", "pnpm", ["--version"]),
              llvm: execute("llvm-version", "llvm-config", ["--version"]),
              zig: execute("zig-version", "zig", ["version"]),
            };
            assert.deepEqual(report.tools, { pnpm: "11.1.3", llvm: "22.1.8", zig: "0.16.0" });
            execute("runtime-pack-verify", process.execPath, ["packages/runtime-linux-x64-gnu/scripts/verify.mjs"]);
            const runtimeManifest = "packages/runtime-linux-x64-gnu/runtime-pack.json";
            const runtime = JSON.parse(readFileSync(runtimeManifest, "utf8"));
            assert.equal(runtime.runtime_abi.version, 49);
            assert.equal(runtime.runtime_abi.marker, "scr_runtime_abi_v49");
            report.runtimePack = { abi: runtime.runtime_abi, manifestSha256: hash(runtimeManifest) };

            assert.equal(existsSync(process.env.SCRIPTC_LIBNODE), false, "libnode output already exists");
            execute("prepare-dev-libnode", process.execPath, ["packages/libnode-common/fetch-dev-pack.mjs", "--out", process.env.SCRIPTC_LIBNODE], 600);
            const { readLibnodePack } = await import(pathToFileURL(join(root, "packages/compiler/dist/node-islands/libnode-pack.js")));
            const pack = readLibnodePack(process.env.SCRIPTC_LIBNODE, { verifyHashes: true });
            assert.equal(pack.manifest.nodeVersion, "24.22.1"); assert.equal(pack.manifest.bridgeAbi, 10);
            assert.equal(pack.manifest.platform, "linux"); assert.equal(pack.manifest.arch, "x64");
            report.libnode = { manifest: pack.manifest, manifestSha256: hash(join(pack.root, "manifest.json")) };

            assert.equal(existsSync(fixture), false, "fixture already exists");
            mkdirSync(join(fixture, "node_modules", "@scriptc"), { recursive: true });
            symlinkSync(join(root, "packages/node"), join(fixture, "node_modules", "@scriptc", "node"), "dir");
            const openclawInputs = {
              "node-sqlite-capabilities.mjs": "bdc5cc1082ed101b02dc67dac8bc625adb9c65c3471bfa908f2bcd5470fc54a0",
              "node-sqlite-capabilities.d.mts": "579ece58ca424a210e769ad2fdc96ae8c71911dae3e8ce7ac6f9ec87e24ebad9",
            };
            for (const [file, expected] of Object.entries(openclawInputs)) {
              const url = "https://raw.githubusercontent.com/openclaw/openclaw/" + openclawHead + "/" + file;
              execute("fetch-" + file, "curl", ["--fail", "--location", "--silent", "--show-error", "--connect-timeout", "15", "--max-time", "45", "--max-filesize", "65536", "--output", join(fixture, file), url]);
              assert.equal(hash(join(fixture, file)), expected, file);
            }
            report.openclawInputs = openclawInputs;
            const entry = join(fixture, "main.mts");
            writeFileSync(entry, [
              'import { requireModule } from "@scriptc/node";',
              'import { probeSqlite, isSqliteWalResetSafeVersion } from "./node-sqlite-capabilities.mjs";',
              'const DatabaseSync = requireModule("node:sqlite").DatabaseSync;',
              'const node = requireModule("node:process").versions.node;',
              'const sqlite = probeSqlite(DatabaseSync);',
              'const walSafe = isSqliteWalResetSafeVersion(sqlite.version ?? "");',
              'console.log(JSON.stringify({ node, sqlite, walSafe }));',
              '',
            ].join("\n"));
            report.fixtureSha256 = hash(entry);
            const cache = join(fixture, "cache");
            mkdirSync(cache, { mode: 0o700 });
            const env = { SCRIPTC_CACHE_DIR: cache, SCRIPTC_SAN: "" };
            const oracle = JSON.parse(execute("node-oracle", process.execPath, [entry], 60, env));
            report.results.node = oracle;
            validate(oracle);
            for (const flavor of ["plain", "san"]) {
              const binary = join(fixture, "sqlite-" + flavor);
              const args = ["packages/cli/dist/main.js", "build", entry, "--node-islands=off", "--libnode=beside", "-o", binary];
              if (flavor === "san") args.push("--sanitize");
              execute("compile-" + flavor, process.execPath, args, 600, env);
              const beside = readLibnodePack(binary + ".libnode", { verifyHashes: true });
              assert.deepEqual(beside.manifest, pack.manifest);
              report.artifacts[flavor] = { binarySha256: hash(binary), libnodeManifestSha256: hash(join(beside.root, "manifest.json")) };
              const actual = JSON.parse(execute("native-" + flavor, binary, [], 60, { ...env, SCRIPTC_LIBNODE: "" }));
              report.results[flavor] = actual;
              validate(actual);
              assert.deepEqual(actual, oracle, flavor + " differs from the Node oracle");
            }
            for (const [file, expected] of Object.entries(openclawInputs)) assert.equal(hash(join(fixture, file)), expected, file);
            assert.equal(hash(entry), report.fixtureSha256);
            report.status = "passed";
          } catch (error) {
            report.status = "failed"; report.error = scrub(error.stack ?? error); process.exitCode = 1;
          } finally {
            try { source(); report.sourceVerifiedAfter = true; }
            catch (error) { report.status = "failed"; report.sourceError = scrub(error.stack ?? error); process.exitCode = 1; }
            report.finishedAt = new Date().toISOString(); save();
            console.log(JSON.stringify({ status: report.status, results: report.results, scope: report.scope }));
            if (process.exitCode) console.error("[openclaw-sqlite-island] FAILED (exit 1)");
          }
          PROOF
          ulimit -c 0
          node "$RUNNER_TEMP/openclaw-sqlite-island.mjs"
      - name: Retain a failed setup receipt
        if: always()
        run: |
          node --input-type=module <<'RECEIPT'
          import { spawnSync } from "node:child_process";
          import { existsSync, mkdirSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const out = join(process.env.RUNNER_TEMP, "openclaw-sqlite-proof");
          const summary = join(out, "summary.json");
          if (!existsSync(summary)) {
            mkdirSync(out, { recursive: true });
            const head = spawnSync("git", ["rev-parse", "HEAD"], { encoding: "utf8", timeout: 30000, maxBuffer: 65536 });
            const status = spawnSync("git", ["status", "--porcelain"], { encoding: "utf8", timeout: 30000, maxBuffer: 65536 });
            writeFileSync(summary, JSON.stringify({
              source: "16e10a269eabd82fe42f22d314e87a33ffc16969",
              openclawSource: "6f8c9bad8bd1a8c339f2d61985e637f9e557550d",
              workflow: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID,
              attempt: process.env.GITHUB_RUN_ATTEMPT, status: "failed",
              error: "setup failed before the proof runner produced a receipt",
              scope: "compiled SQLite admission using embedded Node",
              pureNativeSqlite: false, completeGateway: false, completeSuite: false,
              sourceVerifiedAfter: head.status === 0 && status.status === 0 && head.stdout.trim() === "16e10a269eabd82fe42f22d314e87a33ffc16969" && status.stdout.trim() === "",
              finishedAt: new Date().toISOString(),
            }, null, 2) + "\n");
            console.error("[openclaw-sqlite-island] FAILED (exit 1)");
            process.exitCode = 1;
          }
          RECEIPT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openclaw-sqlite-island-proof
          path: ${{ runner.temp }}/openclaw-sqlite-proof
          if-no-files-found: error
          retention-days: 1
