dev-pack.json":"5e3480eb55bdc799ced4bc963265728d037847b93f45691bf5eaeaf7efe66c7b","packages/libnode-common/libnode.json":"af6fc033baae9d327edd68e350590d0ba16f434b4bb744e769bf49edb39acb93","packages/libnode-common/fetch-dev-pack.mjs":"d99c18e0d407f3aebc5470449a7fb10958e172f731c13c45a1ebf472f07eff71","packages/libnode-common/build-pack.mjs":"3315dc1e0a0dcf9239f93bb2674a2b3ee77abd5420a70c651c982407f8b4453f","packages/libnode-common/scripts/verify.mjs":"051fd399d29bddc8f757213ee00d5f6c1d200755266b0ebe86b7603462de503a"};
          const nativeInputSha256="35ebd589a5df0336f1219abfd535c91fe9c15bfd3a62af36e74303e7c63e436b";
          const consumerIdentity={workflow:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT};
          const fixture="tests/corpus/array-element-compound-updates.ts", harness="tests/harness/llvm-differential.test.ts";
          const invocation={command:"pnpm",args:["test",harness,"-t","array-element-compound-updates\\.ts$","--reporter=verbose"],env:{SCRIPTC_TEST_SHARD:"5/5",SCRIPTC_TEST_WORKERS:"4",SCRIPTC_TIMING:"1"},testTimeoutMs:300000,outerDiagnosticSeconds:420};
          const digest=b=>createHash("sha256").update(b).digest("hex"), hash=p=>digest(readFileSync(p)), json=p=>JSON.parse(readFileSync(p,"utf8"));
          const save=(name,value)=>writeFileSync(join(out,name),JSON.stringify(value,null,2)+"\n");
          const record=p=>({path:relative(out,p),bytes:statSync(p).size,sha256:hash(p)});
          function capture(command,args=[],cwd=root){
            const r=spawnSync(command,args,{cwd,encoding:"utf8",timeout:30000,maxBuffer:4*1024*1024});
            assert.equal(r.error,undefined,command+" launch failed");assert.equal(r.status,0,command+" failed: "+r.stderr);return r.stdout.trim();
          }
          function verifyWorkOwner(){
            const s=lstatSync(work);assert.ok(s.isDirectory()&&!s.isSymbolicLink());assert.equal(s.mode&0o777,0o700);
