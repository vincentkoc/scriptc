name: Diagnose array update timeout

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/diagnose-array-update-timeout.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-array-update-timeout
  cancel-in-progress: false

jobs:
  replay:
    if: github.repository == 'vincentkoc/scriptc'
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: 8b9f7981e9198831474bbbe2eb47c48407daa380
          persist-credentials: false
      - name: Verify frozen source
        run: |
          test "$(git rev-parse HEAD)" = 8b9f7981e9198831474bbbe2eb47c48407daa380
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Authenticate original macOS native artifact
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'DOWNLOAD'
          import base64, hashlib, json, os, shutil, stat, tarfile, urllib.error, urllib.parse, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          BASE = Path(os.environ["RUNNER_TEMP"])
          OUT, WORK = BASE / "array-update-timeout-proof", BASE / "array-update-timeout-work"
          SOURCE = Path(os.environ["GITHUB_WORKSPACE"])
          ORIGIN = {"workflow": "5fed39a85f7f342cef8d2140da11a765ffda046d", "run": "41257029033", "attempt": "1", "job": 124702332619, "source": "8b9f7981e9198831474bbbe2eb47c48407daa380"}
          ARTIFACT = 13063817961
          ZIP_SHA = "7d690ac3345d40c7a4d097cd879179b536415dd80980ea84aa88088cc3ffbe05"
          CONSUMER = {"workflow": os.environ["GITHUB_SHA"], "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          OUT.mkdir()
          WORK.mkdir(mode=0o700)
          with (WORK / "owner.json").open("x") as marker:
              marker.write(json.dumps(CONSUMER, sort_keys=True) + "\n")
          receipt = {"origin": ORIGIN, "consumer": CONSUMER, "verified": False}
          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()
          def safe_name(name):
              path = PurePosixPath(name)
              assert name and "\\" not in name and "\0" not in name, "invalid archive path characters"
              assert not path.is_absolute() and ".." not in path.parts, "absolute or parent archive path"
              assert path.as_posix() == name.rstrip("/") and path.parts, "noncanonical archive path"
              return path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None
          stage = "metadata"
          try:
              token = os.environ.pop("GH_TOKEN")
              opener = urllib.request.build_opener(NoRedirect)
              headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "scriptc-array-update-timeout-diagnostic"}
              def api(path):
                  with opener.open(urllib.request.Request("https://api.github.com/repos/vincentkoc/scriptc/" + path, headers=headers), timeout=120) as response:
                      raw = response.read(1024**2 + 1)
                  assert len(raw) <= 1024**2, "API response exceeds budget"
                  return json.loads(raw)
              metadata = api(f"actions/artifacts/{ARTIFACT}")
              assert metadata["id"] == ARTIFACT and metadata["name"] == "native-darwin-arm64" and metadata["expired"] is False, "artifact identity or expiry mismatch"
              assert metadata["size_in_bytes"] == 58756782 and metadata["digest"] == "sha256:" + ZIP_SHA, "artifact ZIP metadata mismatch"
              assert str(metadata["workflow_run"]["id"]) == ORIGIN["run"] and metadata["workflow_run"]["head_sha"] == ORIGIN["workflow"], "artifact producer mismatch"
              stage = "job"
              job = api(f"actions/jobs/{ORIGIN['job']}")
              assert job["run_id"] == int(ORIGIN["run"]) and job["head_sha"] == ORIGIN["workflow"], "native job producer mismatch"
              assert job["conclusion"] == "success" and job["status"] == "completed", "native producer did not complete successfully"
              assert job["name"] == "build (macOS arm64 native packages)", "native job name mismatch"
              assert all(step["conclusion"] in ("success", "skipped") for step in job["steps"]), "native job step failed"
              stage = "producer-workflow"
              definition = api("contents/.github/workflows/ci.yml?ref=5fed39a85f7f342cef8d2140da11a765ffda046d")
              assert definition["encoding"] == "base64", "producer workflow encoding mismatch"
              definition_bytes = base64.b64decode(definition["content"])
              assert hashlib.sha256(definition_bytes).hexdigest() == "e6047a8521e791c590321c4c627d80ad48b81e3095355e8510f19153c70ac188", "producer workflow identity mismatch"
              receipt["producerWorkflowSha256"] = "e6047a8521e791c590321c4c627d80ad48b81e3095355e8510f19153c70ac188"
              stage = "download"
              try:
                  response = opener.open(urllib.request.Request(f"https://api.github.com/repos/vincentkoc/scriptc/actions/artifacts/{ARTIFACT}/zip", headers=headers), timeout=120)
              except urllib.error.HTTPError as error:
                  assert error.code == 302, "artifact redirect refused"
                  location = error.headers.get("Location", "")
                  error.close()
                  parsed = urllib.parse.urlsplit(location)
                  assert parsed.scheme == "https" and parsed.hostname and not parsed.username and not parsed.password, "invalid artifact storage redirect"
                  response = opener.open(urllib.request.Request(location), timeout=120)
              archive = WORK / "native.zip"
              size = 0
              with response, archive.open("xb") as output:
                  while block := response.read(1024 * 1024):
                      size += len(block)
                      assert size <= 128 * 1024**2, "ZIP download exceeds budget"
                      output.write(block)
              assert size == 58756782 and digest(archive) == ZIP_SHA, "downloaded ZIP identity mismatch"
              tar_path = WORK / "native-darwin-arm64.tar.gz"
              stage = "zip"
              with zipfile.ZipFile(archive) as bundle:
                  entries = bundle.infolist()
                  assert len(entries) == 1 and entries[0].filename == tar_path.name, "ZIP member inventory mismatch"
                  item = entries[0]
                  assert stat.S_IFMT(item.external_attr >> 16) in (0, stat.S_IFREG) and not item.flag_bits & 1, "unsafe ZIP member type"
                  assert 0 < item.file_size <= 256 * 1024**2, "ZIP expansion exceeds budget"
                  with bundle.open(item) as stream, tar_path.open("xb") as output:
                      shutil.copyfileobj(stream, output, 1024 * 1024)
                  assert tar_path.stat().st_size == item.file_size, "ZIP entry size mismatch"
              allowed = ["packages/llvm-darwin-arm64/bin", "packages/runtime-darwin-arm64/artifacts", "packages/runtime-darwin-arm64/runtime-pack.json"]
              files, seen = [], set()
              stage = "tar"
              with tarfile.open(tar_path, "r:gz") as bundle:
                  members = bundle.getmembers()
                  assert 0 < len(members) <= 20000 and sum(item.size for item in members) <= 2 * 1024**3, "tar inventory exceeds budget"
                  for item in members:
                      name = safe_name(item.name).as_posix()
                      assert name not in seen, "duplicate tar member"
                      seen.add(name)
                      assert any(name == prefix or name.startswith(prefix + "/") for prefix in allowed), "tar member outside native artifact roots"
                      assert item.isdir() or item.isfile(), "links and special files are not admitted"
                      assert not item.mode & 0o7000, "unsafe tar permissions"
                      target = SOURCE / name
                      assert not target.is_symlink() and not target.exists(), "native artifact would overwrite an existing path"
                      assert all(not parent.is_symlink() for parent in target.parents if parent != SOURCE.parent), "symlink in extraction parent"
                  for item in members:
                      target = SOURCE / item.name
                      if item.isdir():
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with bundle.extractfile(item) as stream, target.open("xb") as output:
                          shutil.copyfileobj(stream, output, 1024 * 1024)
                      target.chmod(item.mode & 0o777)
                      assert target.stat().st_size == item.size, "tar entry size mismatch"
                      files.append({"path": item.name, "bytes": item.size, "sha256": digest(target)})
              receipt.update({"artifact": ARTIFACT, "name": metadata["name"], "zipBytes": size, "zipSha256": ZIP_SHA, "tarSha256": digest(tar_path), "files": sorted(files, key=lambda row: row["path"]), "verified": True})
              archive.unlink()
              tar_path.unlink()
          except Exception as error:
              # HTTP exception text can contain signed storage URLs; never publish it.
              receipt["failureType"] = type(error).__name__
              receipt["failureStage"] = stage
              if isinstance(error, urllib.error.HTTPError):
                  receipt["httpStatus"] = error.code
              if isinstance(error, AssertionError):
                  receipt["admissionReason"] = str(error)
              print("[array-update-timeout-download] FAILED (exit 1)")
              raise SystemExit(1)
          finally:
              (OUT / "native-origin.json").write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          DOWNLOAD
      - name: Prepare owned replay observer
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/array-update-timeout-proof"
          cat > "$RUNNER_TEMP/array-update-timeout-proof/observe.py" <<'OBSERVER'
          import ctypes, errno, hashlib, json, os, struct, subprocess, sys
          group = int(sys.argv[1])
          assert group > 1 and group != os.getpgrp()
          libc = ctypes.CDLL(None, use_errno=True)
          libproc = ctypes.CDLL("/usr/lib/libproc.dylib", use_errno=True)
          libc.sysctl.argtypes = [ctypes.POINTER(ctypes.c_int),ctypes.c_uint,ctypes.c_void_p,ctypes.POINTER(ctypes.c_size_t),ctypes.c_void_p,ctypes.c_size_t]
          libproc.proc_pidpath.argtypes = [ctypes.c_int,ctypes.c_void_p,ctypes.c_uint32]
          def snapshot():
              raw=subprocess.check_output(["/bin/ps","-axo","pid=,ppid=,pgid=,lstart=,stat="],timeout=5).decode()
              rows=[]
              for line in raw.splitlines():
                  v=line.split()
                  if len(v) == 9 and int(v[2]) == group:
                      rows.append(dict(pid=int(v[0]),ppid=int(v[1]),pgid=int(v[2]),started=" ".join(v[3:8]),state=v[8]))
              assert len(rows)<=128
              return rows
          rows=snapshot()
          for row in rows:
              try:
                  buf=ctypes.create_string_buffer(4096)
                  assert libproc.proc_pidpath(row["pid"],buf,4096)>0
                  row["executable"]=os.fsdecode(buf.value)
                  mib=(ctypes.c_int*3)(1,49,row["pid"])
                  args=ctypes.create_string_buffer(256*1024)
                  size=ctypes.c_size_t(len(args))
                  assert libc.sysctl(mib,3,args,ctypes.byref(size),None,0)==0
                  raw=args.raw[:size.value]
                  argc=struct.unpack_from("=i",raw,0)[0]
                  assert 0<argc<=4096
                  pos=raw.index(b"\0",4)+1
                  while pos<len(raw) and raw[pos]==0: pos+=1
                  argv=[]
                  for _ in range(argc):
                      end=raw.index(b"\0",pos); argv.append(os.fsdecode(raw[pos:end])); pos=end+1
                  # Do not inspect or retain the environment that follows argv.
                  row["argv"]=argv
                  assert sum(len(os.fsencode(x)) for x in argv)<=128*1024
                  now=next((x for x in snapshot() if x["pid"]==row["pid"]),None)
                  assert now is not None and all(now[k]==row[k] for k in ("ppid","pgid","started"))
                  row["identityStable"]=True
              except Exception as error:
                  now=next((x for x in snapshot() if x["pid"]==row["pid"]),None)
                  row["identityStable"]=False
                  row["vanished"]=now is None
                  row["failureType"]=type(error).__name__
          print(json.dumps(rows,separators=(",",":")))
          OBSERVER
          cat > "$RUNNER_TEMP/array-update-timeout-proof/runner.mjs" <<'RUNNER'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { spawn, spawnSync } from "node:child_process";
          import { closeSync, copyFileSync, existsSync, lstatSync, mkdirSync, openSync, readFileSync, readdirSync, realpathSync, rmSync, statSync, writeFileSync, writeSync } from "node:fs";
          import { dirname, join, relative, resolve } from "node:path";
          import { pathToFileURL } from "node:url";
          import { setTimeout as delay } from "node:timers/promises";
          const root=process.env.GITHUB_WORKSPACE, out=join(process.env.RUNNER_TEMP,"array-update-timeout-proof"), work=join(process.env.RUNNER_TEMP,"array-update-timeout-work");
          const self=resolve(process.argv[1]), CAP=16*1024*1024;
          const sourceHead="8b9f7981e9198831474bbbe2eb47c48407daa380";
          const sourceTree="9551757de6aa3a1c0e091c815190ae9627de038b", sourcePins={"AGENTS.md":"11ccf7ab2f85791a40e8f497959e4e94df067807d1ac93ad23c7737578bd334c",".node-version":"a1c56e968c358e10872d64220b3ae759ffe7feaffc4da95fae425dbcca43fe44","package.json":"154f121f394b6c9d94120814de67c281d0f7505ffc340f88a8fdb0e9078d83fa","pnpm-lock.yaml":"f4bfbdc670252a428c20be1b9e104a573858ed596322294f80bed876b53d6353","pnpm-workspace.yaml":"57732c3fec5d4f4b879a11a073f9d85d26bf09fe361d4e2794d4cb2d00652632","vitest.config.ts":"96064c247379f195187a4eb99c1d5a62d64d41bb436d8e9fa5cbb8cd02b25f32","tests/harness/llvm-differential.test.ts":"b2348d38fae94ff638054a99048a90cc440d079559eb580287973b54f96736d1","tests/harness/shard.ts":"8ef5234e8fcf13672e7e1d774eaa4ff58e264c06e85be16e5f77eda5a66467bd","tests/harness/suite-lock.mjs":"78b5fd5c64f3795ac49b377e1f52faafd185134bebe391d363b07dd01fe09c31","tests/harness/libnode.ts":"c2feb9a246d9f333411f1c54c299af07002e9e81a575a73b08eb6b69f5f04d9a","tests/harness/jsx-oracle.ts":"c4642f02da794f548bebe8d6e23ec4b48380e25cc803c4154c47dc1bfede76f8","tests/harness/comptime-shim.mjs":"473ebd84ff1746a9fe54dd4f02bf18e09bf276f50a06d11436e1fc9c1ba4d551","tests/harness/corpus-costs.json":"e844cc7a06d29c7838149e6330ceb53e09f1819ce07c81e97844784a6eb5fca0","tests/corpus/array-element-compound-updates.ts":"8050d74e756a650bfb4d42de7287b96d0415e3f57b7fdfb54191510140e8e787","packages/threads/package.json":"6e8700d46f14ba241f3a1e2745c138b6c4af1403b4a74f014d7e748bb20d9c9f","packages/threads/index.js":"70cdc4b21aa17cb0ed65d903d5564ed580e38fb81bcad3468148dd5fd8247c77","packages/compiler/package.json":"6ab1024e6b8ec404121a9bd99d75d99f8882ef060dc04f79bbc9ba936a74b62f","packages/compiler/src/index.ts":"98bd62a6d96c384be7551c5c5d3b8dd9e4cd5af481055188d75be60a18d1efa4","packages/compiler/src/timing.ts":"8e9c891fe1a77996572e435eb29f84db9175bd19738f61449e4722908e25e749","packages/compiler/src/backend/native-codegen.ts":"68429627544ae0ea37d3822ac3a9fa381051f75df9fd6a082e36231dfa7a