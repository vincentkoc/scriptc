                "main.ts": "import { start } from \"checkpoint-host\";\nstart();\nconst pending: Promise<void> = Promise.reject(new RangeError(\"sentinel\"));\nqueueMicrotask(() => {\n  console.log(\"microtask\");\n  process.nextTick(() => {\n    console.log(\"tick\");\n    pending.catch(() => console.log(\"caught\"));\n  });\n});\nsetImmediate(() => console.log(\"done\"));\n",
                "node_modules/checkpoint-host/package.json": "{\"name\":\"checkpoint-host\",\"version\":\"1.0.0\",\"main\":\"index.js\",\"types\":\"index.d.ts\"}",
                "node_modules/checkpoint-host/index.js": "exports.start = function start() { console.log(\"island ready\"); };\n",
                "node_modules/checkpoint-host/index.d.ts": "export declare function start(): void;\n"
              },
              "expected": "island ready\nmicrotask\ntick\ncaught\ndone\n",
              "origin": "tests/harness/node-island-rejection-checkpoint.test.ts",
              "fixtureSource": "authored-uncommitted",
              "fixtureSourceSha256": "eac5533493ae71223daa32adfd59bd2320f90189eaaf7e33c8b56079876004fc",
              "fixtureDefinitionSha256": "17e2fd4f7092bcfe1499a054054222611d030ce91aded876eab3b730d034a6ac",
              "transform": "exact authored case construction; no fixture source rewrite"
