name: Qualify deferred rejection handling

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/diagnose-native-rejection-checkpoint.yml]

permissions:
  contents: read

concurrency:
  group: diagnose-native-rejection-checkpoint
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DIAGNOSTIC_SOURCE: 02e8c33c5af924dc24dae8c6f0029e5b5b545390
      DIAGNOSTIC_LABEL: late-queue-qualification
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: 02e8c33c5af924dc24dae8c6f0029e5b5b545390
          persist-credentials: false
      - name: Verify source before setup
        run: |
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SOURCE"
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: ./.github/actions/llvm-linux
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zig
      - uses: ./.github/actions/native-packages
        with:
          target: linux-x64-gnu
      - name: Disable piped core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Observe late rejection handling
        run: |
          cat > "$RUNNER_TEMP/native-rejection-checkpoint-diagnostic.mjs" <<'PROOF'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { closeSync, copyFileSync, existsSync, lstatSync, mkdirSync, openSync, readFileSync, readdirSync, readlinkSync, realpathSync, symlinkSync, writeFileSync } from "node:fs";
          import { dirname, join, relative } from "node:path";
          import { pathToFileURL } from "node:url";

          const root = process.cwd(), head = process.env.DIAGNOSTIC_SOURCE;
          delete process.env.FORCE_COLOR; delete process.env.NO_COLOR;
          const out = join(process.env.RUNNER_TEMP, "native-rejection-checkpoint-proof");
          const work = join(process.env.RUNNER_TEMP, "native-rejection-checkpoint-work");
          mkdirSync(out); mkdirSync(work);
          const owner = { runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, label: process.env.DIAGNOSTIC_LABEL, workflow: process.env.GITHUB_SHA };
          writeFileSync(join(work, ".diagnostic-owner.json"), JSON.stringify(owner), { flag: "wx" });
          const report = {
            label: process.env.DIAGNOSTIC_LABEL, head, workflow: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            status: "running", diagnosticComplete: false, qualificationComplete: false,
            templateCommit: "ca846a92d042382d59863938ba7ee58134a9a770",
            completeSuite: false, scope: "native-late-rejection-handling", priorProofReused: false,
            excludedCheckpointCases: ["native-next-tick", "hosted-next-tick", "hosted-macrotask-next-tick", "hosted-direct-catch"],
            priorCombinedQualification: { runId: "41237107401", source: "23222d50b8ed293c360d9ed8122f1abd3a2f4cee", disposition: "historical combined-branch proof; not substituted for this narrow branch" },
            parentCallbackContracts: { source: "1b9a1c3d97c343743203004581e0be58ce54ddf6", disposition: "separate callback-only proof; this run exercises changed runtime and upstream timer siblings" },
            expectedExecutionAttempts: 32, executionAttempts: 0, startedAt: new Date().toISOString(), steps: [], cases: [], gates: [],
          };
          const digest = bytes => createHash("sha256").update(bytes).digest("hex");
          const hash = path => digest(readFileSync(path));
          const scrub = value => String(value).split(root).join("<repo>").split(process.env.RUNNER_TEMP).join("<temp>");
          const save = () => writeFileSync(join(out, "summary.json"), scrub(JSON.stringify(report, null, 2)) + "\n");
          let sequence = 0;
          const execute = (name, command, args, seconds = 60, env = {}) => {
            const stem = String(++sequence).padStart(2, "0") + "-" + name;
            const stdout = join(out, stem + ".stdout.log"), stderr = join(out, stem + ".stderr.log");
            const fds = [openSync(stdout, "wx"), openSync(stderr, "wx")], started = Date.now();
            let result;
            try {
              // GNU timeout owns the command group, including compiler descendants.
              result = spawnSync("timeout", ["--signal=TERM", "--kill-after=5s", seconds + "s", command, ...args], {
                cwd: root, env: { ...process.env, ...env }, stdio: ["ignore", ...fds],
              });
            } finally { fds.forEach(closeSync); }
            const observed = {
              name, command, args, seconds: (Date.now() - started) / 1000, limitSeconds: seconds,
              code: result.status, signal: result.signal, error: result.error?.message ?? null,
              stdout: relative(out, stdout), stderr: relative(out, stderr),
              stdoutSha256: hash(stdout), stderrSha256: hash(stderr),
              stdoutBytes: lstatSync(stdout).size, stderrBytes: lstatSync(stderr).size,
            };
            observed.status = observed.error || [125, 126, 127].includes(observed.code) ? "tool-error" : observed.signal ? "signal" :
              observed.code === 124 ? "timeout" : observed.code === 137 ? "killed" :
              observed.code === 0 ? "completed" : "nonzero-exit";
            report.steps.push(observed); save(); return observed;
          };
          const text = step => {
            assert.ok(step.stdoutBytes <= 16 * 1024 ** 2, "bounded text reader exceeded; raw log retained");
            return readFileSync(join(out, step.stdout), "utf8");
          };
          const requireSuccess = step => { assert.equal(step.status, "completed", step.name); return step; };
          const capture = (name, command, args) => text(requireSuccess(execute(name, command, args))).trim();
          const validateCompile = (step, entry, artifact, spec) => {
            try {
              requireSuccess(step);
              const diagnostics = JSON.parse(text(step));
              assert.equal(diagnostics.schema, "scriptc-diagnostics"); assert.equal(diagnostics.schemaVersion, 1);
              assert.equal(diagnostics.command, "build"); assert.equal(diagnostics.entry, entry);
              assert.equal(diagnostics.artifact, artifact); assert.equal(diagnostics.phase, "complete");
              assert.equal(diagnostics.success, true); assert.ok(Array.isArray(diagnostics.diagnostics));
              assert.equal(diagnostics.diagnostics.filter(item => item.severity === "error").length, 0);
              const islands = diagnostics.diagnostics.filter(item => item.code === "SC8001");
              // requireModule lowers at its call site; the static package scan emits no SC8001 for it.
              assert.equal(islands.length, spec.hosted && !spec.deferredHost ? 1 : 0);
              if (spec.hosted && !spec.deferredHost) {
                assert.equal(islands[0].file, entry); assert.equal(islands[0].severity, "warning");
                assert.equal(islands[0].scope, "reached");
                assert.equal(islands[0].message, 'package \'checkpoint-host@1.0.0\' runs in a Node island: marked: marked "node" in scriptc.packages');
              }
              step.islandNotes = islands;
              step.diagnosticsStatus = "passed"; return true;
            } catch (error) {
              step.diagnosticsStatus = "failed"; step.diagnosticsError = scrub(error.stack ?? error); return false;
            } finally { save(); }
          };
          // Exact harness exception: keep every other sanitizer message and all raw bytes.
          const ASAN_SWAP = /^==\d+==WARNING: ASan doesn't fully support makecontext\/swapcontext.*\n/gm;
          const parityOutcome = (step, sanitize = false) => {
            assert.ok(step.stderrBytes <= 16 * 1024 ** 2, "bounded normalization reader exceeded; raw log retained");
            const raw = readFileSync(join(out, step.stderr), "utf8");
            let removedLines = 0;
            const normalized = sanitize ? raw.replace(ASAN_SWAP, () => { removedLines += 1; return ""; }) : raw;
            const stderr = step.stderr + ".normalized.log"; writeFileSync(join(out, stderr), normalized);
            return {
              status: step.status, code: step.code, signal: step.signal, error: step.error,
              stdout: step.stdout, stdoutSha256: step.stdoutSha256, stderr, stderrSha256: digest(normalized),
              normalization: { stdout: "none", stderr: sanitize ? "ASAN_SWAP" : "none", removedLines,
                ruleSource: "tests/harness/node-island-order.test.ts:63", pattern: ASAN_SWAP.source, flags: ASAN_SWAP.flags },
            };
          };
          // Native verdict failures remain complete evidence only after compile admission and input readback.
          const completeCase = item => item.oracle?.expectedMatched === true && item.oracle.status === "completed" &&
            item.ir?.status === "passed" && item.ir.compile?.status === "completed" &&
            item.ir.compile.diagnosticsStatus === "passed" && Boolean(item.ir.artifact) &&
            ["plain", "san"].every(flavor => {
              const native = item.flavors[flavor], execution = native?.execution;
              return native?.compile?.status === "completed" && native.compile.diagnosticsStatus === "passed" &&
                Boolean(native.llvm && native.moduleOwners) && native.deploymentVerified === true && native.inputsVerifiedAfter === true &&
                execution?.attempted === true && !execution.error &&
                !["SIGKILL", "SIGTERM", "SIGHUP", "SIGINT"].includes(execution.signal) &&
                ![125, 126, 127, 129, 130, 137, 143].includes(execution.code) &&
                ["completed", "nonzero-exit", "signal"].includes(execution.status) && Boolean(execution.parityOutcome);
            });
          const collect = (value, predicate, found = []) => {
            if (value && typeof value === "object") {
              if (predicate(value)) found.push(value);
              for (const child of Object.values(value)) collect(child, predicate, found);
            }
            return found;
          };
          const irEvidence = (program, spec, entry) => {
            assert.equal(program.irVersion, 17); assert.notEqual(program.commonJsEntry, true);
            assert.ok(Array.isArray(program.functions));
            const functions = new Map(program.functions.map(fn => [fn.name, fn]));
            assert.equal(functions.size, program.functions.length);
            const sourceText = spec.files["main.ts"], only = (items, why) => { assert.equal(items.length, 1, why); return items[0]; };
            const own = fn => {
              assert.ok(fn && fn.loc?.file === entry && Array.isArray(fn.body) && fn.body.length, "authored native function required");
              return fn;
            };
            const spelling = node => node.loc?.file === entry ? sourceText.slice(node.loc.start, node.loc.end) : "";
            const span = node => {
              assert.equal(node.loc?.file, entry); assert.ok(Number.isInteger(node.loc.start) && Number.isInteger(node.loc.end));
              assert.ok(node.loc.start >= 0 && node.loc.end > node.loc.start && node.loc.end <= sourceText.length);
              return node.loc.start + ":" + node.loc.end;
            };
            const islandCall = node => node.kind === "libCall" && node.fn.startsWith("nodeIsland.");
            const entryFn = own(functions.get(program.entry)), first = entryFn.body[0];
            assert.ok(!(first?.kind === "throw" && first.value?.kind === "libCall" && first.value.fn === "error.new"), "startup refusal");
            // Only explicit jsEntry edges join owner families. Names and shared spans do not.
            const parent = new Map();
            for (const fn of functions.values()) if (fn.jsEntry !== undefined) {
              const child = own(functions.get(fn.jsEntry)); assert.notEqual(child.name, fn.name);
              assert.ok(!parent.has(child.name), "shared jsEntry target"); parent.set(child.name, fn.name);
              assert.deepEqual(child.loc, fn.loc); assert.ok(Array.isArray(fn.captures));
              assert.deepEqual(child.captures, fn.captures);
              assert.equal(fn.async, undefined); assert.equal(fn.generator, undefined); assert.equal(fn.classCaptures, undefined);
              assert.equal(child.async, undefined); assert.equal(child.generator, undefined);
              assert.ok(fn.params.length > 0 && fn.params.every(param => param.type.kind === "dyn"));
              assert.ok(child.params.some(param => param.type.kind === "jsval"));
              assert.ok(JSON.stringify(child.returnType) === JSON.stringify(fn.returnType) ||
                (fn.returnType.kind === "dyn" && child.returnType.kind === "jsval"), "invalid jsEntry return conversion");
              assert.equal(child.locals.length, fn.locals.length);
              child.locals.forEach((local, i) => {
                const { type, ...metadata } = local, { type: originalType, ...originalMetadata } = fn.locals[i];
                assert.deepEqual(metadata, originalMetadata, "jsEntry local binding metadata");
                assert.ok(JSON.stringify(type) === JSON.stringify(originalType) ||
                  (originalType.kind === "dyn" && type.kind === "jsval"), "invalid jsEntry local conversion");
              });
              assert.equal(child.params.length, fn.params.length);
              child.params.forEach((param, i) => {
                assert.equal(param.localId, fn.params[i].localId); assert.equal(param.name, fn.params[i].name);
                assert.ok(JSON.stringify(param.type) === JSON.stringify(fn.params[i].type) ||
                  (fn.params[i].type.kind === "dyn" && param.type.kind === "jsval"), "invalid jsEntry parameter conversion");
              });
            }
            const family = name => {
              const seen = new Set();
              while (parent.has(name)) { assert.ok(!seen.has(name), "cyclic jsEntry edge"); seen.add(name); name = parent.get(name); }
              return name;
            };
            for (const name of functions.keys()) family(name);
            const familyMembers = name => [...functions.values()].filter(fn => family(fn.name) === family(name));
            const records = program.functions.flatMap(owner => collect(owner.body, node => typeof node.kind === "string").map(node => ({ owner, node })));
            const recordsOf = fn => records.filter(row => row.owner === fn);
            const edges = fn => [
              ...(fn.jsEntry ? [fn.jsEntry] : []),
              ...recordsOf(fn).filter(({ node }) => node.kind === "call" || node.kind === "closure")
                .map(({ node }) => node.kind === "call" ? node.callee : node.fnName),
            ];
            const visit = roots => {
              const seen = new Set(), todo = [...roots];
              while (todo.length) {
                const name = todo.pop(); if (seen.has(name)) continue;
                const fn = functions.get(name); assert.ok(fn, "dangling native function edge"); seen.add(name);
                for (const edge of edges(fn)) { assert.ok(functions.has(edge), "missing native callee"); todo.push(edge); }
              }
              return seen;
            };
            const reachable = visit([entryFn.name]);
            const globals = new Map((program.globals ?? []).map(global => [global.id, global]));
            const locals = new Map(program.functions.map(fn => [fn.name, new Map(fn.locals.map(local => [local.id, local]))]));
            const bindingKey = (owner, id) => {
              assert.ok(owner && typeof id === "string");
              assert.ok(!(globals.has(id) && locals.get(owner.name).has(id)), "local/global binding collision");
              if (globals.has(id)) return "global:" + id;
              assert.ok(locals.get(owner.name).has(id), "binding is absent from concrete owner");
              return owner.name + ":" + id;
            };
            const assignments = new Map(), captures = new Map();
            for (const { owner, node } of records) if (["varDecl", "assign"].includes(node.kind)) {
              const value = node.kind === "varDecl" ? node.init : node.value;
              if (value) {
                const key = bindingKey(owner, node.localId), list = assignments.get(key) ?? [];
                list.push({ owner, value }); assignments.set(key, list);
              }
            }
            for (const { owner, node } of records) if (node.kind === "closure") {
              const target = own(functions.get(node.fnName)), slots = target.captures ?? [];
              assert.equal(node.captures.length, slots.length, "closure capture arity");
              node.captures.forEach((id, i) => {
                bindingKey(owner, id);
                for (const member of familyMembers(target.name)) {
                  const key = bindingKey(member, slots[i].localId), list = captures.get(key) ?? [];
                  list.push({ owner, id }); captures.set(key, list);
                }
              });
            }
            const sources = (owner, id, seen = new Set()) => {
              const key = bindingKey(owner, id); assert.ok(!seen.has(key), "cyclic binding"); const next = new Set([...seen, key]);
              const result = [...(assignments.get(key) ?? [])];
              if (owner.params.some(param => param.localId === id)) result.push({ owner, value: { kind: "parameter", localId: id } });
              for (const capture of captures.get(key) ?? []) result.push(...sources(capture.owner, capture.id, next));
              return result;
            };
            const nativeClosure = (expr, owner, seen = new Set()) => {
              assert.ok(expr, "missing native callback");
              if (expr.kind === "dynFrom") return nativeClosure(expr.value, owner, seen);
              if (expr.kind === "closure") {
                const target = own(functions.get(expr.fnName)); assert.deepEqual(expr.loc, target.loc, "callback provenance"); return target;
              }
              assert.equal(expr.kind, "varRef", "callback is not a native closure or binding");
              const key = bindingKey(owner, expr.localId); assert.ok(!seen.has(key), "cyclic callback");
              const binding = globals.get(expr.localId) ?? locals.get(owner.name).get(expr.localId);
              assert.equal(spelling(expr), binding.name, "callback binding source name");
              const values = sources(owner, expr.localId); assert.ok(values.length, "callback has no scoped initializer");
              const resolved = values.map(value => nativeClosure(value.value, value.owner, new Set([...seen, key])));
              assert.equal(new Set(resolved.map(fn => family(fn.name))).size, 1, "callback binding changes identity");
              return resolved[0];
            };
            // Validate each concrete occurrence before grouping its authored operation.
            const groups = (predicate, label, expected) => {
              const found = new Map(), concrete = new Set();
              for (const row of records.filter(({ node }) => predicate(node))) {
                own(row.owner); assert.ok(reachable.has(row.owner.name), "detached " + label);
                if (row.owner.loc.end > row.owner.loc.start) assert.ok(row.node.loc?.start >= row.owner.loc.start && row.node.loc?.end <= row.owner.loc.end, "operation outside authored owner");
                const key = family(row.owner.name) + ":" + span(row.node);
                const rawKey = row.owner.name + ":" + span(row.node);
                assert.ok(!concrete.has(rawKey), "duplicate " + label + " in one owner"); concrete.add(rawKey);
                const list = found.get(key) ?? []; list.push(row); found.set(key, list);
              }
              if (expected !== undefined) assert.equal(found.size, expected, label + " authored inventory");
              for (const rows of found.values()) {
                assert.deepEqual(rows.map(row => row.owner.name).sort(), familyMembers(rows[0].owner.name).map(fn => fn.name).sort(),
                  label + " missing from a jsEntry family member");
              }
              return [...found.values()];
            };
            const authoredCount = regex => [...sourceText.matchAll(regex)].length;
            const callbackRoots = new Set(), registrations = [], schedules = [], catchEvidence = [];
            const addRoot = fn => { callbackRoots.add(fn.name); return fn; };
            const eventNames = { unhandledRejection: "UnhandledRejection", rejectionHandled: "RejectionHandled", uncaughtException: "UncaughtException" };
            for (const [event, suffix] of Object.entries(eventNames)) {
              const expected = authoredCount(new RegExp('process\\.(on|once|off)\\("' + event + '"', "g"));
              for (const rows of groups(node => node.kind === "libCall" && ["process.on" + suffix, "process.off" + suffix].includes(node.fn), event, expected)) {
                const evidence = [];
                for (const { node: call, owner } of rows) {
                  const form = /^process\.(on|once|off)\(/.exec(spelling(call))?.[1]; assert.ok(form);
                  assert.ok(spelling(call).startsWith('process.' + form + '("' + event + '"'));
                  assert.equal(call.fn, "process." + (form === "off" ? "off" : "on") + suffix);
                  assert.equal(call.args.length, (form === "off" ? 1 : 2) + (event === "uncaughtException" ? 1 : 0));
                  const listener = addRoot(nativeClosure(call.args[0], owner));
                  if (form !== "off") {
                    assert.equal(call.args[1].kind, "boolLit"); assert.equal(call.args[1].type.kind, "bool");
                    assert.equal(call.args[1].value, form === "once");
                  }
                  if (event === "uncaughtException") {
                    assert.equal(call.args.at(-1).kind, "boolLit"); assert.equal(call.args.at(-1).type.kind, "bool");
                    assert.equal(call.args.at(-1).value, false);
                  }
                  evidence.push({ event, form, listener: listener.name, owner: owner.name, family: family(owner.name), span: call.loc });
                }
                assert.equal(new Set(evidence.map(row => family(row.listener))).size, 1, "clone callback changed");
                registrations.push(...evidence);
              }
            }
            assert.ok(registrations.some(row => row.event === "unhandledRejection" && row.form === "on"));
            assert.ok(registrations.some(row => row.event === "rejectionHandled" && row.form !== "off"));
            for (const [pattern, name] of [["setImmediate\\(", "timers.setImmediate"], ["process\\.nextTick\\(", "process.nextTick"], ["queueMicrotask\\(", "timers.queueMicrotask"]]) {
              for (const rows of groups(node => node.kind === "libCall" && node.fn === name, name, authoredCount(new RegExp(pattern, "g")))) {
                const callbacks = [];
                for (const { node: call, owner } of rows) {
                  assert.ok(new RegExp("^" + pattern).test(spelling(call)), "scheduler source span");
                  assert.equal(call.args.length, 1);
                  const callback = addRoot(nativeClosure(call.args[0], owner)); callbacks.push(family(callback.name));
                  schedules.push({ operation: name, owner: owner.name, family: family(owner.name), callback: callback.name, span: call.loc });
                }
                assert.equal(new Set(callbacks).size, 1, "clone scheduler callback changed");
              }
            }
            const rejected = groups(node => node.kind === "intrinsic" && node.name === "promise.reject", "promise rejection", authoredCount(/Promise\.reject(?:<[^>]+>)?\(/g));
            assert.ok(rejected.length > 0);
            for (const rows of rejected) for (const { node } of rows) {
              assert.equal(node.type.kind, "promise"); assert.ok(/^Promise\.reject(?:<[^>]+>)?\(/.test(spelling(node)));
            }
            const parameterTrusted = (owner, id) => registrations.some(row => row.event === "unhandledRejection" &&
              family(row.listener) === family(owner.name) && owner.params[1]?.localId === id);
            const trustedPromise = (expr, owner, seen = new Set()) => {
              if (expr.kind === "dynFrom" || expr.kind === "dynCheck") return trustedPromise(expr.value, owner, seen);
              if (expr.kind === "libCall" && ["js.toDyn", "js.fromDyn"].includes(expr.fn)) {
                assert.equal(expr.args.length, 1); return trustedPromise(expr.args[0], owner, seen);
              }
              if (expr.kind === "intrinsic" && expr.name === "promise.reject") return true;
              if (expr.kind === "parameter") { assert.ok(parameterTrusted(owner, expr.localId), "foreign promise parameter"); return true; }
              if (expr.kind === "varRef") {
                const key = bindingKey(owner, expr.localId); assert.ok(!seen.has(key), "cyclic promise binding");
                assert.equal(spelling(expr), (globals.get(expr.localId) ?? locals.get(owner.name).get(expr.localId)).name, "promise binding source name");
                if (parameterTrusted(owner, expr.localId)) return true;
                const rows = sources(owner, expr.localId); assert.ok(rows.length, "promise binding has no native origin");
                return rows.every(row => trustedPromise(row.value, row.owner, new Set([...seen, key])));
              }
              assert.fail("promise receiver has no native origin");
            };
            const storageKeys = (owner, id, seen = new Set()) => {
              const key = bindingKey(owner, id); assert.ok(!seen.has(key), "cyclic storage capture");
              const links = captures.get(key) ?? [];
              return links.length ? links.flatMap(link => storageKeys(link.owner, link.id, new Set([...seen, key]))) : [key];
            };
            const trustedArray = (expr, owner) => {
              assert.equal(expr.kind, "varRef"); const key = bindingKey(owner, expr.localId);
              assert.equal(spelling(expr), (globals.get(expr.localId) ?? locals.get(owner.name).get(expr.localId)).name, "array binding source name");
              const values = sources(owner, expr.localId); assert.ok(values.length, "array binding has no initializer");
              for (const row of values) {
                assert.equal(row.value.kind, "dynArrLit");
                for (const item of row.value.elems) assert.ok(trustedPromise(item, row.owner));
              }
              const storage = new Set(storageKeys(owner, expr.localId));
              const aliases = (value, writer) => value?.kind === "varRef" && storageKeys(writer, value.localId).some(key => storage.has(key));
              const writes = records.filter(({ node, owner: writer }) => node.kind === "dynInvoke" && aliases(node.recv, writer));
              assert.ok(writes.every(({ node }) => node.method === "push"), "unexpected array mutation");
              for (const { node, owner: writer } of records) if (node.kind === "libCall" &&
                ["dyn.keySet", "dyn.set", "dyn.arrSet", "dyn.arrPush"].includes(node.fn))
                assert.ok(!aliases(node.args[0], writer), "unreviewed captured-array write");

              if (values.every(row => row.value.elems.length === 0)) assert.ok(writes.length, "empty array has no native promise producer");
              for (const { node, owner: writer } of writes) {
                assert.equal(node.args.length, 1); assert.ok(trustedPromise(node.args[0], writer));
