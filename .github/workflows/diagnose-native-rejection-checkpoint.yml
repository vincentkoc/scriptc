name: Qualify deferred rejection handling

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/diagnose-native-rejection-checkpoint.yml]

permissions:
  contents: read

concurrency:
  group: diagnose-native-rejection-checkpoint
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DIAGNOSTIC_SOURCE: b44ab50c7859d6a4609d273b7ae096c259319c2b
      DIAGNOSTIC_LABEL: late-queue-qualification
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: b44ab50c7859d6a4609d273b7ae096c259319c2b
          persist-credentials: false
      - name: Verify source before setup
        run: |
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SOURCE"
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: ./.github/actions/llvm-linux
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zig
      - uses: ./.github/actions/native-packages
        with:
          target: linux-x64-gnu
      - name: Disable piped core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Observe late rejection handling
        run: |
          cat > "$RUNNER_TEMP/native-rejection-checkpoint-diagnostic.mjs" <<'PROOF'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { closeSync, copyFileSync, existsSync, lstatSync, mkdirSync, openSync, readFileSync, readdirSync, readlinkSync, realpathSync, symlinkSync, writeFileSync } from "node:fs";
          import { dirname, join, relative } from "node:path";
          import { pathToFileURL } from "node:url";

          const root = process.cwd(), head = process.env.DIAGNOSTIC_SOURCE;
          delete process.env.FORCE_COLOR; delete process.env.NO_COLOR;
          const out = join(process.env.RUNNER_TEMP, "native-rejection-checkpoint-proof");
          const work = join(process.env.RUNNER_TEMP, "native-rejection-checkpoint-work");
          mkdirSync(out); mkdirSync(work);
          const owner = { runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, label: process.env.DIAGNOSTIC_LABEL, workflow: process.env.GITHUB_SHA };
          writeFileSync(join(work, ".diagnostic-owner.json"), JSON.stringify(owner), { flag: "wx" });
          const report = {
            label: process.env.DIAGNOSTIC_LABEL, head, workflow: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            status: "running", diagnosticComplete: false, qualificationComplete: false,
            templateCommit: "11e3cf017c25e06fe2e9059f1c433ab6c8a0dcde",
            completeSuite: false, scope: "native-late-rejection-handling", priorProofReused: false,
            excludedCheckpointCases: ["native-next-tick", "hosted-next-tick", "hosted-macrotask-next-tick", "hosted-direct-catch"],
            priorDiagnostic: {"runId": "41224445896", "attempt": "1", "workflow": "1ef672cd4ad6ab66a0634691ccc7d3aee885008c", "source": "2f5c38e3715956a944b662eef7d339c7f9d7bc38", "artifactId": "13051395986", "archiveSha256": "42bbd7c359161410a43b69d6ae6c7804630145a5ed1bc60f3767d6c46d30a515", "summarySha256": "2ca5f37fccc23ab0da9017135c5ce358ea3ca5d4de6a95e7f82f5f91eb6a3707", "fixtureDigest": "b61e4f121f2b016deb1cf63009026cd2e2089fd90e133eb140f5c4bd6a312d0b", "url": "https://github.com/vincentkoc/scriptc/actions/runs/41224445896", "disposition": "verified historical mismatch; not rerun or substituted for candidate proof"},
            expectedExecutionAttempts: 32, executionAttempts: 0, startedAt: new Date().toISOString(), steps: [], cases: [], gates: [],
          };
          const digest = bytes => createHash("sha256").update(bytes).digest("hex");
          const hash = path => digest(readFileSync(path));
          const scrub = value => String(value).split(root).join("<repo>").split(process.env.RUNNER_TEMP).join("<temp>");
          const save = () => writeFileSync(join(out, "summary.json"), scrub(JSON.stringify(report, null, 2)) + "\n");
          let sequence = 0;
          const execute = (name, command, args, seconds = 60, env = {}) => {
            const stem = String(++sequence).padStart(2, "0") + "-" + name;
            const stdout = join(out, stem + ".stdout.log"), stderr = join(out, stem + ".stderr.log");
            const fds = [openSync(stdout, "wx"), openSync(stderr, "wx")], started = Date.now();
            let result;
            try {
              // GNU timeout owns the command group, including compiler descendants.
              result = spawnSync("timeout", ["--signal=TERM", "--kill-after=5s", seconds + "s", command, ...args], {
                cwd: root, env: { ...process.env, ...env }, stdio: ["ignore", ...fds],
              });
            } finally { fds.forEach(closeSync); }
            const observed = {
              name, command, args, seconds: (Date.now() - started) / 1000, limitSeconds: seconds,
              code: result.status, signal: result.signal, error: result.error?.message ?? null,
              stdout: relative(out, stdout), stderr: relative(out, stderr),
              stdoutSha256: hash(stdout), stderrSha256: hash(stderr),
              stdoutBytes: lstatSync(stdout).size, stderrBytes: lstatSync(stderr).size,
            };
            observed.status = observed.error || [125, 126, 127].includes(observed.code) ? "tool-error" : observed.signal ? "signal" :
              observed.code === 124 ? "timeout" : observed.code === 137 ? "killed" :
              observed.code === 0 ? "completed" : "nonzero-exit";
            report.steps.push(observed); save(); return observed;
          };
          const text = step => {
            assert.ok(step.stdoutBytes <= 16 * 1024 ** 2, "bounded text reader exceeded; raw log retained");
            return readFileSync(join(out, step.stdout), "utf8");
          };
          const requireSuccess = step => { assert.equal(step.status, "completed", step.name); return step; };
          const capture = (name, command, args) => text(requireSuccess(execute(name, command, args))).trim();
          const validateCompile = (step, entry, artifact, spec) => {
            try {
              requireSuccess(step);
              const diagnostics = JSON.parse(text(step));
              assert.equal(diagnostics.schema, "scriptc-diagnostics"); assert.equal(diagnostics.schemaVersion, 1);
              assert.equal(diagnostics.command, "build"); assert.equal(diagnostics.entry, entry);
              assert.equal(diagnostics.artifact, artifact); assert.equal(diagnostics.phase, "complete");
              assert.equal(diagnostics.success, true); assert.ok(Array.isArray(diagnostics.diagnostics));
              assert.equal(diagnostics.diagnostics.filter(item => item.severity === "error").length, 0);
              const islands = diagnostics.diagnostics.filter(item => item.code === "SC8001");
              // requireModule lowers at its call site; the static package scan emits no SC8001 for it.
              assert.equal(islands.length, spec.hosted && !spec.deferredHost ? 1 : 0);
              if (spec.hosted && !spec.deferredHost) {
                assert.equal(islands[0].file, entry); assert.equal(islands[0].severity, "warning");
                assert.equal(islands[0].scope, "reached");
                assert.equal(islands[0].message, 'package \'checkpoint-host@1.0.0\' runs in a Node island: marked: marked "node" in scriptc.packages');
              }
              step.islandNotes = islands;
              step.diagnosticsStatus = "passed"; return true;
            } catch (error) {
              step.diagnosticsStatus = "failed"; step.diagnosticsError = scrub(error.stack ?? error); return false;
            } finally { save(); }
          };
          // Exact harness exception: keep every other sanitizer message and all raw bytes.
          const ASAN_SWAP = /^==\d+==WARNING: ASan doesn't fully support makecontext\/swapcontext.*\n/gm;
          const parityOutcome = (step, sanitize = false) => {
            assert.ok(step.stderrBytes <= 16 * 1024 ** 2, "bounded normalization reader exceeded; raw log retained");
            const raw = readFileSync(join(out, step.stderr), "utf8");
            let removedLines = 0;
            const normalized = sanitize ? raw.replace(ASAN_SWAP, () => { removedLines += 1; return ""; }) : raw;
            const stderr = step.stderr + ".normalized.log"; writeFileSync(join(out, stderr), normalized);
            return {
              status: step.status, code: step.code, signal: step.signal, error: step.error,
              stdout: step.stdout, stdoutSha256: step.stdoutSha256, stderr, stderrSha256: digest(normalized),
              normalization: { stdout: "none", stderr: sanitize ? "ASAN_SWAP" : "none", removedLines,
                ruleSource: "tests/harness/node-island-order.test.ts:63", pattern: ASAN_SWAP.source, flags: ASAN_SWAP.flags },
            };
          };
          // Native verdict failures remain complete evidence only after compile admission and input readback.
          const completeCase = item => item.oracle?.expectedMatched === true && item.oracle.status === "completed" &&
            item.ir?.status === "passed" && item.ir.compile?.status === "completed" &&
            item.ir.compile.diagnosticsStatus === "passed" && Boolean(item.ir.artifact) &&
            ["plain", "san"].every(flavor => {
              const native = item.flavors[flavor], execution = native?.execution;
              return native?.compile?.status === "completed" && native.compile.diagnosticsStatus === "passed" &&
                Boolean(native.llvm && native.moduleOwners) && native.deploymentVerified === true && native.inputsVerifiedAfter === true &&
                execution?.attempted === true && !execution.error &&
                !["SIGKILL", "SIGTERM", "SIGHUP", "SIGINT"].includes(execution.signal) &&
                ![125, 126, 127, 129, 130, 137, 143].includes(execution.code) &&
                ["completed", "nonzero-exit", "signal"].includes(execution.status) && Boolean(execution.parityOutcome);
            });
          const collect = (value, predicate, found = []) => {
            if (value && typeof value === "object") {
              if (predicate(value)) found.push(value);
              for (const child of Object.values(value)) collect(child, predicate, found);
            }
            return found;
          };
          const typedIrEvidence = (program, spec, entry) => {
            assert.equal(program.irVersion, 17); assert.ok(Array.isArray(program.functions));
            assert.equal(typeof program.entry, "string"); assert.notEqual(program.commonJsEntry, true);
            const functions = new Map(program.functions.map(fn => [fn.name, fn]));
            const programEntry = functions.get(program.entry); assert.ok(programEntry);
            const first = programEntry.body[0];
            assert.ok(!(first?.kind === "throw" && first.value?.kind === "libCall" && first.value.fn === "error.new"), "IR contains a startup refusal");
            assert.equal(functions.size, program.functions.length);
            const own = fn => {
              assert.ok(fn && fn.loc?.file === entry && Array.isArray(fn.body) && fn.body.length > 0,
                "callback must have an authored native body");
              return fn;
            };
            const nodes = program.functions.flatMap(fn => collect(fn.body, () => true));
            const islandCall = node => node.kind === "libCall" && node.fn.startsWith("nodeIsland.");
            const islands = nodes.filter(islandCall);
            if (!spec.hosted) {
              assert.equal(islands.length, 0, "native-only IR calls Node");
              assert.equal(program.nodeIsland, undefined, "native-only IR records Node startup");
            } else {
              assert.ok(islands.some(node => ["nodeIsland.require", "nodeIsland.defer"].includes(node.fn)), "hosted import must load its package");
              const tree = program.nodeIsland?.modules;
              assert.ok(tree && Array.isArray(tree.files)); assert.deepEqual(tree.links, []);
              const paths = Object.keys(spec.files).filter(file => file.startsWith("node_modules/checkpoint-host/")).sort();
              assert.deepEqual(tree.files.map(file => file.path).sort(), paths);
              for (const file of tree.files) {
                assert.notEqual(file.placeholder, true); assert.equal(file.size, Buffer.byteLength(spec.files[file.path]));
                assert.equal(file.sha256, digest(spec.files[file.path]));
              }
            }
            const rejected = nodes.filter(node => node.kind === "intrinsic" && node.name === "promise.reject");
            assert.equal(rejected.length, 1); assert.deepEqual(rejected[0].type, { kind: "promise", inner: { kind: "void" } });
            const only = (values, why) => { assert.equal(values.length, 1, why); return values[0]; };
            const callback = call => {
              assert.equal(call.args.length, 1);
              assert.equal(call.args[0].kind, "closure", "scheduler callback must be a native closure");
              return own(functions.get(call.args[0].fnName));
            };
            const subscription = name => {
              const call = only(nodes.filter(node => node.kind === "libCall" && node.fn === name), name);
              assert.equal(call.args.length, 2);
              assert.equal(call.args[0].kind, "dynFrom"); assert.equal(call.args[0].type.kind, "dyn");
              assert.equal(call.args[0].value.kind, "closure", "listener must box a native closure");
              assert.deepEqual(call.args[1].type, { kind: "bool" });
              assert.equal(call.args[1].kind, "boolLit"); assert.equal(call.args[1].value, false);
              const fn = own(functions.get(call.args[0].value.fnName));
              assert.equal(fn.params.length, 0);
              return { call, fn };
            };
            const unhandled = subscription("process.onUnhandledRejection");
            const handled = subscription("process.onRejectionHandled");
            const immediateCall = only(nodes.filter(node => node.kind === "libCall" && node.fn === "timers.setImmediate"), "one native immediate");
            assert.ok(collect(unhandled.fn.body, node => node === immediateCall).length === 1,
              "unhandled listener must schedule the native immediate");
            const immediate = callback(immediateCall);
            const tickCall = only(nodes.filter(node => node.kind === "libCall" && node.fn === "process.nextTick"), "one native nextTick");
            assert.ok(collect(immediate.body, node => node === tickCall).length === 1,
              "immediate callback must schedule the native nextTick");
            const tick = callback(tickCall);
            assert.equal(nodes.filter(node => node.kind === "libCall" && node.fn === "timers.queueMicrotask").length, 0);
            const logs = fn => collect(fn.body, node => node.kind === "intrinsic" && node.name === "console.log")
              .map(node => only(collect(node.args, arg => arg.kind === "strLit"), "one authored log string").value);
            assert.deepEqual(logs(unhandled.fn), ["unhandled"]); assert.deepEqual(logs(handled.fn), ["handled"]);
            assert.deepEqual(logs(immediate), ["attach", "after"]); assert.deepEqual(logs(tick), ["tick"]);
            const chain = [unhandled.fn, handled.fn, immediate, tick];
            const catchCall = only(collect(immediate.body, node => node.kind === "callValue" && node.callee?.kind === "closure"),
              "immediate callback must invoke the native catch closure");
            const ordered = collect(immediate.body, node => node === catchCall || node === tickCall ||
              (node.kind === "intrinsic" && node.name === "console.log"));
            assert.deepEqual(ordered.map(node => node === catchCall ? "catch" : node === tickCall ? "nextTick" :
              only(collect(node.args, arg => arg.kind === "strLit"), "one authored log string").value),
              ["attach", "catch", "after", "nextTick"]);
            const caught = own(functions.get(catchCall.callee.fnName)); chain.push(caught);
            assert.equal(caught.async, true); assert.equal(caught.params.length, 1);
            const parameter = caught.params[0];
            assert.deepEqual(parameter.type, { kind: "promise", inner: { kind: "void" } });
            assert.equal(catchCall.args.length, 1); assert.deepEqual(catchCall.args[0].type, parameter.type);
            assert.ok(catchCall.args[0].kind === "varRef", "catch receiver must remain an unboxed native promise");
            const handler = only(caught.body.filter(node => node.kind === "tryCatch"), "catch closure try/catch");
            const awaited = only(collect(handler.tryBody, node => node.kind === "awaitExpr"), "direct native await");
            assert.equal(awaited.value.kind, "varRef"); assert.equal(awaited.value.localId, parameter.localId);
            assert.deepEqual(awaited.value.type, parameter.type);
            const log = only(collect(handler.catchBody, node => node.kind === "intrinsic" && node.name === "console.log"),
              "caught log must stay inside catch body");
            assert.ok(collect(log.args, node => node.kind === "strLit" && node.value === "caught").length === 1);
            const registrationOwners = [unhandled.call, handled.call].map(call =>
              own(only(program.functions.filter(fn => collect(fn.body, node => node === call).length), "native listener registration owner")));
            const reachable = new Set(), roots = [programEntry];
            while (roots.length) {
              const fn = roots.pop(); if (reachable.has(fn.name)) continue; reachable.add(fn.name);
              for (const node of collect(fn.body, node => node.kind === "call" || node.kind === "closure")) {
                const name = node.kind === "call" ? node.callee : node.fnName;
                if (functions.has(name)) roots.push(functions.get(name));
              }
            }
            for (const fn of [...registrationOwners, ...chain]) assert.ok(reachable.has(fn.name), "detached callback chain");
            // Follow native helper and closure edges too: a nested delegate cannot hide a Node callback.
            const visited = new Set(), pending = [...chain];
            while (pending.length) {
              const fn = pending.pop(); if (visited.has(fn.name)) continue; visited.add(fn.name);
              assert.equal(collect(fn.body, islandCall).length, 0, "callback chain delegates to Node");
              for (const node of collect(fn.body, node => node.kind === "call" || node.kind === "closure")) {
                const name = node.kind === "call" ? node.callee : node.fnName;
                if (functions.has(name)) pending.push(functions.get(name));
              }
            }
            return { status: "passed", startupRefusalAbsent: true, reachableFunctions: [...reachable].sort(), irVersion: program.irVersion, commonJsEntry: program.commonJsEntry ?? false,
              rejectionType: rejected[0].type, registrationOwners: registrationOwners.map(fn => fn.name),
              unhandledListener: unhandled.fn.name, handledListener: handled.fn.name, immediate: immediate.name,
              nextTick: tick.name, catchClosure: caught.name, listenerBoxing: "dynFrom native closure",
              awaitParameter: { localId: parameter.localId, type: parameter.type }, callbackFunctions: [...visited].sort(),
              islandCalls: islands.map(node => node.fn), shippedFiles: program.nodeIsland?.modules?.files ?? [],
              functions: program.functions.map(fn => ({ name: fn.name, sourceName: fn.sourceName ?? null,
                file: fn.loc?.file ?? null, statements: fn.body.length })) };
          };

          const irEvidence = (program, spec, entry) => {
            if (["native-late-handling", "hosted-late-handling"].includes(spec.id))
              return typedIrEvidence(program, spec, entry);
            assert.equal(program.irVersion, 17); assert.notEqual(program.commonJsEntry, true);
            assert.ok(Array.isArray(program.functions));
            const functions = new Map(program.functions.map(fn => [fn.name, fn]));
            assert.equal(functions.size, program.functions.length);
            const own = fn => {
              assert.ok(fn && fn.loc?.file === entry && Array.isArray(fn.body) && fn.body.length > 0,
                "callback must have an authored native body"); return fn;
            };
            const entryFn = functions.get(program.entry); assert.ok(entryFn);
            const first = entryFn.body[0];
            assert.ok(!(first?.kind === "throw" && first.value?.kind === "libCall" && first.value.fn === "error.new"),
              "IR contains a startup refusal");
            const nodes = program.functions.flatMap(fn => collect(fn.body, () => true));
            const islandCall = node => node.kind === "libCall" && node.fn.startsWith("nodeIsland.");
            const islands = nodes.filter(islandCall), sourceText = spec.files["main.ts"];
            const spelling = node => node.loc?.file === entry ? sourceText.slice(node.loc.start, node.loc.end) : "";
            const only = (items, reason) => { assert.equal(items.length, 1, reason); return items[0]; };
            const ownerOf = node => own(only(program.functions.filter(fn => collect(fn.body, item => item === node).length), "native operation owner"));
            const assignments = new Map();
            for (const node of nodes) if (["varDecl", "assign"].includes(node.kind)) {
              const value = node.kind === "varDecl" ? node.init : node.value;
              if (value) { const values = assignments.get(node.localId) ?? []; values.push(value); assignments.set(node.localId, values); }
            }
            // Resolve a named listener through its native binding, including captured globals.
            // Never accept a dynamic value merely because its source contains an arrow.
            const nativeClosure = (expr, seen = new Set()) => {
              assert.ok(expr, "missing callback");
              if (expr.kind === "dynFrom") return nativeClosure(expr.value, seen);
              if (expr.kind === "closure") return own(functions.get(expr.fnName));
              assert.equal(expr.kind, "varRef", "callback is not a native closure or binding");
              assert.ok(!seen.has(expr.localId), "cyclic callback binding");
              const next = new Set([...seen, expr.localId]);
              const values = assignments.get(expr.localId) ?? [];
              assert.ok(values.length > 0, "callback binding has no native initializer");
              const resolved = values.map(value => nativeClosure(value, next));
              assert.equal(new Set(resolved.map(fn => fn.name)).size, 1, "callback binding changes identity");
              return resolved[0];
            };
            const reachable = new Set(), todo = [entryFn];
            while (todo.length) {
              const fn = todo.pop(); if (reachable.has(fn.name)) continue; reachable.add(fn.name);
              for (const node of collect(fn.body, node => node.kind === "call" || node.kind === "closure")) {
                const name = node.kind === "call" ? node.callee : node.fnName;
                if (functions.has(name)) todo.push(functions.get(name));
              }
            }
            const roots = [], registrations = [];
            const eventNames = { unhandledRejection: "UnhandledRejection", rejectionHandled: "RejectionHandled", uncaughtException: "UncaughtException" };
            for (const [event, suffix] of Object.entries(eventNames)) {
              const authored = [...sourceText.matchAll(new RegExp('process\\.(on|once|off)\\("' + event + '"', "g"))];
              const calls = nodes.filter(node => node.kind === "libCall" &&
                [ "process.on" + suffix, "process.off" + suffix ].includes(node.fn));
              assert.equal(calls.length, authored.length, "event operation inventory: " + event);
              for (const call of calls) {
                ownerOf(call);
                const form = /^process\.(on|once|off)\(/.exec(spelling(call))?.[1];
                assert.ok(form, "event operation lost source provenance");
                assert.equal(call.fn, "process." + (form === "off" ? "off" : "on") + suffix);
                const listener = nativeClosure(call.args[0]); roots.push(listener);
                assert.equal(call.args.length, (form === "off" ? 1 : 2) + (event === "uncaughtException" ? 1 : 0));
                if (form !== "off") assert.deepEqual(call.args[1], { kind: "boolLit", value: form === "once", type: { kind: "bool" }, loc: call.args[1].loc });
                if (event === "uncaughtException") assert.equal(call.args.at(-1).value, false);
                registrations.push({ event, form, listener: listener.name, owner: ownerOf(call).name, span: call.loc });
              }
            }
            assert.ok(registrations.some(row => row.event === "unhandledRejection" && row.form === "on"));
            assert.ok(registrations.some(row => row.event === "rejectionHandled" && row.form !== "off"));
            const schedules = [];
            for (const [pattern, name] of [
              ["setImmediate\\(", "timers.setImmediate"], ["process\\.nextTick\\(", "process.nextTick"],
              ["queueMicrotask\\(", "timers.queueMicrotask"],
            ]) {
              const expected = [...sourceText.matchAll(new RegExp(pattern, "g"))].length;
              const calls = nodes.filter(node => node.kind === "libCall" && node.fn === name);
              assert.equal(calls.length, expected, "scheduler operation inventory: " + name);
              for (const call of calls) {
                assert.equal(call.args.length, 1);
                const callback = nativeClosure(call.args[0]); roots.push(callback);
                schedules.push({ operation: name, owner: ownerOf(call).name, callback: callback.name, span: call.loc });
              }
            }
            const rejected = nodes.filter(node => node.kind === "intrinsic" && node.name === "promise.reject");
            assert.equal(rejected.length, [...sourceText.matchAll(/Promise\.reject\(/g)].length);
            assert.ok(rejected.length > 0);
            for (const node of rejected) { assert.equal(node.type.kind, "promise"); ownerOf(node); }
            // The new listeners receive checked-dynamic native promises. Their .catch uses
            // lowerDynDispatchMethodCall -> dynInvoke, not the typed async catch helper.
            const catches = nodes.filter(node => node.kind === "dynInvoke" && node.method === "catch");
            assert.equal(catches.length, [...sourceText.matchAll(/\.catch\(/g)].length);
            assert.ok(catches.length > 0);
            const catchEvidence = catches.map(call => {
              assert.equal(call.args.length, 1); assert.equal(call.recv.type.kind, "dyn");
              assert.ok(/\.catch\(/.test(spelling(call)), "catch lost source provenance");
              assert.equal(collect(call.recv, islandCall).length, 0, "catch receiver is a Node value");
              const callback = nativeClosure(call.args[0]); roots.push(callback);
              assert.ok(collect(callback.body, node => node.kind === "intrinsic" && node.name === "console.log").length);
