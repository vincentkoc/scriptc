                observed.ir.compile = execute(spec.id + "-ir", process.execPath, [...common, "--emit=ir", "-o", irPath], 180,
                  { SCRIPTC_CACHE_DIR: irCache, SCRIPTC_SAN: "", SCRIPTC_LIBNODE: "" });
                observed.ir.attempted = observed.ir.compile.status !== "tool-error";
                if (existsSync(irPath)) observed.ir.artifact = recordFile(irPath);
                assert.ok(validateCompile(observed.ir.compile, entry, irPath, spec), "IR compilation or diagnostics failed");
                assert.ok(observed.ir.artifact, "successful IR build did not produce its artifact");
                observed.ir.ownership = irEvidence(JSON.parse(readFileSync(irPath, "utf8")), spec, entry);
                observed.ir.status = "passed";
              } catch (error) { observed.ir.status = "failed"; observed.ir.error = scrub(error.stack ?? error); }
              finally { save(); }
              for (const flavor of ["plain", "san"]) {
                const result = observed.flavors[flavor] = { status: "running", execution: { status: "not-executed", attempted: false }, parity: "not-compared" };
                const build = join(work, spec.id + "-" + flavor); mkdirSync(build);
                const binary = join(build, "program"), cache = join(build, "cache"); mkdirSync(cache, { mode: 0o700 });
                const env = { SCRIPTC_CACHE_DIR: cache, SCRIPTC_SAN: "", SCRIPTC_LIBNODE: spec.hosted ? packRoot : "", ASAN_OPTIONS: "detect_leaks=0" };
                try {
                  const args = [...common, "-o", binary, "--keep-llvm", ...(spec.hosted ? ["--libnode=beside"] : []), ...(flavor === "san" ? ["--sanitize"] : [])];
                  result.compile = execute(spec.id + "-" + flavor + "-compile", process.execPath, args, 300, env);
                  // The compiler retains LLVM by entry stem, not executable name.
                  if (existsSync(join(build, "main.ll"))) {
                    const llvm = join(artifacts, flavor + ".ll"); copyFileSync(join(build, "main.ll"), llvm); result.llvm = recordFile(llvm);
                  }
                  assert.ok(validateCompile(result.compile, entry, binary, spec), "native compilation or diagnostics failed");
                  result.execution = { status: "blocked-before-execution", attempted: false };
                  assert.equal(observed.ir.status, "passed", "native execution requires admitted IR");
                  assert.ok(result.llvm, "successful native build did not retain LLVM");
                  const llvmText = readFileSync(join(out, result.llvm.path), "utf8");
                  const modules = binary + ".libnode/modules";
                  const verifyDeployment = () => {
                    if (spec.hosted) {
                      const beside = readLibnodePack(binary + ".libnode", { verifyHashes: true });
                      assert.deepEqual(beside.manifest, pack.manifest);
                      const expected = Object.keys(spec.files).filter(file => file.startsWith("node_modules/checkpoint-host/")).sort();
                      const shipped = moduleFiles(modules);
                      assert.deepEqual(shipped.map(file => file.path).sort(), expected);
                      for (const file of shipped) {
                        assert.equal(file.bytes, Buffer.byteLength(spec.files[file.path]));
                        assert.equal(file.sha256, digest(spec.files[file.path]));
                      }
                      if (result.moduleFiles) assert.deepEqual(shipped, result.moduleFiles);
                      else result.moduleFiles = shipped;
                    } else {
                      assert.equal(existsSync(binary + ".libnode"), false, "native-only build deployed libnode");
                      assert.ok(!/call void @scr_node_island_install(?:_modules)?\(/.test(llvmText), "native-only LLVM installs Node modules");
                      assert.ok(!/@scr_ni_/.test(llvmText), "native-only LLVM calls the Node bridge");
                    }
                  };
                  verifyDeployment(); result.deploymentVerified = true;
                  result.moduleOwners = { entry: "native", callbackChain: "native", islands: spec.hosted ? ["checkpoint-host"] : [] };
                  result.binarySha256 = hash(binary);
                  if (spec.hosted) {
                    const manifestCopy = join(artifacts, flavor + ".libnode-manifest.json");
                    copyFileSync(binary + ".libnode/manifest.json", manifestCopy); result.libnodeManifest = recordFile(manifestCopy);
                  }
                  result.execution = execute(spec.id + "-" + flavor + "-run", binary, [], 30, { ...env, SCRIPTC_LIBNODE: "" });
                  result.execution.attempted = result.execution.status !== "tool-error";
                  result.execution.parityOutcome = parityOutcome(result.execution, flavor === "san");
                  const expectedOutcome = observed.oracle?.parityOutcome, actualOutcome = result.execution.parityOutcome;
                  result.parity = observed.oracle?.expectedMatched && expectedOutcome && result.execution.status === "completed" &&
                    actualOutcome.code === expectedOutcome.code && actualOutcome.signal === expectedOutcome.signal &&
                    actualOutcome.stdoutSha256 === expectedOutcome.stdoutSha256 && actualOutcome.stderrSha256 === expectedOutcome.stderrSha256 ? "matched" : "mismatch";
                  assert.equal(hash(binary), result.binarySha256);
                  verifyDeployment();
                  verifyFixtures();
                  result.inputsVerifiedAfter = true;
                  assert.ok(result.llvm, "successful native build did not retain LLVM");
                  assert.equal(result.parity, "matched"); result.status = "passed";
                } catch (error) { result.status = "failed"; result.error = scrub(error.stack ?? error); }
                finally { save(); }
              }
              observed.complete = completeCase(observed); save();
            }
            {
              const harnessLink = join(root, "node_modules/.cache/scriptc-tests");
              assert.equal(lstatSync(harnessLink, { throwIfNoEntry: false }), undefined, "harness output already has an owner");
              const harnessOutput = join(work, "harness-output"); mkdirSync(harnessOutput);
              mkdirSync(join(root, "node_modules/.cache"), { recursive: true });
              symlinkSync(harnessOutput, harnessLink, "dir");
              const gateArtifacts = join(out, "gates"); mkdirSync(gateArtifacts);
              for (const spec of gateSpecs) {
                const gate = { id: spec.id, status: "running", expectedTests: spec.tests ?? Object.values(spec.expectedByFile ?? {}).flat(), llvmModes: spec.llvmModes ?? null };
                report.gates.push(gate);
                const scratch = join(work, "gate-" + spec.id); mkdirSync(scratch, { mode: 0o700 });
                const cache = join(scratch, "cache"), temp = join(scratch, "tmp"); mkdirSync(cache, { mode: 0o700 }); mkdirSync(temp);
                const jsonPath = join(gateArtifacts, spec.id + ".vitest.json");
                const collectionPath = join(gateArtifacts, spec.id + ".collection.json");
                const env = { SCRIPTC_TEST_WORKERS: "2", SCRIPTC_SAN: spec.sanitize ? "1" : "",
                  SCRIPTC_CACHE_DIR: cache, XDG_CACHE_HOME: join(scratch, "xdg"), TMPDIR: temp, ASAN_OPTIONS: "detect_leaks=0", SCRIPTC_LIBNODE: packRoot };
                try {
                  assert.equal(process.env.SCRIPTC_LLVM_TEST_MODE, undefined);
                  assert.equal(process.env.SCRIPTC_TEST_OPTIMIZATION, undefined);
                  assert.equal(process.env.SCRIPTC_TEST_SHARD, undefined); assert.equal(process.env.SCRIPTC_CPU_DISPATCH, undefined);
                  gate.environment = { llvmTestMode: null, testOptimization: null, cpuDispatch: null, shard: null, sanitize: env.SCRIPTC_SAN };
                  if (spec.collect) {
                    // Vitest 3.2.7 list records file/name pairs; the run must execute that exact inventory.
                    gate.collectionStep = execute("collect-" + spec.id, "pnpm", ["exec", "vitest", "list", ...spec.files, "--json=" + collectionPath], 300, env);
                    requireSuccess(gate.collectionStep);
                    gate.collection = recordFile(collectionPath); assert.ok(gate.collection.bytes <= 16 * 1024 ** 2);
                  }
                  gate.step = execute("gate-" + spec.id, "pnpm",
                    [...spec.args, ...(spec.files ? ["--reporter=default", "--reporter=json", "--outputFile=" + jsonPath] : [])], spec.seconds, env);
                  gate.attempted = gate.step.status !== "tool-error";
                  if (spec.files) {
                    gate.artifact = recordFile(jsonPath); assert.ok(gate.artifact.bytes <= 16 * 1024 ** 2);
                    const data = JSON.parse(readFileSync(jsonPath, "utf8"));
                    const collection = spec.collect ? JSON.parse(readFileSync(collectionPath, "utf8")) : undefined;
                    Object.assign(gate, verifyGateData(spec, data, collection));
                    if (spec.id.startsWith("ownership-")) {
                      assert.equal(gate.executedCount, 1);
                      assert.equal(gate.tests[0].name, spec.tests[0]);
                    }
                  }
                  requireSuccess(gate.step); gate.status = "passed";
                } catch (error) { gate.status = "failed"; gate.error = scrub(error.stack ?? error); }
                finally { save(); }
              }
              assert.equal(readlinkSync(harnessLink), harnessOutput);
            }
            report.executionAttempts = report.cases.flatMap(item => Object.values(item.flavors)).filter(item => item.execution.attempted === true).length;
            report.diagnosticComplete = report.cases.length === specs.length && report.cases.every(item => item.complete);
            report.diagnosticComplete &&= report.executionAttempts === report.expectedExecutionAttempts;
            report.gatesComplete = report.gates.length === gateSpecs.length && report.gates.every(gate => gate.status === "passed");
            report.qualificationComplete = report.diagnosticComplete && report.gatesComplete && report.cases.every(item =>
              ["plain", "san"].every(flavor => item.flavors[flavor].status === "passed" && item.flavors[flavor].parity === "matched"));
            report.status = report.qualificationComplete ? "passed" : "failed";
          } catch (error) { report.status = "failed"; report.error = scrub(error.stack ?? error); }
          finally {
            try { assert.ok(verifyNativeInputs, "native preparation was incomplete"); verifyNativeInputs(); assert.deepEqual(source(), report.sourceInputs); report.sourceVerifiedAfter = true; verifyFixtures(); report.fixturesVerifiedAfter = true; }
            catch (error) { report.status = "failed"; report.diagnosticComplete = false; report.qualificationComplete = false; report.sourceError = scrub(error.stack ?? error); }
            report.finishedAt = new Date().toISOString(); save();
            writeFileSync(join(out, "summary.sha256"), hash(join(out, "summary.json")) + "\n");
            console.log(JSON.stringify({ label: report.label, status: report.status, diagnosticComplete: report.diagnosticComplete, qualificationComplete: report.qualificationComplete }));
            if (!report.qualificationComplete) { console.error("[native-rejection-checkpoint-diagnostic] FAILED (exit 1)"); process.exitCode = 1; }
          }
          PROOF
          ulimit -c 0
          node "$RUNNER_TEMP/native-rejection-checkpoint-diagnostic.mjs"
      - name: Remove this diagnostic's build scratch
        if: always()
        run: |
          node --input-type=module <<'CLEANUP'
          import assert from "node:assert/strict";
          import { existsSync, lstatSync, mkdirSync, readFileSync, readlinkSync, rmSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const temp = process.env.RUNNER_TEMP, work = join(temp, "native-rejection-checkpoint-work"), out = join(temp, "native-rejection-checkpoint-proof");
          const owner = { runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, label: process.env.DIAGNOSTIC_LABEL, workflow: process.env.GITHUB_SHA };
          const receipt = { ...owner, work: "absent", payload: "absent" };
          try {
            if (existsSync(work)) {
              assert.deepEqual(JSON.parse(readFileSync(join(work, ".diagnostic-owner.json"), "utf8")), owner);
              const link = join(process.cwd(), "node_modules/.cache/scriptc-tests");
              if (lstatSync(link, { throwIfNoEntry: false })) {
                assert.equal(lstatSync(link).isSymbolicLink(), true);
                assert.equal(readlinkSync(link), join(work, "harness-output")); rmSync(link); receipt.harnessLink = "removed";
              }
              rmSync(work, { recursive: true }); receipt.work = "removed";
            }
            const payload = join(temp, "native-rejection-checkpoint-diagnostic.mjs");
            if (existsSync(payload)) { rmSync(payload); receipt.payload = "removed"; }
          } catch (error) { receipt.error = String(error); process.exitCode = 1; }
          finally {
            mkdirSync(out, { recursive: true });
            writeFileSync(join(out, "cleanup.json"), JSON.stringify(receipt, null, 2) + "\n");
            if (process.exitCode) console.error("[native-rejection-checkpoint-cleanup] FAILED (exit 1)");
          }
          CLEANUP
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-rejection-checkpoint-late-queue-qualification
          path: ${{ runner.temp }}/native-rejection-checkpoint-proof
          if-no-files-found: error
          retention-days: 1
