name: Qualify compiler-driven TLS regressions

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/qualify-tls-regressions.yml]

permissions:
  contents: read

concurrency:
  group: qualify-tls-regressions-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 8b9f7981e9198831474bbbe2eb47c48407daa380

jobs:
  policy:
    if: github.repository == 'vincentkoc/scriptc'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    env:
      SCRIPTC_TEST_WORKERS: 1
      PROOF_CAPACITY_NAME: native-tls-regressions-capacity
      DIAGNOSTIC_SOURCE: 8b9f7981e9198831474bbbe2eb47c48407daa380
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify immutable source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Admit disk capacity before LLVM
        shell: python
        run: |
          probe = r"""import json
          import os
          import pathlib
          import sys

          phase = sys.argv[1]
          minimum_gib, minimum_inodes = {
              "pre-llvm": (32, 1000000),
              "post-llvm": (16, 500000),
              "pre-proof": (16, 250000),
          }[phase]
          owner = {
              "workflow": os.environ["GITHUB_SHA"],
              "run": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source": os.environ.get("CALLBACK_SOURCE") or os.environ["DIAGNOSTIC_SOURCE"],
          }
          devices = {}
          errors = {}
          for label, path in {
              "root": "/",
              "workspace": os.environ["GITHUB_WORKSPACE"],
              "runnerTemp": os.environ["RUNNER_TEMP"],
          }.items():
              try:
                  info = os.statvfs(path)
                  device = str(os.stat(path).st_dev)
                  row = devices.setdefault(device, {"device": device, "paths": [], "measurements": []})
                  row["paths"].append(label)
                  row["measurements"].append({
                      "path": label,
                      "availableBytes": info.f_bavail * info.f_frsize,
                      "availableInodes": info.f_favail,
                  })
              except OSError as error:
                  errors[label] = {"type": type(error).__name__, "errno": error.errno}
          for row in devices.values():
              row["availableBytes"] = min(item["availableBytes"] for item in row["measurements"])
              row["availableInodes"] = min(item["availableInodes"] for item in row["measurements"])
              row["admitted"] = row["availableBytes"] >= minimum_gib * 1024 ** 3 and row["availableInodes"] >= minimum_inodes
          report = {
              **owner, "phase": phase,
              "imageOS": os.environ.get("ImageOS"),
              "imageVersion": os.environ.get("ImageVersion"),
              "runnerOS": os.environ.get("RUNNER_OS"),
              "runnerArch": os.environ.get("RUNNER_ARCH"),
              "budgetKind": "conservative execution budget, not a measured peak",
              "minimumBytes": minimum_gib * 1024 ** 3,
              "minimumInodes": minimum_inodes,
              "devices": list(devices.values()), "measurementErrors": errors,
              "admitted": not errors and bool(devices) and all(row["admitted"] for row in devices.values()),
              "toolsRemoved": False,
          }
          text = json.dumps(report, indent=2) + "\n"
          print(text, flush=True)
          capacity_dir = pathlib.Path(os.environ["RUNNER_TEMP"], os.environ["PROOF_CAPACITY_NAME"])
          os.umask(0o077)
          if phase == "pre-llvm":
              capacity_dir.mkdir(mode=0o700)
          else:
              previous = json.loads((capacity_dir / "pre-llvm.json").read_text())
              assert {key: previous[key] for key in owner} == owner, "capacity receipt owner mismatch"
          with (capacity_dir / (phase + ".json")).open("x") as receipt:
              receipt.write(text)
          if not report["admitted"]:
              print("[proof-capacity] FAILED (exit 1): disk or inode admission refused", file=sys.stderr)
              raise SystemExit(1)
          """
          import os, pathlib, sys
          sys.argv = ["capacity.py", "pre-llvm"]
          exec(compile(probe, "capacity.py", "exec"))
          payload = pathlib.Path(os.environ["RUNNER_TEMP"], os.environ["PROOF_CAPACITY_NAME"], "capacity.py")
          with payload.open("x") as script:
              script.write(probe)
      - uses: ./.github/actions/llvm-linux
      - name: Recheck disk capacity after LLVM
        run: |
          test "$(sha256sum "$RUNNER_TEMP/$PROOF_CAPACITY_NAME/capacity.py" | cut -d ' ' -f 1)" = "13e2743a6dea3948dae2f0f8e25e03f0dd775a5968ca1471f4989684668764e9"
          python3 "$RUNNER_TEMP/$PROOF_CAPACITY_NAME/capacity.py" post-llvm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zig
      - uses: ./.github/actions/native-packages
        with:
          target: linux-x64-gnu
      - name: Disable piped core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Run compiler-driven TLS tests
        shell: python
        run: |
          import ctypes
          import hashlib
          import json
          import os
          from pathlib import Path
          import signal
          import subprocess
          import sys
          import time
          import re

          # Own orphaned compiler/test children until they have been reaped.
          assert ctypes.CDLL(None, use_errno=True).prctl(36, 1, 0, 0, 0) == 0
          for key in ("SCRIPTC_TEST_SHARD", "SCRIPTC_TEST_OPTIMIZATION", "SCRIPTC_LLVM_TEST_MODE",
                      "SCRIPTC_CPU_DISPATCH", "SCRIPTC_CPU_LEVEL", "SCRIPTC_TARGET", "SCRIPTC_NO_CACHE",
                      "SCRIPTC_CACHE_DIR", "SCRIPTC_TEST_RUNTIME_SRC_DIR", "NODE_OPTIONS", "NODE_EXTRA_CA_CERTS",
                      "SSL_CERT_FILE", "SSL_CERT_DIR"):
              os.environ.pop(key, None)
          os.environ["SCRIPTC_TEST_STABLE_TOOLCHAIN"] = "1"
          os.environ["ASAN_OPTIONS"] = "detect_leaks=0"
          root = Path.cwd()
          out = Path(os.environ["RUNNER_TEMP"]) / "native-tls-regressions-proof"
          out.mkdir(mode=0o700)
          report = {
              "source": os.environ["SOURCE_SHA"], "workflow": os.environ["GITHUB_SHA"],
              "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "scope": "compiler-driven TLS regressions on Linux, pinned Node oracle", "qualificationComplete": False,
              "complete": False, "steps": [],
          }
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          def save():
              (out / "summary.json").write_text(json.dumps(report, indent=2) + "\n")
          def capture(args):
              return subprocess.check_output(args, text=True, timeout=30).strip()
          def source_inputs():
              paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
              rows = {}
              for raw in paths:
                  if not raw:
                      continue
                  name = os.fsdecode(raw)
                  path = root / name
                  rows[name] = {"mode": path.lstat().st_mode, "sha256": digest(
                      os.fsencode(os.readlink(path)) if path.is_symlink() else path.read_bytes())}
              return rows
          def group_alive(group):
              while True:
                  try:
                      pid, _ = os.waitpid(-group, os.WNOHANG)
                      if pid == 0:
                          break
                  except ChildProcessError:
                      break
              try:
                  os.killpg(group, 0)
                  return True
              except ProcessLookupError:
                  return False
          def signal_group(group, sig):
              assert group > 1
              try:
                  os.killpg(group, sig)
              except ProcessLookupError:
                  pass
          cancellation = 0
          def interrupted(signum, frame):
              global cancellation
              cancellation = signum
          signal.signal(signal.SIGTERM, interrupted)
          signal.signal(signal.SIGINT, interrupted)
          def execute(name, args, env=None, limit=600):
              if cancellation:
                  raise RuntimeError("cancelled before " + name)
              row = {"name": name, "args": args, "timeoutSeconds": limit}
              report["steps"].append(row)
              save()
              started = time.monotonic()
              streams = [out / (name + suffix) for suffix in (".stdout.log", ".stderr.log")]
              with streams[0].open("xb") as stdout, streams[1].open("xb") as stderr:
                  # The handler records cancellation across spawn and drainage;
                  # it never raises between acquiring the child and cleanup.
                  child = subprocess.Popen(args, stdin=subprocess.DEVNULL, stdout=stdout, stderr=stderr,
                                           start_new_session=True, env={**os.environ, **(env or {})})
                  assert child.pid > 1
                  row["group"] = child.pid
                  row["timedOut"] = False
                  try:
                      save()
                      deadline = time.monotonic() + limit
                      while child.poll() is None and not cancellation and time.monotonic() < deadline:
                          try:
                              child.wait(timeout=0.25)
                          except subprocess.TimeoutExpired:
                              pass
                      row["timedOut"] = child.poll() is None and not cancellation
                  finally:
                      # Cancellation also seals the streams only after this group drains.
                      if child.poll() is None:
                          signal_group(child.pid, signal.SIGTERM)
                          try:
                              child.wait(timeout=5)
                          except subprocess.TimeoutExpired:
                              signal_group(child.pid, signal.SIGKILL)
                              child.wait(timeout=5)
                      row["exitCode"] = child.returncode
                      deadline = time.monotonic() + 5
                      while group_alive(child.pid) and time.monotonic() < deadline:
                          time.sleep(0.05)
                      row["forcedCleanup"] = group_alive(child.pid)
                      if row["forcedCleanup"]:
                          signal_group(child.pid, signal.SIGKILL)
                          deadline = time.monotonic() + 5
                          while group_alive(child.pid) and time.monotonic() < deadline:
                              time.sleep(0.05)
                      row["drained"] = not group_alive(child.pid)
                      row["streamsSealed"] = row["drained"]
                      row["cancelledSignal"] = cancellation
                      save()
              row["seconds"] = round(time.monotonic() - started, 3)
              row["streams"] = [{"path": p.name, "bytes": p.stat().st_size,
                                  "sha256": digest(p.read_bytes())} for p in streams]
              save()
              print(json.dumps(row), flush=True)
              if row["exitCode"] != 0 or row["timedOut"] or row["forcedCleanup"] or not row["drained"] or cancellation:
                  for path in streams:
                      print(path.read_bytes()[-12000:].decode(errors="replace"), flush=True)
                  raise RuntimeError(name + " failed; full streams retained")
          before = None
          try:
              assert capture(["git", "rev-parse", "HEAD"]) == report["source"]
              assert capture(["git", "status", "--porcelain=v1", "--untracked-files=all"]) == ""
              before = source_inputs()
              (out / "source-inputs.json").write_text(json.dumps(before, sort_keys=True, indent=2) + "\n")
              report["tools"] = {name: capture([name, "--version"]) for name in ("node", "pnpm", "clang")}
              report["tools"]["llvm"] = capture(["llvm-config", "--version"])
              report["tools"]["zig"] = capture(["zig", "version"])
              assert report["tools"]["node"] == "v" + Path(".node-version").read_text().strip() == "v24.22.0"
              assert report["tools"]["llvm"] == "22.1.8" and report["tools"]["zig"] == "0.16.0"
              execute("capacity", ["python3", str(Path(os.environ["RUNNER_TEMP"], os.environ["PROOF_CAPACITY_NAME"], "capacity.py")), "pre-proof"])
              pack_root = Path("packages/runtime-linux-x64-gnu")
              pack_path = pack_root / "runtime-pack.json"
              pack_bytes = pack_path.read_bytes()
              pack = json.loads(pack_bytes)
              assert pack["schema"] == "scriptc.runtime-pack.v1" and pack["runtime_abi"]["version"] == 48
              assert pack["macros"]["sanitizer"] == "external-toolchain-required"
              assert "SCR_RC_AUDIT" in pack["macros"]["excluded"]
              (out / "runtime-pack.json").write_bytes(pack_bytes)
              helper = {p.as_posix(): digest(p.read_bytes()) for p in sorted(Path("packages/llvm-linux-x64-gnu/bin").rglob("*")) if p.is_file()}
              assert helper
              report["native"] = {"manifestSha256": digest(pack_bytes), "helper": helper,
                                  "plain": "runtime pack", "san": "instrumented runtime sources", "tlsUnits": {}}
              for flavor in ("release", "dev"):
                  units = [u for u in pack["flavors"][flavor]["runtime_units"] if Path(u["source"]).name in ("scr_tls.c", "scr_error.c")]
                  assert {Path(u["source"]).name for u in units} == {"scr_tls.c", "scr_error.c"}
                  report["native"]["tlsUnits"][flavor] = units
              execute("pack-before", ["node", "packages/runtime-linux-x64-gnu/scripts/verify.mjs"])
              corpus = ["5562-https-verify-errors.ts", "5664-tls-client-identity.ts", "7097-tls-client-certificates.ts",
                        "7098-tls-client-certificates-paths.ts", "7440-tls-server-add-context.ts", "7441-tls-client-error.ts", "7443-tls-final-flight.ts"]
              leaks = ["7087-tls-socket-wrap.ts", "7088-tls-socket-connect-tunnel.ts", "7094-tls-socket-failed-handshakes.ts",
                       "7095-tls-peer-certificates.ts", "7097-tls-client-certificates.ts", "7098-tls-client-certificates-paths.ts",
                       "7440-tls-server-add-context.ts", "7441-tls-client-error.ts", "7443-tls-final-flight.ts"]
              assert all(Path("tests/corpus", name).is_file() for name in set(corpus + leaks))
              pattern = r"(?:^| )(?:" + "|".join(re.escape(name) for name in corpus) + r")$"
              gates = [
                  ("trust-plain", "tls-trust-store.test.ts", False, ["a server's empty ca Buffer is an empty trust store, as in Node"], None),
                  ("trust-san", "tls-trust-store.test.ts", True, ["a server's empty ca Buffer is an empty trust store, as in Node"], None),
                  ("corpus-plain", "differential.test.ts", False, corpus, pattern),
                  ("corpus-san", "differential.test.ts", True, corpus, pattern),
                  ("leaks-san", "tls-socket-leaks.test.ts", True, ["tests/corpus/" + name + " reports no leaks" for name in leaks], None),
              ]
              report["gates"] = []
              for name, test_file, san, expected, selection in gates:
                  result_path = out / (name + ".vitest.json")
                  args = ["pnpm", "test", "tests/harness/" + test_file, "--reporter=verbose", "--reporter=json", "--outputFile=" + str(result_path)]
                  if selection is not None:
                      args += ["--testNamePattern", selection]
                  execute(name, args, {"SCRIPTC_SAN": "1" if san else ""}, limit=900)
                  assert result_path.stat().st_size <= 64 * 1024**2
                  result = json.loads(result_path.read_text())
                  rows = [item for suite in result["testResults"] for item in suite["assertionResults"]]
                  passed = [item for item in rows if item["status"] == "passed"]
                  assert len(passed) == len(expected) == result["numPassedTests"]
                  assert {item["title"] for item in passed} == set(expected)
                  assert result["numFailedTests"] == 0 and result["success"]
                  if selection is None:
                      assert len(rows) == len(expected) and result["numPendingTests"] == 0
                  else:
                      assert all(item["status"] in ("passed", "pending", "skipped") for item in rows)
                  # Vitest 3.2.7's verbose reporter emits the final retryCount beside each row.
                  log = re.sub(r"\x1b\[[0-9;]*m", "", (out / (name + ".stdout.log")).read_text())
                  retry_lines = {title: [line for line in log.splitlines() if title in line] for title in expected}
                  assert all(retry_lines.values()), "selected test missing from verbose reporter"
                  retries = {title: max([int(m.group(1)) for line in lines
                                        for m in re.finditer(r"\(retry x(\d+)\)", line)] or [0])
                             for title, lines in retry_lines.items()}
                  assert all(count <= (1 if selection is not None else 0) for count in retries.values())
                  report["gates"].append({"name": name, "passed": len(passed), "selected": expected,
                                          "excluded": len(rows) - len(passed), "retryCounts": retries,
                                          "attempts": len(passed) + sum(retries.values())})
                  save()
              execute("pack-after", ["node", "packages/runtime-linux-x64-gnu/scripts/verify.mjs"])
              assert pack_path.read_bytes() == pack_bytes
              assert {p.as_posix(): digest(p.read_bytes()) for p in sorted(Path("packages/llvm-linux-x64-gnu/bin").rglob("*")) if p.is_file()} == helper
              report["native"]["unchangedAfter"] = True
              assert sum(g["passed"] for g in report["gates"]) == 25
              assert not cancellation, "cancelled before proof completion"
              report["complete"] = True
          except BaseException as error:
              report["failure"] = str(error)
              print(str(error), file=sys.stderr, flush=True)
          finally:
              if before is not None:
                  try:
                      report["sourceUnchanged"] = source_inputs() == before
                      assert report["sourceUnchanged"]
                      assert capture(["git", "rev-parse", "HEAD"]) == report["source"]
                      assert capture(["git", "status", "--porcelain=v1", "--untracked-files=all"]) == ""
                  except BaseException as error:
                      report["complete"] = False
                      report["identityFailure"] = str(error)
              if cancellation:
                  report["complete"] = False
                  report["cancelledSignal"] = cancellation
              save()
              files = [{"path": p.name, "bytes": p.stat().st_size, "sha256": digest(p.read_bytes())}
                       for p in sorted(out.iterdir()) if p.is_file()]
              (out / "manifest.json").write_text(json.dumps(files, indent=2) + "\n")
          if not report["complete"] or cancellation:
              print("[tls-regressions] FAILED (exit 1)", file=sys.stderr, flush=True)
              raise SystemExit(1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tls-regressions-proof
          path: ${{ runner.temp }}/native-tls-regressions-proof
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-tls-regressions-capacity
          path: ${{ runner.temp }}/native-tls-regressions-capacity
          if-no-files-found: error
          retention-days: 7
