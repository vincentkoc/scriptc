            save("summary.json", { schemaVersion: 1, ...owner, runnerSha256: hash(self), baseline: base, scope: "shard-debug-missed-and-repaired-tests", gates: [], priorEvidence, workloadsExecuted: 0, workspaceBuildExecuted: false, qualityScope: "changed helper only", followupComplete: false, fullQualification: false, completeCampaign: false, sourceAtSetup: source(), sourceRelationshipAtSetup: sourceRelationship() });
          }
          function finalize() {
            const report = json(join(out, "summary.json")), cleanup = { passed: false, retained: true };
            try {
              verifyWorkOwner(); assert.deepEqual(Object.fromEntries(Object.keys(owner).map(k => [k, report[k]])), owner);
              assert.ok(allDrained(), "owned process custody unresolved"); cleanup.restoration = restoreSplit();
              cleanup.source = source(); assert.deepEqual(cleanup.source, report.sourceAtSetup);
              assert.deepEqual(sourceRelationship(), report.sourceRelationshipAtSetup);
              assert.equal(hash(self), report.runnerSha256);
              rmSync(work, { recursive: true }); cleanup.passed = true; cleanup.retained = false;
            } catch (error) { cleanup.error = String(error.stack ?? error); }
            report.cleanup = cleanup; report.followupComplete = report.followupPassed === true && cleanup.passed; report.fullQualification = false;
            save("summary.json", report); assert.equal(report.followupComplete, true, "follow-up or cleanup incomplete");
          }
          if (process.argv[2] !== "--probe") {
            try {
              if (process.argv[2] === "--init") initialize();
              else if (process.argv[2] === "--finalize") finalize();
              else if (process.argv[2] === "--quality") await quality();
              else if (process.argv[2] === "--child") await childMain();
              else await main();
            } catch (error) { process.stderr.write(String(error.stack ?? error) + "\n[shard-debug-qualification] FAILED (exit 1)\n"); process.exitCode = 1; }
          }

          RUNNER
          node "$RUNNER_TEMP/shard-debug-runner.mjs" --init
      - run: pnpm install --frozen-lockfile
      - name: Code quality before native preparation
        run: node "$RUNNER_TEMP/shard-debug-runner.mjs" --quality
      - name: Admit Linux disk capacity before LLVM
        id: capacity
        if: runner.os == 'Linux'
        shell: python
        run: |
          probe = r"""import json
          import os
          import pathlib
          import sys

          phase = sys.argv[1]
          minimum_gib, minimum_inodes = {
              "pre-llvm": (32, 1000000),
              "post-llvm": (16, 500000),
              "pre-proof": (16, 250000),
          }[phase]
          owner = {
              "workflow": os.environ["GITHUB_SHA"],
              "run": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source": os.environ["SOURCE_SHA"],
          }
          devices = {}
          errors = {}
          for label, path in {
              "root": "/",
              "workspace": os.environ["GITHUB_WORKSPACE"],
              "runnerTemp": os.environ["RUNNER_TEMP"],
          }.items():
              try:
                  info = os.statvfs(path)
                  device = str(os.stat(path).st_dev)
                  row = devices.setdefault(device, {"device": device, "paths": [], "measurements": []})
                  row["paths"].append(label)
                  row["measurements"].append({
                      "path": label,
                      "availableBytes": info.f_bavail * info.f_frsize,
                      "availableInodes": info.f_favail,
                  })
              except OSError as error:
                  errors[label] = {"type": type(error).__name__, "errno": error.errno}
          for row in devices.values():
              row["availableBytes"] = min(item["availableBytes"] for item in row["measurements"])
              row["availableInodes"] = min(item["availableInodes"] for item in row["measurements"])
              row["admitted"] = row["availableBytes"] >= minimum_gib * 1024 ** 3 and row["availableInodes"] >= minimum_inodes
          report = {
              **owner, "phase": phase,
              "imageOS": os.environ.get("ImageOS"),
              "imageVersion": os.environ.get("ImageVersion"),
              "runnerOS": os.environ.get("RUNNER_OS"),
              "runnerArch": os.environ.get("RUNNER_ARCH"),
              "budgetKind": "conservative execution budget, not a measured peak",
              "minimumBytes": minimum_gib * 1024 ** 3,
              "minimumInodes": minimum_inodes,
              "devices": list(devices.values()), "measurementErrors": errors,
              "admitted": not errors and bool(devices) and all(row["admitted"] for row in devices.values()),
              "toolsRemoved": False,
          }
          text = json.dumps(report, indent=2) + "\n"
          print(text, flush=True)
          capacity_dir = pathlib.Path(os.environ["RUNNER_TEMP"], os.environ["PROOF_CAPACITY_NAME"])
          os.umask(0o077)
          if phase == "pre-llvm":
              capacity_dir.mkdir(mode=0o700)
          else:
              previous = json.loads((capacity_dir / "pre-llvm.json").read_text())
              assert {key: previous[key] for key in owner} == owner, "capacity receipt owner mismatch"
          with (capacity_dir / (phase + ".json")).open("x") as receipt:
              receipt.write(text)
          if not report["admitted"]:
              print("[proof-capacity] FAILED (exit 1): disk or inode admission refused", file=sys.stderr)
              raise SystemExit(1)
          """
          import os, pathlib, sys
          sys.argv = ["capacity.py", "pre-llvm"]
          exec(compile(probe, "capacity.py", "exec"))
          payload = pathlib.Path(os.environ["RUNNER_TEMP"], os.environ["PROOF_CAPACITY_NAME"], "capacity.py")
          with payload.open("x") as script:
              script.write(probe)
      - uses: ./.github/actions/llvm-linux
        if: runner.os == 'Linux'
      - name: Recheck Linux disk capacity after LLVM
        if: runner.os == 'Linux'
        run: python3 "$RUNNER_TEMP/$PROOF_CAPACITY_NAME/capacity.py" post-llvm
      - uses: ./.github/actions/zig
        if: runner.os == 'Linux'
      - uses: ./.github/actions/native-packages
        with:
          target: ${{ matrix.target }}
      - name: Missed and repaired tests with one baseline mutation
        run: node "$RUNNER_TEMP/shard-debug-runner.mjs"
      - name: Finalize owned scratch
        if: always()
        run: |
          test -f "$RUNNER_TEMP/shard-debug-runner.mjs"
          node "$RUNNER_TEMP/shard-debug-runner.mjs" --finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-debug-followup-${{ matrix.target }}
          path: ${{ runner.temp }}/shard-debug-proof
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux' && steps.capacity.outcome != 'skipped'
        with:
          name: shard-debug-capacity-linux
          path: ${{ runner.temp }}/shard-debug-capacity
          if-no-files-found: error
          retention-days: 1
