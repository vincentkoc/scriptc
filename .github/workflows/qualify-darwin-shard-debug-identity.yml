name: Qualify Darwin shard debug identity

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/qualify-darwin-shard-debug-identity.yml]

permissions:
  contents: read

concurrency:
  group: qualify-darwin-shard-debug-identity-${{ github.ref }}
  cancel-in-progress: false

