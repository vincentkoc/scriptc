name: Qualify region metadata on Darwin

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/qualify-region-darwin.yml]

permissions:
  contents: read

concurrency:
  group: qualify-region-darwin-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 0e17511aaa44ede74b06d6483a0f802d30e7846e

jobs:
  native_darwin:
    name: Build Darwin arm64 native packages
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      # The workflow commit only carries this qualification job. Every build
      # and test consumes the unchanged PR head, not the workflow commit.
      - uses: actions/checkout@v4
        id: source
        with:
          repository: vincentkoc/scriptc
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code HEAD
          printf 'Source: %s\nWorkflow: %s\n' "$SOURCE_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/native-packages
        with:
          target: darwin-arm64
      - name: Preserve executable permissions in shared packages
        run: >-
          tar -czf "$RUNNER_TEMP/native-darwin-arm64.tar.gz"
          packages/llvm-darwin-arm64/bin
          packages/runtime-darwin-arm64/artifacts
          packages/runtime-darwin-arm64/runtime-pack.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-darwin-arm64
          path: ${{ runner.temp }}/native-darwin-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Verify source after build
        if: ${{ always() && steps.source.outcome == 'success' }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code HEAD

  darwin:
    name: Darwin ${{ matrix.flavor }} (${{ matrix.shard }}/3)
    needs: native_darwin
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        flavor: [plain, san]
        shard: [1, 2, 3]
    env:
      SCRIPTC_TEST_WORKERS: "4"
      SCRIPTC_SAN: ${{ matrix.flavor == 'san' && '1' || '' }}
      SCRIPTC_TEST_SHARD: ${{ matrix.shard }}/3
      SCRIPTC_CI_SUITE: darwin
    steps:
      - uses: actions/checkout@v4
        id: source
        with:
          repository: vincentkoc/scriptc
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code HEAD
          printf 'Source: %s\nWorkflow: %s\n' "$SOURCE_SHA" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: native-darwin-arm64
          path: ${{ runner.temp }}
      - run: tar -xzf "$RUNNER_TEMP/native-darwin-arm64.tar.gz"
      - run: node packages/runtime-darwin-arm64/scripts/verify.mjs
      - run: pnpm build
      - uses: ./.github/actions/libnode
      # This file selects UBSan, ASan/RC audit and TSan itself. The reduced
      # Darwin plan omits it, so run it once without a case-shard filter.
      - name: Complete region ownership regression
        if: matrix.flavor == 'plain' && matrix.shard == 1
        env:
          SCRIPTC_TEST_WORKERS: "1"
          SCRIPTC_TEST_SHARD: ""
        run: pnpm test packages/runtime/src/scr_region.test.ts
      - name: Canonical Darwin PR suite
        run: node scripts/ci-test.mjs
      - name: Verify source after tests
        if: ${{ always() && steps.source.outcome == 'success' }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git diff --exit-code HEAD
