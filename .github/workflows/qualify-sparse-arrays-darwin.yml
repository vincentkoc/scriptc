name: Qualify frozen sparse array mutations on Darwin

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/qualify-sparse-arrays-darwin.yml]

permissions:
  contents: read

concurrency:
  group: qualify-sparse-arrays-darwin
  cancel-in-progress: false

jobs:
  sparse_arrays:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vercel-labs/scriptc
          ref: 9f099228ba180c9a8d42cbadcf27d176f1c5fa0e
          persist-credentials: false
      - name: Apply the exact uncommitted candidate
        run: |
          python3 - <<'PATCH'
          import base64, hashlib, subprocess
          data = base64.b64decode("", validate=True)
          assert hashlib.sha256(data).hexdigest() == "9afc36e748af8fddb4ccf24180f70c7c06a5d68e57735b57e57ed2c5247a543c"
          subprocess.run(["git", "apply", "--check", "-"], input=data, check=True)
          subprocess.run(["git", "apply", "-"], input=data, check=True)
          PATCH
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format the candidate and record the exact tested sources
        run: |
          cat > "$RUNNER_TEMP/sparse-proof.mjs" <<'PROOF'
          import { spawnSync, execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync, copyFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { join } from "node:path";
          const root=process.cwd(), temp=process.env.RUNNER_TEMP;
          const head="9f099228ba180c9a8d42cbadcf27d176f1c5fa0e";
          const original={"CHANGELOG.md":"8ab8c6e320652eea70c905450646a3c967e68777d0b5dfab077ca6b47eb5ded5","packages/compiler/src/backend/llvm/emitter.ts":"1d2fda8a1088605bff5fd144fa1f39baac1dbea10759f523330856baae2d2820","packages/compiler/src/backend/llvm/expr-containers.ts":"e74db59003eae631e19b403a2ac2a611eb0bca41e724b7a50d04ff13774b9b2b","packages/compiler/src/frontend/lowering/lower-array-sort.ts":"58ec816e2b4a380308ba8db3e0db44edb551c4ad09414ce20f991794a67cb9ce","packages/runtime/src/scr_array.c":"7648691ca463e216ab20c9b86b4353e011ae342c0b6101c573f9371d0d71360d","packages/runtime/src/scr_array.h":"3d693edcd2e9d4cfd5d2363e1f529f7750d5db1ab24113f023c292198e59941f","packages/runtime/src/scr_publish.c":"bce24719b8a8c7aeefd0224e0309ef9970d0965fa81f65222264952fcbd8dd06","packages/runtime/test/test_array.c":"4c7123698c7682f36752496406bbefd13de47377963523b9deec22f4916ee026","packages/compiler/src/backend/llvm/expr-containers.test.ts":"da64627e04235eda85b6ed1c910c44fd35275ceb2198313040c564a2c768ebd9","tests/corpus/frozen-sparse-array-noops.ts":"9a24b0ff86ac734c449527beb5303f6a47f3cd65682668aabe3bc86a17947095"}, tracked=["CHANGELOG.md","packages/compiler/src/backend/llvm/emitter.ts","packages/compiler/src/backend/llvm/expr-containers.ts","packages/compiler/src/frontend/lowering/lower-array-sort.ts","packages/runtime/src/scr_array.c","packages/runtime/src/scr_array.h","packages/runtime/src/scr_publish.c","packages/runtime/test/test_array.c"], extra=["packages/compiler/src/backend/llvm/expr-containers.test.ts","tests/corpus/frozen-sparse-array-noops.ts"];
          let manifest=original;
          const fixture="tests/corpus/frozen-sparse-array-noops.ts";
          const baseline="packages/compiler/test/ts7/baselines/order-parity/"+fixture+".json";
          const prepared=join(temp,"sparse-formatted-sources.json");
          const summary=join(temp,"sparse-summary.json");
          const report={head,patchSha256:"9afc36e748af8fddb4ccf24180f70c7c06a5d68e57735b57e57ed2c5247a543c",workflow:process.env.GITHUB_SHA,node:process.version,platform:process.platform,arch:process.arch,status:"running",steps:[],flavors:[]};
          const hash=data=>createHash("sha256").update(data).digest("hex");
          const scrub=text=>String(text).split(root).join("<repo>").split(temp).join("<temp>");
          const save=()=>writeFileSync(summary,JSON.stringify(report,null,2)+"\n");
          const git=args=>execFileSync("git",args,{encoding:"utf8"}).trim();
          const verify=()=>{
            if(git(["rev-parse","HEAD"])!==head)throw Error("source head changed");
            for(const [file,expected] of Object.entries(manifest))
              if(hash(readFileSync(file))!==expected)throw Error("source hash changed: "+file);
            if(JSON.stringify(git(["diff","--name-only","HEAD"]).split("\n").sort())!==JSON.stringify([...tracked].sort()))throw Error("unexpected tracked source changes");
            const extras=git(["ls-files","--others","--exclude-standard"]).split("\n").filter(Boolean);
            if(extras.some(p=>!extra.includes(p)&&p!==baseline))throw Error("unexpected untracked source: "+extras.join(", "));
          };
          const run=(label,args,env={})=>{
            console.log("START "+label);
            const result=spawnSync("pnpm",args,{cwd:root,env:{...process.env,SCRIPTC_TEST_WORKERS:"2",SCRIPTC_NO_CACHE:"1",SCRIPTC_SAN:"",ASAN_OPTIONS:"detect_leaks=0",...env},encoding:"utf8",timeout:600000,maxBuffer:16*1024*1024});
            report.steps.push({label,code:result.status,signal:result.signal,error:result.error?.message,stdout:scrub(result.stdout??"").slice(-2500),stderr:scrub(result.stderr??"").slice(-2500)});
            save();console.log("DONE "+label+" exit="+result.status);return result;
          };
          const pass=(label,args,env)=>{
            const r=run(label,args,env);if(r.status!==0||r.error||r.signal)throw Error(label+" failed");
          };
          const active=data=>data.testResults.flatMap(s=>s.assertionResults).filter(t=>!["pending","skipped","todo"].includes(t.status));
          const unit="packages/compiler/src/backend/llvm/expr-containers.test.ts";
          const corpus=[
            "frozen-sparse-array-noops.ts",
            "7406-frozen-containers.ts",
            "native-array-frozen-noops.js",
            "array-sort-holes-published.ts",
            "2685-array-unshift-reverse.ts",
            "native-array-fill-copywithin.js",
            "2669-array-copying-methods.ts",
            "2701-array-sort-snapshot.ts",
            "2703-array-sparse-sort.ts",
            "2704-array-sparse-to-sorted.ts",
            "2705-array-sparse-sort-append.ts",
            "5362-array-sort-comparator-throws.ts",
            "5363-array-sort-comparator-writes.ts",
            "array-sort-dense-effects.ts"
          ].sort();
          const escape=s=>s.replace(/[.*+?^{}()|[\]\\$]/g,"\\$&");
          save();
          try {
            if(process.version!=="v"+readFileSync(".node-version","utf8").trim())throw Error("wrong Node oracle");
            if(process.argv[2]==="prepare") {
              verify();
              const formatted=Object.keys(original).filter(p=>p.startsWith("packages/compiler/")&&p.endsWith(".ts"));
              pass("format owned TypeScript",["exec","oxfmt","--write",...formatted]);
              manifest=Object.fromEntries(Object.keys(original).map(p=>[p,hash(readFileSync(p))]));
              const source=Object.fromEntries(formatted.map(p=>[p,readFileSync(p).toString("base64")]));
              writeFileSync(prepared,JSON.stringify({head,original,manifest,source},null,2)+"\n");
              report.status="prepared";
            } else {
              const preparation=JSON.parse(readFileSync(prepared,"utf8"));
              if(preparation.head!==head||JSON.stringify(preparation.original)!==JSON.stringify(original))throw Error("wrong preparation inputs");
              manifest=preparation.manifest;
              verify();
              report.formattedManifest=manifest;
              const rollback=["packages/compiler/src/backend/llvm/emitter.ts","packages/compiler/src/backend/llvm/expr-containers.ts"];
              const patched=rollback.map(p=>readFileSync(p));
              try {
                for(const file of rollback)writeFileSync(file,execFileSync("git",["show",head+":"+file]));
                const r=run("unfixed LLVM no-op regression",["test",unit,"-t","skips all storage writes","--reporter=json","--outputFile="+join(temp,"sparse-negative.json")]);
                const data=JSON.parse(readFileSync(join(temp,"sparse-negative.json"),"utf8")), tests=active(data);
                if(r.status!==1||r.error||r.signal||data.success||tests.length!==30||tests.some(t=>t.status!=="failed"||!t.failureMessages.join("\n").includes("not to match")))throw Error("negative control did not reproduce mutation reachability");
                report.negativeControl={status:"expected failure",tests:30,assertion:"immutable no-op reaches a storage mutator"};
              } finally {rollback.forEach((p,i)=>writeFileSync(p,patched[i]));}
              verify();
              const unitFiles=[unit,
                "packages/runtime/test/array.test.ts",
                "packages/compiler/src/backend/publication.test.ts",
                "packages/compiler/src/backend/llvm/publish.test.ts",
                "packages/compiler/src/frontend/lowering/lower-array-sort.test.ts"
              ];
              pass("fixed C and compiler regressions",["test",...unitFiles,"--reporter=json","--outputFile="+join(temp,"sparse-positive.json")]);
              const positive=JSON.parse(readFileSync(join(temp,"sparse-positive.json"),"utf8"));
              const groups=unitFiles.map(file=>{
                const suites=positive.testResults.filter(s=>s.name.endsWith("/"+file));
                const tests=suites.flatMap(s=>s.assertionResults);
                if(suites.length!==1||tests.length===0||tests.some(t=>t.status!=="passed"))throw Error("unit coverage missing: "+file);
                return {file,tests:tests.length};
              });
              if(!positive.success||groups[0].tests!==50||groups[1].tests!==5)throw Error("unit inventory mismatch");
              report.units={status:"passed",groups,cSanitizers:["address"],rcAudit:true};
            // Use the canonical frontend and normalization for this one new baseline.
            const generator=[
              'import { checkPreflightTs7 } from "./packages/compiler/src/frontend/program-node.ts";',
              'import { Ts7Host } from "./packages/compiler/src/frontend/ts7/program-adapter.ts";',
              'import { allOrderEntries, orderBaselinePath } from "./scripts/ts7-order-fixtures.mjs";',
              'import { writeFileSync, mkdirSync } from "node:fs";',
              'import { join, dirname } from "node:path";',
              'const root=process.cwd(), fixture='+JSON.stringify(fixture)+';',
              'const rel=s=>s.replaceAll("\\\\","/").split(root.replaceAll("\\\\","/")+"/").join("<repo>/");',
              'const host=new Ts7Host(); try {',
              'const a=checkPreflightTs7(join(root,fixture),host); if(a.diags.length)throw Error(JSON.stringify(a.diags));',
              'const b={order:a.moduleOrder.map(rel),diags:a.diags.map(d=>({...d,message:rel(d.message),loc:{...d.loc,file:rel(d.loc.file)}}))};',
              'const path=orderBaselinePath(root,fixture);mkdirSync(dirname(path),{recursive:true});writeFileSync(path,JSON.stringify(b,null,1)+"\\n");',
              'const all=allOrderEntries(root),index=all.indexOf(join(root,fixture));if(index<0)throw Error("fixture missing");',
              'console.log(JSON.stringify({first:rel(all[Math.floor(index/20)*20]).replace(/^<repo>\\//,""),count:Math.min(20,all.length-Math.floor(index/20)*20)}));',
              '} finally {host.close();}',
            ].join("\n");
            const generated=spawnSync(process.execPath,["--import","tsx","--input-type=module","-e",generator],{cwd:root,env:process.env,encoding:"utf8",timeout:240000,maxBuffer:8*1024*1024});
            if(generated.status!==0||generated.error||generated.signal)throw Error("baseline generation failed: "+scrub(generated.stderr));
            const batch=JSON.parse(generated.stdout);
            pass("baseline completeness",["test:ts7","--baselines-only"]);
            pass("order parity",["test","packages/compiler/test/ts7/order-parity.test.ts","-t",escape(batch.first)+" …","--reporter=json","--outputFile="+join(temp,"sparse-order.json")],{SCRIPTC_TS7_ALL:"1"});
            const order=JSON.parse(readFileSync(join(temp,"sparse-order.json"),"utf8"));
            if(!order.success||active(order).length!==1||active(order)[0].status!=="passed")throw Error("order batch missing");
            report.orderParity={first:batch.first,entries:batch.count,status:"passed",baselineSha256:hash(readFileSync(baseline))};
            copyFileSync(baseline,join(temp,"frozen-sparse-array-noops.ts.json"));
          
              pass("lint",["lint"]);pass("format",["format:check"]);
              const pattern="("+corpus.map(escape).join("|")+")$";
              const costs={};
              for(const flavor of ["plain","san"]) {
                const file=join(temp,"sparse-"+flavor+".json");
                const outcome=run("array corpus "+flavor,["test","tests/harness/differential.test.ts","tests/harness/llvm-differential.test.ts","-t",pattern,"--reporter=json","--outputFile="+file],{SCRIPTC_SAN:flavor==="san"?"1":"",SCRIPTC_LLVM_TEST_MODE:"dev"});
                const data=JSON.parse(readFileSync(file,"utf8")), cases=active(data);
                report.flavors.push({flavor,success:data.success,cases:cases.map(t=>({name:t.fullName,status:t.status,duration:t.duration,failures:t.failureMessages.map(scrub)}))});
                const names=cases.map(t=>corpus.find(n=>t.fullName.endsWith(" "+n))).sort();
                if(outcome.status!==0||outcome.error||outcome.signal||!data.success||cases.some(t=>t.status!=="passed")||JSON.stringify(names)!==JSON.stringify([...corpus,...corpus].sort()))throw Error("corpus coverage failed: "+flavor);
                const own=cases.filter(t=>t.fullName.endsWith(" frozen-sparse-array-noops.ts"));
                if(own.length!==2||own.some(t=>typeof t.duration!=="number"))throw Error("corpus timings missing");
                costs[flavor]=Math.ceil(own.reduce((sum,t)=>sum+t.duration,0));
              }
              writeFileSync(join(temp,"frozen-sparse-array-noops.ts.cost.json"),JSON.stringify(costs,null,2)+"\n");
              report.status="passed";
            }
          } catch(error) {report.error=scrub(error);report.status="failed";process.exitCode=1;}
          finally {
            try {verify();report.sourceVerifiedAfter=true;}catch(error){report.status="failed";report.sourceError=scrub(error);process.exitCode=1;}
            save();console.log(JSON.stringify(report));
            if(process.exitCode)console.error("[scriptc-sparse-proof] FAILED (exit 1)");
          }
          PROOF
          node "$RUNNER_TEMP/sparse-proof.mjs" prepare
      - uses: ./.github/actions/native-packages
        with:
          target: darwin-arm64
      - run: pnpm build
      - name: Verify the regression, storage ownership, and sibling behavior
        run: node "$RUNNER_TEMP/sparse-proof.mjs" test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-sparse-arrays-proof
          path: |
            ${{ runner.temp }}/sparse-summary.json
            ${{ runner.temp }}/sparse-formatted-sources.json
            ${{ runner.temp }}/sparse-negative.json
            ${{ runner.temp }}/sparse-positive.json
            ${{ runner.temp }}/frozen-sparse-array-noops.ts.json
            ${{ runner.temp }}/frozen-sparse-array-noops.ts.cost.json
          if-no-files-found: error
          retention-days: 1
