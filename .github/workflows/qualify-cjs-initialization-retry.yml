                    assert.equal(item.ir.status, "passed"); assert.equal(native.compile.diagnosticsStatus, "passed");
                    assert.match(native.binarySha256, /^[a-f0-9]{64}$/);
                    const step = summary.steps.find(step => step.name === id + "-" + flavor + "-run");
                    assert.ok(step); assert.equal(step.command, "<temp>/cjs-retry-work/" + id + "-" + flavor + "/program"); assert.deepEqual(step.args, []);
                    assert.notEqual(step.status, "tool-error");
                    assert.equal(step.stdoutSha256, execution.stdoutSha256); assert.equal(step.stderrSha256, execution.stderrSha256);
                    const actual = execution.parityOutcome, oracle = item.oracle?.parityOutcome;
                    const matched = Boolean(item.oracle?.expectedMatched && actual && oracle && execution.status === "completed" &&
                      actual.code === oracle.code && actual.signal === oracle.signal &&
                      actual.stdoutSha256 === oracle.stdoutSha256 && actual.stderrSha256 === oracle.stderrSha256);
                    assert.equal(native.parity, matched ? "matched" : "mismatch");
                  }
                }
                assert.equal(item.complete, completeCase(item));
              }
              const attempts = summary.cases.flatMap(item => Object.values(item.flavors)).filter(native => native.execution.attempted === true).length;
              assert.equal(summary.expectedExecutionAttempts, 4); assert.equal(summary.executionAttempts, attempts);
              const complete = summary.cases.every(completeCase) && attempts === 4 && summary.sourceVerifiedBefore === true &&
                summary.sourceVerifiedAfter === true && summary.fixturesVerifiedAfter === true && summary.nativeInputsVerifiedAfter === true;
              assert.equal(summary.diagnosticComplete, complete);
              assert.deepEqual(summary.gates.map(gate => gate.id), gateSpecs.map(gate => gate.id));
              for (const gate of summary.gates) {
                const spec = gateSpecs.find(spec => spec.id === gate.id);
                assert.deepEqual(gate.expectedTests, spec.tests ?? []); assert.deepEqual(gate.llvmModes, spec.llvmModes ?? null);
                if (gate.collection) verifyFile(gate.collection);
                if (gate.artifact) verifyFile(gate.artifact);
                if (gate.step) {
                  assert.equal(gate.step.name, "gate-" + spec.id); assert.equal(gate.step.command, "pnpm");
                  assert.deepEqual(gate.step.args, [...spec.args, ...(spec.files ? ["--reporter=default", "--reporter=json",
                    "--outputFile=<temp>/cjs-retry-proof/gates/" + spec.id + ".vitest.json"] : [])]);
                }
                if (gate.status === "passed") {
                  assert.equal(gate.step.status, "completed"); assert.equal(gate.attempted, true);
                  assert.deepEqual(gate.environment, { llvmTestMode: null, testOptimization: null, cpuDispatch: null, shard: null, sanitize: spec.sanitize ? "1" : "" });
                  if (spec.collect) {
                    assert.equal(gate.collectionStep.status, "completed");
                    assert.deepEqual(gate.collectionStep.args, ["exec", "vitest", "list", ...spec.files,
                      "--json=<temp>/cjs-retry-proof/gates/" + spec.id + ".collection.json"]);
                  }
                  if (spec.files) {
                    const data = JSON.parse(readFileSync(join(dir, gate.artifact.path), "utf8"));
                    const collection = spec.collect ? JSON.parse(readFileSync(join(dir, gate.collection.path), "utf8")) : undefined;
                    const observed = verifyGateData(spec, data, collection);
                    assert.deepEqual({ tests: gate.tests, executedCount: gate.executedCount, fileCounts: gate.fileCounts }, observed);
                  }
                }
              }
              const qualified = complete && summary.cases.every(item => ["plain", "san"].every(flavor =>
                item.flavors[flavor].status === "passed" && item.flavors[flavor].parity === "matched")) &&
                summary.gates.every(gate => gate.status === "passed");
              assert.equal(summary.qualificationComplete, qualified);
              assert.equal(summary.status, qualified ? "passed" : "failed");
            }
            const candidate = result.sources.candidate.summary;
            result.diagnosticComplete = candidate.diagnosticComplete;
            result.qualificationComplete = result.diagnosticComplete && candidate.qualificationComplete;
          } catch (error) { result.error = String(error); result.diagnosticComplete = false; result.qualificationComplete = false; }
          writeFileSync(join(process.env.RUNNER_TEMP, "cjs-initialization-retry-aggregate.json"), JSON.stringify(result, null, 2) + "\n");
          console.log(JSON.stringify({ diagnosticComplete: result.diagnosticComplete, qualificationComplete: result.qualificationComplete }));
          if (!result.qualificationComplete) { console.error("[cjs-retry-comparison] FAILED (exit 1)"); process.exitCode = 1; }
          COMPARE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cjs-initialization-retry-aggregate
          path: ${{ runner.temp }}/cjs-initialization-retry-aggregate.json
          if-no-files-found: error
          retention-days: 1
