name: Qualify CommonJS initialization retry

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/qualify-cjs-initialization-retry.yml]

permissions:
  contents: read

concurrency:
  group: qualify-cjs-initialization-retry
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            source: 71a9441c824262150f35acd2b8359f156ed3289c
          - label: candidate
            source: 8220094cfd2b1274fbe29db4f948e6287d536a96
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DIAGNOSTIC_SOURCE: ${{ matrix.source }}
      DIAGNOSTIC_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Verify source before setup
        run: |
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SOURCE"
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: ./.github/actions/llvm-linux
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zig
      - uses: ./.github/actions/native-packages
        with:
          target: linux-x64-gnu
      - name: Disable piped core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Compare CommonJS retry and qualify candidate
        run: |
          cat > "$RUNNER_TEMP/cjs-retry-diagnostic.mjs" <<'PROOF'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { readlinkSync, symlinkSync, closeSync, copyFileSync, existsSync, lstatSync, mkdirSync, openSync, readFileSync, readdirSync, realpathSync, writeFileSync } from "node:fs";
          import { join, relative } from "node:path";

          const root = process.cwd(), head = process.env.DIAGNOSTIC_SOURCE;
          delete process.env.FORCE_COLOR; delete process.env.NO_COLOR;
