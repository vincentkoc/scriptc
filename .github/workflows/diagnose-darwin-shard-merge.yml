name: Diagnose Darwin shard merge

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/diagnose-darwin-shard-merge.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-darwin-shard-merge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    if: github.repository == 'vincentkoc/scriptc'
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: 022f251fc38b4c169333f133398ee5150172f2bc
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
      - name: Write bounded replay payload
        id: payload
        run: |
          umask 077
          mkdir "$RUNNER_TEMP/darwin-shard-merge-proof"
          python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"darwin-shard-merge-proof"/"proof-owner.json"; p.write_text(json.dumps({"workflow":os.environ["GITHUB_SHA"],"run":os.environ["GITHUB_RUN_ID"],"attempt":os.environ["GITHUB_RUN_ATTEMPT"]})+"\n")'
          cat > "$RUNNER_TEMP/darwin-shard-merge-proof/macho.py" <<'MACHO'
          import hashlib
          import json
          import pathlib
          import struct
          import sys

          WARNING_SYMBOLS = ["_sc_streq_4418951778850151","_sc_streq_2832937049513","_sc_streq_2439431829155374","_sc_streq_2411579562213172","_sc_streq_2734174280155539","_sc_streq_923839245533765","_sc_streq_2227497482646049","_sc_streq_2298207874780604"]
          AUTHORED_SYMBOLS = ["_sc_f__x25_m411436747_QuadraticBezier"]
          SYMBOLS = WARNING_SYMBOLS + AUTHORED_SYMBOLS

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def macho(data, label):
              assert 32 <= len(data) <= 256 * 1024**2, "Mach-O file size outside diagnostic budget"
              magic, cpu, subtype, kind, ncmds, cmdbytes, flags, reserved = struct.unpack_from("<8I", data)
              assert magic == 0xfeedfacf and cpu == 0x100000c and kind == 1, "expected thin arm64 MH_OBJECT"
              assert 0 < ncmds <= 1024 and 32 + cmdbytes <= len(data), "invalid Mach-O load command range"
              sections, symtab = [], None
              pos = 32
              for _ in range(ncmds):
                  assert pos + 8 <= 32 + cmdbytes
                  command, size = struct.unpack_from("<II", data, pos)
                  assert size >= 8 and size % 8 == 0 and pos + size <= 32 + cmdbytes, "invalid load command"
                  if command == 0x19:
                      assert size >= 72
                      count = struct.unpack_from("<I", data, pos + 64)[0]
                      assert 72 + count * 80 <= size and len(sections) + count <= 255
                      for index in range(count):
                          start = pos + 72 + index * 80
                          name, segment, address, length, offset, align, reloff, nreloc, section_flags, r1, r2, r3 = struct.unpack_from("<16s16sQQ8I", data, start)
                          name = name.split(b"\0", 1)[0].decode("utf8")
                          segment = segment.split(b"\0", 1)[0].decode("utf8")
                          zero = section_flags & 0xff in (1, 0xc, 0x12)
                          assert zero or offset + length <= len(data), "section exceeds object"
                          assert reloff + nreloc * 8 <= len(data), "relocations exceed object"
                          sections.append({"index":len(sections)+1, "segment":segment, "name":name, "address":address,
                              "size":length, "align":align, "flags":section_flags, "zeroFill":zero,
                              "sha256":None if zero else sha(data[offset:offset+length]),
                              "relocations":nreloc, "relocationSha256":sha(data[reloff:reloff+nreloc*8])})
                  elif command == 2:
                      assert size == 24 and symtab is None, "ambiguous symbol table"
                      symtab = struct.unpack_from("<4I", data, pos + 8)
                  pos += size
              assert pos == 32 + cmdbytes and symtab is not None
              symoff, count, stroff, strsize = symtab
              assert count <= 2000000 and symoff + count * 16 <= len(data) and stroff + strsize <= len(data)
              strings = data[stroff:stroff+strsize]
              symbols, functions, oso, current_function = [], [], None, None
              for index in range(count):
                  string_index, typ, section, desc, value = struct.unpack_from("<IBBHQ", data, symoff + index * 16)
                  assert string_index < strsize, "symbol string offset out of bounds"
                  end = strings.find(b"\0", string_index)
                  assert end >= 0, "unterminated symbol name"
                  name = strings[string_index:end].decode("utf8")
                  if not typ & 0xe0 and typ & 0xe == 0xe:
                      assert 1 <= section <= len(sections), "invalid symbol section"
                      owner = sections[section - 1]
                      assert owner["address"] <= value <= owner["address"] + owner["size"], "symbol outside section"
                  row = {"index":index, "name":name, "type":typ, "section":section, "desc":desc, "value":value}
                  symbols.append(row)
                  if typ == 0x64:
                      oso = None
                      current_function = None
                  elif typ == 0x66:
                      oso = {"path":name, "mtimeSeconds":value, "symbolIndex":index}
                  elif typ == 0x24 and name:
                      current_function = {**row, "oso":None if oso is None else dict(oso), "size":None, "closeSymbolIndex":None}
                      functions.append(current_function)
                  elif typ == 0x24 and not name:
                      if current_function is not None:
                          current_function["size"] = value
                          current_function["closeSymbolIndex"] = index
                          current_function = None
              return {"label":label, "sha256":sha(data), "bytes":len(data), "header":{"cpu":cpu,"subtype":subtype,"kind":kind,"flags":flags},
                  "sections":sections, "symbols":symbols, "functions":functions}

          def normalized_symbols(parsed, paths):
              rows = []
              for symbol in parsed["symbols"]:
                  row = [symbol[key] for key in ("name", "type", "section", "desc", "value")]
                  if symbol["type"] == 0x66:
                      assert symbol["name"] in paths, "unknown N_OSO path"
                      row[0] = paths[symbol["name"]]
                  rows.append(row)
              return rows

          def symbol_summary(parsed, paths, raw_inputs, raw_parsed):
              rows = []
              for name in SYMBOLS:
                  owners = []
                  for item, raw in zip(raw_inputs, raw_parsed, strict=True):
                      found = [symbol for symbol in raw["symbols"] if symbol["name"] == name and not symbol["type"] & 0xe0 and symbol["type"] & 0xe == 0xe]
                      for symbol in found:
                          owners.append({"input":item["name"], "definition":symbol})
                  assert len(owners) == 1 and owners[0]["definition"]["type"] == 0x1f, "sentinel raw private-external owner mismatch"
                  definitions = [symbol for symbol in parsed["symbols"] if symbol["name"] == name and not symbol["type"] & 0xe0 and symbol["type"] & 0xe == 0xe]
                  functions = [symbol for symbol in parsed["functions"] if symbol["name"] == name]
                  mapped = []
                  for function in functions:
                      oso = function["oso"]
                      alias = paths.get(oso["path"]) if oso else None
                      input_row = next((item for item in raw_inputs if item["name"] == alias), None)
                      size = function["size"]
                      definition_matches = len(definitions) == 1 and definitions[0]["section"] == function["section"] and definitions[0]["value"] == function["value"]
                      raw_def = owners[0]["definition"]
                      raw = next(raw for item, raw in zip(raw_inputs, raw_parsed, strict=True) if item["name"] == owners[0]["input"])
                      raw_section = raw["sections"][raw_def["section"] - 1]
                      output_section = parsed["sections"][function["section"] - 1] if 1 <= function["section"] <= len(parsed["sections"]) else None
                      range_valid = isinstance(size, int) and size > 0 and output_section is not None and raw_def["value"] + size <= raw_section["address"] + raw_section["size"] and function["value"] + size <= output_section["address"] + output_section["size"]
                      mapped.append({**function, "definitionMatchesFunction":definition_matches, "rangesWithinSections":range_valid, "mappedInput":alias,
                          "mtimeMatchesMappedInput":input_row is not None and oso["mtimeSeconds"] == int(input_row["mtimeNs"]) // 1000000000,
                          "matchesRawDefinitionOwner":alias == owners[0]["input"]})
                  rows.append({"selection":"first-eight-retained-warnings" if name in WARNING_SYMBOLS else "additional-authored-function", "symbol":name, "rawOwner":owners[0], "outputDefinitions":definitions, "functions":mapped})
              return rows

          def compact(parsed, paths, raw_inputs, raw_parsed):
              contract = normalized_symbols(parsed, paths)
              return {"label":parsed["label"],"bytes":parsed["bytes"],"sha256":parsed["sha256"],"header":parsed["header"],
                  "sections":parsed["sections"],"symbolCount":len(parsed["symbols"]),
                  "normalizedSymbolContractSha256":sha(json.dumps(contract,separators=(",",":")).encode()),
                  "sentinels":symbol_summary(parsed, paths, raw_inputs, raw_parsed)}

          def analyze(mode, admission_path, output, report_path):
              assert mode in ("admit", "control", "differential"), "invalid analysis mode"
              admission = json.loads(pathlib.Path(admission_path).read_text())
              raw_inputs = admission["inputs"]
              assert len(raw_inputs) == 17 and [r["name"] for r in raw_inputs] == [f"procedural-geometry.program-{i:03}.o" for i in range(17)]
              paths = {key:item["name"] for item in raw_inputs for key in (item["originalPath"],item["stagedPath"])}
              raw_parsed = [macho(pathlib.Path(item["stagedPath"]).read_bytes(),item["name"]) for item in raw_inputs]
              original = macho(pathlib.Path(admission["originalMerged"]["stagedPath"]).read_bytes(),"retained-original")
              parsed = macho(pathlib.Path(output).read_bytes(),mode)
              original_summary = compact(original, paths, raw_inputs, raw_parsed)
              observed = compact(parsed, paths, raw_inputs, raw_parsed)
              if mode == "admit":
                  assert observed["sha256"] == original_summary["sha256"]
                  assert original_summary["normalizedSymbolContractSha256"] == "1cac8fd2c76333e18152faf3587d10cbc2d20e7258af7b5f1b56500a361003d1"
                  assert all(len(row["outputDefinitions"]) == 1 and row["outputDefinitions"][0]["type"] == 0x1e and len(row["functions"]) == 1 and row["functions"][0]["mtimeMatchesMappedInput"] and row["functions"][0]["definitionMatchesFunction"] and row["functions"][0]["rangesWithinSections"] and not row["functions"][0]["matchesRawDefinitionOwner"] for row in original_summary["sentinels"])
                  report = {"mode":mode,"inputsAdmitted":True,"retainedControl":original_summary,"linkReplayExecuted":False}
              elif mode == "control":
                  reproduced = observed["header"] == original_summary["header"] and observed["sections"] == original_summary["sections"] and observed["normalizedSymbolContractSha256"] == original_summary["normalizedSymbolContractSha256"]
                  reproduced = reproduced and all(len(row["outputDefinitions"]) == 1 and row["outputDefinitions"][0]["type"] == 0x1e and len(row["functions"]) == 1 and row["functions"][0]["mtimeMatchesMappedInput"] and row["functions"][0]["definitionMatchesFunction"] and row["functions"][0]["rangesWithinSections"] and not row["functions"][0]["matchesRawDefinitionOwner"] for row in observed["sentinels"])
                  report = {"mode":mode,"controlReproduced":reproduced,"original":original_summary,"observed":observed,
                      "pathNormalization":"Only authenticated original/staged raw-object N_OSO paths map to their exact ordered input names."}
              else:
                  control = json.loads(pathlib.Path(admission["controlReport"]).read_text())
                  assert control["controlReproduced"] is True
                  control_summary = control["observed"]
                  effective = all(len(row["outputDefinitions"]) == 1 and row["outputDefinitions"][0]["type"] == 0x1f for row in observed["sentinels"])
                  covered = all(len(row["functions"]) == 1 and row["functions"][0]["mappedInput"] is not None and row["functions"][0]["mtimeMatchesMappedInput"] and row["functions"][0]["definitionMatchesFunction"] and row["functions"][0]["rangesWithinSections"] and row["functions"][0]["size"] == control_summary["sentinels"][index]["functions"][0]["size"] for index, row in enumerate(observed["sentinels"]))
                  corrected = covered and all(row["functions"][0]["matchesRawDefinitionOwner"] for row in observed["sentinels"])
                  wrong = covered and all(not row["functions"][0]["matchesRawDefinitionOwner"] for row in observed["sentinels"])
                  text_keys = ("index","segment","name","address","size","align","flags","zeroFill","sha256")
                  text_equal = [{key:section[key] for key in text_keys} for section in observed["sections"] if section["segment"] == "__TEXT"] == [{key:section[key] for key in text_keys} for section in control_summary["sections"] if section["segment"] == "__TEXT"]
                  conclusion = "inconclusive"
                  if effective and covered and text_equal:
                      if corrected: conclusion = "demotion-contributes-for-nine-selected-sentinels"
                      elif wrong: conclusion = "demotion-ablation-insufficient-for-nine-selected-sentinels"
                  report = {"mode":mode,"observed":observed,"flagEffective":effective,"functionCoverageComplete":covered,
                      "textBytesAndLayoutIdentical":text_equal,"sectionContractsIdentical":observed["sections"] == control_summary["sections"],
                      "conclusion":conclusion,"runtimeAcceptance":False,
                      "warningSelection":WARNING_SYMBOLS,"additionalAuthoredSelection":AUTHORED_SYMBOLS,
                      "authoredDwarfContext":"A separate offline inspection found an authored DIE in raw001. This replay examines Mach-O ownership only; it does not rerun DWARF or dsymutil.",
                      "limit":"Preserving private externals does not meet library internalization and is not a production fix or final dsymutil/runtime verdict."}
              pathlib.Path(report_path).write_text(json.dumps(report,indent=2)+"\n")

          if __name__ == "__main__":
              analyze(*sys.argv[1:])
