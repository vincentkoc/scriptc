          } catch (error) { result.error = String(error); result.diagnosticComplete = false; result.qualificationComplete = false; }
          writeFileSync(join(process.env.RUNNER_TEMP, "dynamic-callback-result-cleanup-aggregate.json"), JSON.stringify(result, null, 2) + "\n");
          console.log(JSON.stringify({ diagnosticComplete: result.diagnosticComplete, qualificationComplete: result.qualificationComplete }));
          if (!result.qualificationComplete) { console.error("[callback-cleanup-comparison] FAILED (exit 1)"); process.exitCode = 1; }
          COMPARE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-callback-result-cleanup-aggregate
          path: |
            ${{ runner.temp }}/dynamic-callback-result-cleanup-aggregate.json
            ${{ runner.temp }}/dynamic-callback-result-cleanup-results/baseline-reuse.json
          if-no-files-found: error
          retention-days: 3
