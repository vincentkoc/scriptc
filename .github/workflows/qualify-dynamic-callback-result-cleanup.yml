                  gate.attempted = gate.step.status !== "tool-error";
                  if (spec.files) {
                    gate.artifact = recordFile(jsonPath); assert.ok(gate.artifact.bytes <= 16 * 1024 ** 2);
                    const data = JSON.parse(readFileSync(jsonPath, "utf8"));
                    const collection = spec.collect ? JSON.parse(readFileSync(collectionPath, "utf8")) : undefined;
                    Object.assign(gate, verifyGateData(spec, data, collection));
                  }
                  requireSuccess(gate.step); gate.status = "passed";
                } catch (error) { gate.status = "failed"; gate.error = scrub(error.stack ?? error); }
                finally { save(); }
              }
              assert.equal(readlinkSync(harnessLink), harnessOutput);
            }
            requireSuccess(execute("verify-runtime-after", process.execPath, ["packages/runtime-linux-x64-gnu/scripts/verify.mjs"]));
            assert.equal(hash("packages/runtime-linux-x64-gnu/runtime-pack.json"), report.runtimeManifestSha256);
            assert.equal(hash("packages/llvm-linux-x64-gnu/bin/scriptc-llvm-codegen"), report.helperBinarySha256);
            assert.deepEqual(readLibnodePack(packRoot, { verifyHashes: true }).manifest, report.libnode.manifest);
            report.nativeInputsVerifiedAfter = true;
            report.executionAttempts = report.cases.flatMap(item => Object.values(item.flavors)).filter(item => item.execution.attempted === true).length;
            report.diagnosticComplete = report.cases.length === specs.length && report.cases.every(item => item.complete);
            report.diagnosticComplete &&= report.executionAttempts === report.expectedExecutionAttempts && report.nativeInputsVerifiedAfter === true;
            report.qualificationComplete = report.diagnosticComplete && report.cases.every(item =>
              ["plain", "san"].every(flavor => item.flavors[flavor].status === "passed" && item.flavors[flavor].parity === "matched")) &&
              report.gates.length === gateSpecs.length && report.gates.every(gate => gate.status === "passed");
            report.status = report.qualificationComplete ? "passed" : "failed";
          } catch (error) { report.status = "failed"; report.error = scrub(error.stack ?? error); }
          finally {
            try { assert.deepEqual(source(), report.sourceInputs); report.sourceVerifiedAfter = true; verifyFixtures(); report.fixturesVerifiedAfter = true; }
            catch (error) { report.status = "failed"; report.diagnosticComplete = false; report.qualificationComplete = false; report.sourceError = scrub(error.stack ?? error); }
            report.finishedAt = new Date().toISOString(); save();
            writeFileSync(join(out, "summary.sha256"), hash(join(out, "summary.json")) + "\n");
            console.log(JSON.stringify({ label: report.label, status: report.status, diagnosticComplete: report.diagnosticComplete, qualificationComplete: report.qualificationComplete }));
            if (!report.qualificationComplete) { console.error("[callback-cleanup-diagnostic] FAILED (exit 1)"); process.exitCode = 1; }
          }
          PROOF
          ulimit -c 0
          node "$RUNNER_TEMP/callback-cleanup-diagnostic.mjs"
      - name: Remove this diagnostic's build scratch
        if: always()
        run: |
          node --input-type=module <<'CLEANUP'
          import assert from "node:assert/strict";
          import { existsSync, lstatSync, mkdirSync, readFileSync, readlinkSync, rmSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const temp = process.env.RUNNER_TEMP, work = join(temp, "callback-cleanup-work"), out = join(temp, "callback-cleanup-proof");
          const owner = { runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, label: process.env.DIAGNOSTIC_LABEL, workflow: process.env.GITHUB_SHA };
          const receipt = { ...owner, work: "absent", payload: "absent", harnessLink: "absent" };
          try {
            if (existsSync(work)) {
              assert.deepEqual(JSON.parse(readFileSync(join(work, ".diagnostic-owner.json"), "utf8")), owner);
              const harnessLink = join(process.cwd(), "node_modules/.cache/scriptc-tests");
              const info = lstatSync(harnessLink, { throwIfNoEntry: false });
              if (info !== undefined) {
                assert.equal(owner.label, "candidate"); assert.ok(info.isSymbolicLink());
                assert.equal(readlinkSync(harnessLink), join(work, "harness-output"));
                rmSync(harnessLink); receipt.harnessLink = "removed";
              }
              rmSync(work, { recursive: true }); receipt.work = "removed";
            }
            const payload = join(temp, "callback-cleanup-diagnostic.mjs");
            if (existsSync(payload)) { rmSync(payload); receipt.payload = "removed"; }
          } catch (error) { receipt.error = String(error); process.exitCode = 1; }
          finally {
            mkdirSync(out, { recursive: true });
            writeFileSync(join(out, "cleanup.json"), JSON.stringify(receipt, null, 2) + "\n");
            if (process.exitCode) console.error("[callback-cleanup-cleanup] FAILED (exit 1)");
          }
          CLEANUP
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-callback-result-cleanup-candidate
          path: ${{ runner.temp }}/callback-cleanup-proof
          if-no-files-found: error
          retention-days: 3

  aggregate:
    needs: diagnose
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v4
        with:
          pattern: dynamic-callback-result-cleanup-candidate
          path: ${{ runner.temp }}/dynamic-callback-result-cleanup-results
      - name: Verify and reuse the settled baseline artifact
        env:
          ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'BASELINE'
          import hashlib, json, os, shutil, stat, sys, tempfile, urllib.error, urllib.parse, urllib.request, zipfile
          from pathlib import Path, PurePosixPath

          root = Path(os.environ["RUNNER_TEMP"]) / "dynamic-callback-result-cleanup-results"
          root.mkdir(exist_ok=True)
          origin = {"runId": "41212024154", "attempt": "1", "workflow": "5b3681054778fc53ded8f1a9838bcfcc86761037",
                    "source": "71a9441c824262150f35acd2b8359f156ed3289c", "artifactId": 13046189891,
                    "archiveSha256": "b9a971cb5062ad92eb5678e3aa098f41964a7c94cb30960cdf3d51e4117a38f6",
                    "summarySha256": "f21453ef7cd6dee244dc28d59edfceed6af33611c9998952532963c04407f6a5"}
          execution = {"workflow": os.environ["GITHUB_SHA"], "runId": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          receipt = {"origin": origin, "execution": execution, "reused": True, "baselineRepeated": False, "status": "running"}
          stage = "initialization"
          scratch = Path(tempfile.mkdtemp(prefix="callback-baseline-", dir=os.environ["RUNNER_TEMP"]))

          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as source:
                  while block := source.read(1024 * 1024):
                      value.update(block)
              return value.hexdigest()

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None

          try:
              stage = "metadata"
              token = os.environ["ARTIFACT_READ_TOKEN"]
              endpoint = f"https://api.github.com/repos/vincentkoc/scriptc/actions/artifacts/{origin['artifactId']}"
              headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                         "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "scriptc-callback-cleanup-proof"}
              opener = urllib.request.build_opener(NoRedirect)
              with opener.open(urllib.request.Request(endpoint, headers=headers), timeout=120) as response:
                  raw = response.read(1024**2 + 1)
              assert len(raw) <= 1024**2, "metadata budget"
              metadata = json.loads(raw)
              assert metadata["id"] == origin["artifactId"] and metadata["name"] == "worker-lifetimes-baseline"
              assert metadata["expired"] is False and metadata["size_in_bytes"] <= 512 * 1024**2
              assert str(metadata["workflow_run"]["id"]) == origin["runId"]
              assert metadata["workflow_run"]["head_sha"] == origin["workflow"]
              stage = "download"
              try:
                  response = opener.open(urllib.request.Request(endpoint + "/zip", headers=headers), timeout=120)
              except urllib.error.HTTPError as error:
                  assert error.code == 302, "artifact redirect refused"
                  location = error.headers.get("Location", "")
                  error.close()
                  parsed = urllib.parse.urlsplit(location)
                  assert parsed.scheme == "https" and parsed.hostname and not parsed.username and not parsed.password
                  # The storage request never receives the GitHub token; URLs are not logged.
                  response = opener.open(urllib.request.Request(location), timeout=120)
              archive = scratch / "baseline.zip"
              size = 0
              with response, archive.open("xb") as output:
                  while block := response.read(1024 * 1024):
                      size += len(block)
                      assert size <= 512 * 1024**2, "archive budget"
                      output.write(block)
              stage = "archive digest"
              actual = digest(archive)
              assert actual == origin["archiveSha256"], "archive hash mismatch"
              target = root / "dynamic-callback-result-cleanup-baseline"
              assert not target.exists(), "baseline destination already exists"
              stage = "safe extraction"
              with zipfile.ZipFile(archive) as bundle:
                  entries = bundle.infolist()
                  assert 0 < len(entries) <= 20000 and sum(item.file_size for item in entries) <= 2 * 1024**3
                  seen = set()
                  for item in entries:
                      name = item.filename
                      path = PurePosixPath(name)
                      assert name and "\\" not in name and "\0" not in name
                      assert not path.is_absolute() and ".." not in path.parts
                      assert path.as_posix() == name.rstrip("/") and path.parts
                      assert name.rstrip("/") not in seen, "duplicate archive entry"
                      seen.add(name.rstrip("/"))
                      assert stat.S_IFMT(item.external_attr >> 16) in (0, stat.S_IFREG, stat.S_IFDIR)
                      assert not item.flag_bits & 1
                  target.mkdir()
                  for item in entries:
                      path = target / item.filename
                      if item.is_dir():
                          path.mkdir(parents=True, exist_ok=True)
                          continue
                      assert stat.S_IFMT(item.external_attr >> 16) != stat.S_IFDIR
                      path.parent.mkdir(parents=True, exist_ok=True)
                      with bundle.open(item) as source, path.open("xb") as output:
                          remaining = item.file_size
                          while block := source.read(min(1024 * 1024, remaining + 1)):
                              remaining -= len(block)
                              assert remaining >= 0
                              output.write(block)
                          assert remaining == 0
                      path.chmod(0o444)
              stage = "summary identity"
              assert digest(target / "summary.json") == origin["summarySha256"]
              summary = json.loads((target / "summary.json").read_text())
              assert summary["workflow"] == origin["workflow"] and summary["runId"] == origin["runId"]
              assert summary["attempt"] == origin["attempt"] and summary["head"] == origin["source"] and summary["label"] == "baseline"
              receipt.update({"status": "verified", "archiveSha256": actual, "archiveBytes": size,
                              "summarySha256": digest(target / "summary.json"),
                              "files": [{"path": path.relative_to(target).as_posix(), "bytes": path.stat().st_size, "sha256": digest(path)}
                                        for path in sorted(target.rglob("*")) if path.is_file()]})
          except Exception as error:
              receipt.update({"status": "failed", "error": {"stage": stage, "type": type(error).__name__}})
          finally:
              try:
                  shutil.rmtree(scratch)
              except Exception as error:
                  receipt.update({"status": "failed", "error": {"stage": "scratch cleanup", "type": type(error).__name__}})
              receipt["scratchRemoved"] = not scratch.exists()
              (root / "baseline-reuse.json").write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          if receipt["status"] != "verified":
              print("[baseline-artifact] FAILED (exit 1): " + receipt["error"]["stage"] + " (" + receipt["error"]["type"] + ")", file=sys.stderr)
              sys.exit(1)
          BASELINE
      - name: Verify retained baseline and fresh candidate
        if: always()
        run: |
          node --input-type=module <<'COMPARE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
