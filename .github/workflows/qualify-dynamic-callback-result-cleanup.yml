name: Qualify dynamic callback result cleanup

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/qualify-dynamic-callback-result-cleanup.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: qualify-dynamic-callback-result-cleanup
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DIAGNOSTIC_SOURCE: d8e1f5c60d3181f5b02f2823fb8ee0a41d34f9c4
      DIAGNOSTIC_LABEL: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: ${{ env.DIAGNOSTIC_SOURCE }}
          persist-credentials: false
      - name: Verify source before setup
        run: |
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SOURCE"
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: ./.github/actions/llvm-linux
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zig
      - uses: ./.github/actions/native-packages
        with:
          target: linux-x64-gnu
      - name: Disable piped core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Qualify callback result cleanup with worker control
        run: |
          cat > "$RUNNER_TEMP/callback-cleanup-diagnostic.mjs" <<'PROOF'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { readlinkSync, symlinkSync, closeSync, copyFileSync, existsSync, lstatSync, mkdirSync, openSync, readFileSync, readdirSync, realpathSync, writeFileSync } from "node:fs";
          import { join, relative } from "node:path";
          import { pathToFileURL } from "node:url";

          const root = process.cwd(), head = process.env.DIAGNOSTIC_SOURCE;
          delete process.env.FORCE_COLOR; delete process.env.NO_COLOR;
          for (const key of ["SCRIPTC_LLVM_TEST_MODE", "SCRIPTC_TEST_OPTIMIZATION", "SCRIPTC_CPU_DISPATCH", "SCRIPTC_TEST_SHARD"]) delete process.env[key];
          const out = join(process.env.RUNNER_TEMP, "callback-cleanup-proof");
          const work = join(process.env.RUNNER_TEMP, "callback-cleanup-work");
          mkdirSync(out); mkdirSync(work);
          const owner = { runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, label: process.env.DIAGNOSTIC_LABEL, workflow: process.env.GITHUB_SHA };
          writeFileSync(join(work, ".diagnostic-owner.json"), JSON.stringify(owner), { flag: "wx" });
          const report = {
            label: process.env.DIAGNOSTIC_LABEL, head, workflow: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            status: "running", diagnosticComplete: false, qualificationComplete: false,
            templateCommit: "5b3681054778fc53ded8f1a9838bcfcc86761037",
            completeSuite: false, scope: "dynamic-callback-result-cleanup",
            expectedExecutionAttempts: 2, executionAttempts: 0, startedAt: new Date().toISOString(), steps: [], cases: [], gates: [],
          };
          const digest = bytes => createHash("sha256").update(bytes).digest("hex");
          const hash = path => digest(readFileSync(path));
          const scrub = value => String(value).split(root).join("<repo>").split(process.env.RUNNER_TEMP).join("<temp>");
          const save = () => writeFileSync(join(out, "summary.json"), scrub(JSON.stringify(report, null, 2)) + "\n");
          let sequence = 0;
          const execute = (name, command, args, seconds = 60, env = {}) => {
            const stem = String(++sequence).padStart(2, "0") + "-" + name;
            const stdout = join(out, stem + ".stdout.log"), stderr = join(out, stem + ".stderr.log");
            const fds = [openSync(stdout, "wx"), openSync(stderr, "wx")], started = Date.now();
