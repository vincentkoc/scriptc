                  copyFileSync(join(beside.root, "manifest.json"), manifestCopy); result.libnodeManifest = recordFile(manifestCopy);
                  result.execution = execute(spec.id + "-" + flavor + "-run", binary, [], 30, { ...env, SCRIPTC_LIBNODE: "" });
                  result.execution.attempted = result.execution.status !== "tool-error";
