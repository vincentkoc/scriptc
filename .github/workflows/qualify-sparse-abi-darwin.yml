e.c":"7235656a30faddd33d66ddb3013c49be9cde9eaeb7b1e4629f743a9bcc38292c","packages/runtime/src/scr_core.h":"799e8efad0cd6d344b037c12b3cf9d264bdfd5e85dffc2223034dda03fc18bda","packages/runtime/src/scr_publish.c":"bce24719b8a8c7aeefd0224e0309ef9970d0965fa81f65222264952fcbd8dd06","packages/runtime/test/test_array.c":"4c7123698c7682f36752496406bbefd13de47377963523b9deec22f4916ee026","packages/compiler/src/backend/llvm/expr-containers.test.ts":"63b643a8991dee4a62a939f72f79b682cca9b23118dd5a8398e101a13909fa8c","packages/compiler/test/ts7/baselines/order-parity/tests/corpus/frozen-sparse-array-noops.ts.json":"5b9196eb3d972b7157a06a2a6152cef58af9deb0b0b36f3c510c70f5b66b7ace","tests/corpus/frozen-sparse-array-noops.ts":"9a24b0ff86ac734c449527beb5303f6a47f3cd65682668aabe3bc86a17947095","tests/harness/corpus-costs/frozen-sparse-array-noops.ts.json":"be2f69f9c459443419c43e9b8d196bb865d4bbc1d7adf84abb5280ddf2661379"},tracked=["CHANGELOG.md", "docs/content/docs/how-it-works.mdx", "examples/native-object/README.md", "packages/cli/test/native-link-info.test.ts", "packages/compiler/src/backend/llvm/emitter.ts", "packages/compiler/src/backend/llvm/expr-containers.ts", "packages/compiler/src/backend/runtime-abi.ts", "packages/compiler/src/backend/runtime-pack-native.test.ts", "packages/compiler/src/backend/runtime-pack-native.ts", "packages/compiler/src/backend/runtime-pack-targets.test.ts", "packages/compiler/src/backend/runtime-pack.test.ts", "packages/compiler/src/frontend/lowering/lower-array-sort.ts", "packages/compiler/test/native-codegen-integration.test.ts", "packages/runtime-darwin-arm64/scripts/build.mjs", "packages/runtime-pack-common/scripts/build.mjs", "packages/runtime/src/scr_array.c", "packages/runtime/src/scr_array.h", "packages/runtime/src/scr_console.c", "packages/runtime/src/scr_core.h", "packages/runtime/src/scr_publish.c", "packages/runtime/test/test_array.c"],extra=["packages/compiler/src/backend/llvm/expr-containers.test.ts", "packages/compiler/test/ts7/baselines/order-parity/tests/corpus/frozen-sparse-array-noops.ts.json", "tests/corpus/frozen-sparse-array-noops.ts", "tests/harness/corpus-costs/frozen-sparse-array-noops.ts.json"],behavior={"runId":41098871113,"status":"passed","manifest":{"CHANGELOG.md":"8ab8c6e320652eea70c905450646a3c967e68777d0b5dfab077ca6b47eb5ded5","packages/compiler/src/backend/llvm/emitter.ts":"1d2fda8a1088605bff5fd144fa1f39baac1dbea10759f523330856baae2d2820","packages/compiler/src/backend/llvm/expr-containers.ts":"63dea67a355dc0ed89827c2a9c82e19a8db91f73056093711f135df2d98811f9","packages/compiler/src/frontend/lowering/lower-array-sort.ts":"58ec816e2b4a380308ba8db3e0db44edb551c4ad09414ce20f991794a67cb9ce","packages/runtime/src/scr_array.c":"7648691ca463e216ab20c9b86b4353e011ae342c0b6101c573f9371d0d71360d","packages/runtime/src/scr_array.h":"3d693edcd2e9d4cfd5d2363e1f529f7750d5db1ab24113f023c292198e59941f","packages/runtime/src/scr_publish.c":"bce24719b8a8c7aeefd0224e0309ef9970d0965fa81f65222264952fcbd8dd06","packages/runtime/test/test_array.c":"4c7123698c7682f36752496406bbefd13de47377963523b9deec22f4916ee026","packages/compiler/src/backend/llvm/expr-containers.test.ts":"63b643a8991dee4a62a939f72f79b682cca9b23118dd5a8398e101a13909fa8c","tests/corpus/frozen-sparse-array-noops.ts":"9a24b0ff86ac734c449527beb5303f6a47f3cd65682668aabe3bc86a17947095"}};
          let manifest=original;
          const report={head,workflow:process.env.GITHUB_SHA,patchSha256:"08e2bed5c404b3c335673a2a0e212263a4fcd7ab990b335d2dd5f5d098c6c696",behaviorRun:behavior.runId,node:process.version,platform:process.platform,arch:process.arch,status:"running",steps:[]};
          const summary=join(temp,"sparse-abi-summary.json"),prepared=join(temp,"sparse-abi-formatted-sources.json");
          const hash=data=>createHash("sha256").update(data).digest("hex");
          const scrub=s=>String(s).split(root).join("<repo>").split(temp).join("<temp>");
          const save=()=>writeFileSync(summary,JSON.stringify(report,null,2)+"\n");
          const git=args=>execFileSync("git",args,{encoding:"utf8"}).trim();
          const verify=()=>{
           if(git(["rev-parse","HEAD"])!==head)throw Error("source head changed");
           for(const [file,expected] of Object.entries(manifest))if(hash(readFileSync(file))!==expected)throw Error("source changed: "+file);
           if(JSON.stringify(git(["diff","--name-only","HEAD"]).split("\n").filter(Boolean).sort())!==JSON.stringify([...tracked].sort()))throw Error("tracked source inventory changed");
           if(JSON.stringify(git(["ls-files","--others","--exclude-standard"]).split("\n").filter(Boolean).sort())!==JSON.stringify([...extra].sort()))throw Error("untracked source inventory changed");
          };
          const verifyBehavior=()=>{
           if(behavior.status!=="passed"||behavior.runId!==41098871113)throw Error("behavior proof is not qualified");
           const files=["packages/compiler/src/backend/llvm/emitter.ts","packages/compiler/src/backend/llvm/expr-containers.ts","packages/compiler/src/frontend/lowering/lower-array-sort.ts","packages/compiler/src/backend/llvm/expr-containers.test.ts","packages/runtime/src/scr_array.c","packages/runtime/src/scr_array.h","packages/runtime/src/scr_publish.c","packages/runtime/test/test_array.c","tests/corpus/frozen-sparse-array-noops.ts"];
           for(const file of files)if(hash(readFileSync(file))!==behavior.manifest[file])throw Error("behavior source differs from passed proof: "+file);
          };
          const run=(label,args,env={})=>{
           console.log("START "+label);
           const r=spawnSync("pnpm",args,{cwd:root,env:{...process.env,SCRIPTC_TEST_WORKERS:"2",SCRIPTC_NO_CACHE:"1",SCRIPTC_SAN:"",ASAN_OPTIONS:"detect_leaks=0",...env},encoding:"utf8",timeout:600000,maxBuffer:16*1024*1024});
           report.steps.push({label,code:r.status,signal:r.signal,error:r.error?.message,stdout:scrub(r.stdout??"").slice(-2500),stderr:scrub(r.stderr??"").slice(-2500)});
           save();console.log("DONE "+label+" exit="+r.status);return r;
          };
          const pass=(label,args,env)=>{const r=run(label,args,env);if(r.status!==0||r.error||r.signal)throw Error(label+" failed");};
          const assertions=data=>data.testResults.flatMap(s=>s.assertionResults);
          const readResult=file=>JSON.parse(readFileSync(join(temp,file),"utf8"));
          save();
          try{
           if(process.version!=="v"+readFileSync(".node-version","utf8").trim()||process.platform!=="darwin"||process.arch!=="arm64"||process.getuid?.()===0)throw Error("wrong pinned non-root Darwin oracle");
           if(process.argv[2]==="prepare"){
            verify();
            const formatted=Object.keys(original).filter(p=>/^packages\/(compiler|cli)\//.test(p)&&p.endsWith(".ts"));
            pass("format changed TypeScript",["exec","oxfmt","--write",...formatted]);
            manifest=Object.fromEntries(Object.keys(original).map(p=>[p,hash(readFileSync(p))]));
            verifyBehavior();
            writeFileSync(prepared,JSON.stringify({head,original,manifest,source:Object.fromEntries(formatted.map(p=>[p,readFileSync(p).toString("base64")]))},null,2)+"\n");
            report.status="prepared";
           }else{
            const preparation=JSON.parse(readFileSync(prepared,"utf8"));
            if(preparation.head!==head||JSON.stringify(preparation.original)!==JSON.stringify(original))throw Error("wrong prepared inputs");
            manifest=preparation.manifest;verify();verifyBehavior();report.formattedManifest=manifest;
            const runtime=JSON.parse(readFileSync("packages/runtime-darwin-arm64/runtime-pack.json","utf8"));
            if(runtime.runtime_abi?.version!==49||runtime.runtime_abi?.marker!=="scr_runtime_abi_v49")throw Error("fresh ABI49 runtime pack missing");
            const owner="packages/compiler/src/backend/runtime-pack-native.ts",unit="packages/compiler/src/backend/runtime-pack-native.test.ts",patched=readFileSync(owner);
            const regression="an older ABI's stored selection cannot bypass manifest validation";
            try{
             writeFileSync(owner,execFileSync("git",["show",head+":"+owner]));
             const r=run("old selection cache rejects regression",["test",unit,"-t",regression,"--reporter=json","--outputFile="+join(temp,"sparse-abi-negative.json")]);
             const data=readResult("sparse-abi-negative.json"),tests=assertions(data).filter(t=>!["pending","skipped","todo"].includes(t.status));
             const negativeDiagnostic=tests[0]?.failureMessages.join("\n").replace(/\x1b\[[0-9;]*m/g,"").split("\n").map(line=>line.trim()).find(line=>/^(?:AssertionError: )?expected \[Function(?: [^\]]+)?\] to throw an error$/.test(line));
             if(r.status!==1||r.error||r.signal||data.success||tests.length!==1||tests[0].status!=="failed"||!tests[0].fullName.endsWith(regression)||!negativeDiagnostic)throw Error("old cache did not reproduce the manifest-validation bypass");
             report.negativeControl={status:"expected failure",tests:1,assertion:"old cached selection bypasses ABI48 manifest rejection",diagnostic:negativeDiagnostic};
            }finally{writeFileSync(owner,patched);}
            verify();
            const files=[unit,"packages/compiler/src/backend/runtime-pack.test.ts","packages/compiler/src/backend/runtime-pack-targets.test.ts","packages/compiler/test/llvm-runtime-abi.test.ts","packages/cli/test/native-link-info.test.ts"];
            pass("ABI contracts and bidirectional native link rejection",["test",...files,"--reporter=json","--outputFile="+join(temp,"sparse-abi-positive.json")]);
            const positive=readResult("sparse-abi-positive.json");
            if(!positive.success)throw Error("ABI test result is not successful");
            report.units=files.map(file=>{
             const groups=positive.testResults.filter(s=>s.name.endsWith("/"+file)),tests=groups.flatMap(s=>s.assertionResults);
             if(groups.length!==1||tests.length===0||tests.some(t=>t.status!=="passed"))throw Error("ABI test coverage missing or skipped: "+file);
             return {file,tests:tests.length};
            });
            const names=["helper and clang objects have matching metadata and identical runtime behavior","object emission preserves outbound FFI declarations as native C ABI references"];
            const escape=s=>s.replace(/[.*+?^{}()|[\]\\$]/g,"\\$&");
            pass("native codegen with ABI49 marker",["test","packages/compiler/test/native-codegen-integration.test.ts","-t","("+names.map(escape).join("|")+")$","--reporter=json","--outputFile="+join(temp,"sparse-abi-codegen.json")]);
            const codegen=readResult("sparse-abi-codegen.json"),selected=assertions(codegen).filter(t=>!["pending","skipped","todo"].includes(t.status));
            if(!codegen.success||selected.length!==2||selected.some(t=>t.status!=="passed")||names.some(name=>selected.filter(t=>t.fullName.endsWith(name)).length!==1))throw Error("native codegen coverage differs");
            report.codegen={status:"passed",tests:2};
            report.smoke=[];
            for(const flavor of ["plain","san"]){
             const file="sparse-abi-smoke-"+flavor+".json";
             pass("sparse corpus ABI49 "+flavor,["test","tests/harness/differential.test.ts","-t","frozen-sparse-array-noops\\.ts$","--reporter=json","--outputFile="+join(temp,file)],{SCRIPTC_SAN:flavor==="san"?"1":""});
             const data=readResult(file),tests=assertions(data).filter(t=>!["pending","skipped","todo"].includes(t.status));
             if(!data.success||tests.length!==1||tests[0].status!=="passed"||!tests[0].fullName.endsWith(" frozen-sparse-array-noops.ts"))throw Error("ABI49 smoke coverage differs");
             report.smoke.push({flavor,status:"passed",tests:1});
            }
            pass("lint",["lint"]);pass("format",["format:check"]);
            report.status="passed";
           }
          }catch(error){report.status="failed";report.error=scrub(error);process.exitCode=1;}
          finally{
           try{verify();report.sourceVerifiedAfter=true;}catch(error){report.status="failed";report.sourceError=scrub(error);process.exitCode=1;}
           save();console.log(JSON.stringify(report));
           if(process.exitCode)console.error("[scriptc-sparse-abi] FAILED (exit 1)");
          }
          PROOF
          node "$RUNNER_TEMP/sparse-abi-proof.mjs" prepare
      - uses: ./.github/actions/native-packages
        with:
          target: darwin-arm64
      - run: pnpm build
      - name: Verify ABI cache rejection and native link contracts
        run: node "$RUNNER_TEMP/sparse-abi-proof.mjs" test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-sparse-abi-proof
          path: |
            ${{ runner.temp }}/sparse-abi-summary.json
            ${{ runner.temp }}/sparse-abi-formatted-sources.json
            ${{ runner.temp }}/sparse-abi-negative.json
            ${{ runner.temp }}/sparse-abi-positive.json
            ${{ runner.temp }}/sparse-abi-codegen.json
          if-no-files-found: error
          retention-days: 1
