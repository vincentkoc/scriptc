name: Qualify sparse array ABI49 contracts on Darwin

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/qualify-sparse-abi-darwin.yml]

permissions:
  contents: read

concurrency:
  group: qualify-sparse-abi-darwin
  cancel-in-progress: false

jobs:
  sparse_abi:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vercel-labs/scriptc
          ref: 9f099228ba180c9a8d42cbadcf27d176f1c5fa0e
          persist-credentials: false
      - name: Apply the exact uncommitted candidate
        run: |
          python3 - <<'PATCH'
          import base64, hashlib, subprocess
          data = base64.b64decode("", validate=True)
          assert hashlib.sha256(data).hexdigest() == "08e2bed5c404b3c335673a2a0e212263a4fcd7ab990b335d2dd5f5d098c6c696"
          subprocess.run(["git", "apply", "--check", "-"], input=data, check=True)
          subprocess.run(["git", "apply", "-"], input=data, check=True)
          PATCH
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format the candidate and record the exact tested sources
        run: |
          cat > "$RUNNER_TEMP/sparse-abi-proof.mjs" <<'PROOF'
          import { spawnSync, execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { join } from "node:path";
