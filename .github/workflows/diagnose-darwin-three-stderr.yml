              runtimeAcceptance: false, attributionEstablished: false };
          }
          function files(base, prefix = "") {
            return readdirSync(base, { withFileTypes: true }).sort((a, b) => a.name.localeCompare(b.name)).flatMap(item => {
              const path = join(base, item.name), name = prefix + item.name, info = lstatSync(path);
              assert.ok(!info.isSymbolicLink(), "unexpected symlink: " + path);
              if (info.isDirectory()) return files(path, name + "/");
