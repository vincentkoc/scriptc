name: Diagnose shared worker lifetimes

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/diagnose-shared-worker-lifetimes.yml]

permissions:
  contents: read

concurrency:
  group: diagnose-shared-worker-lifetimes
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline
            source: 71a9441c824262150f35acd2b8359f156ed3289c
          - label: candidate
            source: 4706c0e22d1cc926593997d22eea84d495fbe4d6
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DIAGNOSTIC_SOURCE: ${{ matrix.source }}
      DIAGNOSTIC_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: ${{ matrix.source }}
          persist-credentials: false
      - name: Verify source before setup
        run: |
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_SOURCE"
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: ./.github/actions/llvm-linux
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zig
      - uses: ./.github/actions/native-packages
        with:
          target: linux-x64-gnu
      - name: Disable piped core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Compare native-first worker lifetimes
        run: |
          cat > "$RUNNER_TEMP/shared-worker-diagnostic.mjs" <<'PROOF'
          import assert from "node:assert/strict";
          import { spawnSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { closeSync, copyFileSync, existsSync, lstatSync, mkdirSync, openSync, readFileSync, readdirSync, realpathSync, writeFileSync } from "node:fs";
          import { join, relative } from "node:path";
          import { pathToFileURL } from "node:url";

          const root = process.cwd(), head = process.env.DIAGNOSTIC_SOURCE;
          delete process.env.FORCE_COLOR; delete process.env.NO_COLOR;
          const out = join(process.env.RUNNER_TEMP, "shared-worker-proof");
          const work = join(process.env.RUNNER_TEMP, "shared-worker-work");
          mkdirSync(out); mkdirSync(work);
          const owner = { runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, label: process.env.DIAGNOSTIC_LABEL, workflow: process.env.GITHUB_SHA };
          writeFileSync(join(work, ".diagnostic-owner.json"), JSON.stringify(owner), { flag: "wx" });
          // The earlier qualification motivates this control; none of its proof is reused.
          const settledEvidence = {
            repeated: false, usedForQualification: false,
            runs: ["https://github.com/vincentkoc/scriptc/actions/runs/41210288585"],
            cases: ["island-first-worker"],
          };
          const report = {
            label: process.env.DIAGNOSTIC_LABEL, head, workflow: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            status: "running", diagnosticComplete: false, qualificationComplete: false,
            templateCommit: "d7c2258da49c91f3cbd82277d285f32a40da2029",
            completeSuite: false, scope: "shared-worker-lifetimes", settledEvidence,
            expectedExecutionAttempts: 2, executionAttempts: 0, startedAt: new Date().toISOString(), steps: [], cases: [],
          };
          const digest = bytes => createHash("sha256").update(bytes).digest("hex");
          const hash = path => digest(readFileSync(path));
          const scrub = value => String(value).split(root).join("<repo>").split(process.env.RUNNER_TEMP).join("<temp>");
          const save = () => writeFileSync(join(out, "summary.json"), scrub(JSON.stringify(report, null, 2)) + "\n");
          let sequence = 0;
          const execute = (name, command, args, seconds = 60, env = {}) => {
            const stem = String(++sequence).padStart(2, "0") + "-" + name;
            const stdout = join(out, stem + ".stdout.log"), stderr = join(out, stem + ".stderr.log");
            const fds = [openSync(stdout, "wx"), openSync(stderr, "wx")], started = Date.now();
            let result;
            try {
              // GNU timeout owns the command group, including compiler descendants.
              result = spawnSync("timeout", ["--signal=TERM", "--kill-after=5s", seconds + "s", command, ...args], {
                cwd: root, env: { ...process.env, ...env }, stdio: ["ignore", ...fds],
              });
            } finally { fds.forEach(closeSync); }
            const observed = {
              name, command, args, seconds: (Date.now() - started) / 1000, limitSeconds: seconds,
              code: result.status, signal: result.signal, error: result.error?.message,
              stdout: relative(out, stdout), stderr: relative(out, stderr),
              stdoutSha256: hash(stdout), stderrSha256: hash(stderr),
              stdoutBytes: lstatSync(stdout).size, stderrBytes: lstatSync(stderr).size,
            };
            observed.status = observed.error ? "tool-error" : observed.signal ? "signal" :
              observed.code === 124 ? "timeout" : observed.code === 137 ? "killed" :
              observed.code === 0 ? "completed" : "nonzero-exit";
            report.steps.push(observed); save(); return observed;
          };
          const text = step => {
            assert.ok(step.stdoutBytes <= 16 * 1024 ** 2, "bounded text reader exceeded; raw log retained");
            return readFileSync(join(out, step.stdout), "utf8");
          };
          const requireSuccess = step => { assert.equal(step.status, "completed", step.name); return step; };
          const capture = (name, command, args) => text(requireSuccess(execute(name, command, args))).trim();
          const validateCompile = (step, entry, artifact, markedIslands) => {
            try {
              requireSuccess(step);
              const diagnostics = JSON.parse(text(step));
              assert.equal(diagnostics.schema, "scriptc-diagnostics"); assert.equal(diagnostics.schemaVersion, 1);
              assert.equal(diagnostics.command, "build"); assert.equal(diagnostics.entry, entry);
              assert.equal(diagnostics.artifact, artifact); assert.equal(diagnostics.phase, "complete");
              assert.equal(diagnostics.success, true); assert.ok(Array.isArray(diagnostics.diagnostics));
              assert.equal(diagnostics.diagnostics.filter(item => item.severity === "error").length, 0);
              const islands = diagnostics.diagnostics.filter(item => item.code === "SC8001");
              assert.deepEqual(islands.map(item => item.file).sort(), [...markedIslands].sort());
              step.diagnosticsStatus = "passed"; return true;
            } catch (error) {
              step.diagnosticsStatus = "failed"; step.diagnosticsError = scrub(error.stack ?? error); return false;
            } finally { save(); }
          };
          // Exact harness exception: keep every other sanitizer message and all raw bytes.
          const ASAN_SWAP = /^==\d+==WARNING: ASan doesn't fully support makecontext\/swapcontext.*\n/gm;
          const parityOutcome = (step, sanitize = false) => {
            assert.ok(step.stderrBytes <= 16 * 1024 ** 2, "bounded normalization reader exceeded; raw log retained");
            const raw = readFileSync(join(out, step.stderr), "utf8");
            let removedLines = 0;
            const normalized = sanitize ? raw.replace(ASAN_SWAP, () => { removedLines += 1; return ""; }) : raw;
            const stderr = step.stderr + ".normalized.log"; writeFileSync(join(out, stderr), normalized);
            return {
              status: step.status, code: step.code, signal: step.signal, error: step.error,
              stdout: step.stdout, stdoutSha256: step.stdoutSha256, stderr, stderrSha256: digest(normalized),
              normalization: { stdout: "none", stderr: sanitize ? "ASAN_SWAP" : "none", removedLines,
                ruleSource: "tests/harness/node-island-order.test.ts:63", pattern: ASAN_SWAP.source, flags: ASAN_SWAP.flags },
            };
          };
          // Native verdict failures remain complete evidence only after compile admission and input readback.
          const completeCase = item => item.oracle?.expectedMatched === true && item.oracle.status === "completed" &&
            item.ir?.status === "passed" && item.ir.compile?.status === "completed" &&
            item.ir.compile.diagnosticsStatus === "passed" && Boolean(item.ir.artifact) &&
            ["plain", "san"].every(flavor => {
              const native = item.flavors[flavor], execution = native?.execution;
              return native?.compile?.status === "completed" && native.compile.diagnosticsStatus === "passed" &&
                Boolean(native.llvm && native.libnodeManifest && native.moduleOwners) && native.inputsVerifiedAfter === true &&
                execution?.attempted === true && execution.workerResultReached === true && !execution.error &&
                !["SIGKILL", "SIGTERM", "SIGHUP", "SIGINT"].includes(execution.signal) &&
                ![129, 130, 137, 143].includes(execution.code) &&
                ["completed", "nonzero-exit", "signal"].includes(execution.status) && Boolean(execution.parityOutcome);
            });
          const irEvidence = program => {
            assert.ok(Array.isArray(program.functions) && typeof program.entry === "string");
            assert.equal(program.workers, true, "IR must enable native worker roots");
            const workerCalls = [];
            const fileName = path => typeof path === "string" ? path.split(/[\\/]/).at(-1) : path;
            const walk = value => {
              if (!value || typeof value !== "object") return;
              if (value.kind === "libCall" && ["worker.root", "worker.isMainThread"].includes(value.fn))
                workerCalls.push({ fn: value.fn, file: fileName(value.loc?.file) });
              for (const child of Object.values(value)) {
                if (Array.isArray(child)) child.forEach(walk); else if (child && typeof child === "object") walk(child);
              }
            };
            for (const fn of program.functions) walk(fn.body);
            for (const name of ["worker.root", "worker.isMainThread"])
              assert.ok(workerCalls.some(call => call.fn === name), "missing native worker dispatch: " + name);
            for (const file of ["worker.mjs", "main.mjs"])
              assert.ok(program.functions.some(fn => fileName(fn.loc?.file) === file && Array.isArray(fn.body) && fn.body.length > 0),
                "missing authored native body: " + file);
            return { entry: program.entry, workers: program.workers, workerCalls, functions: program.functions.map(fn => ({
              name: fn.name, sourceName: fn.sourceName, file: fileName(fn.loc?.file), statements: fn.body.length,
            })) };
          };
          const sourceFiles = [
            "packages/compiler/src/frontend/lowering/rebindable-functions.ts",
            "packages/compiler/src/frontend/lowering/class-dynamic-dispatch.ts",
            "packages/compiler/src/frontend/lowering/unit-journal.ts",
            "packages/node/package.json",
            "packages/node/index.js",
            "packages/node/index.d.ts",
            "packages/compiler/src/frontend/lowering/lower-shared-modules.ts",
            "packages/compiler/src/frontend/lowering/lower-stmts.ts", "tests/harness/node-island.test.ts", "CHANGELOG.md",
            "packages/compiler/src/frontend/pipeline.ts", "packages/compiler/src/frontend/lowering/lower-modules.ts",
            "packages/compiler/src/frontend/lowering/lowerer.ts", "packages/compiler/src/backend/runtime-abi.ts",
            "packages/compiler/src/frontend/program-node.ts", "packages/compiler/src/cli/command.ts",
            "packages/compiler/src/node-islands/modules.ts", "packages/compiler/src/node-islands/libnode-pack.ts",
            "packages/runtime/src/scr_node_island_hooks.cjs", "packages/libnode-common/dev-pack.json", "pnpm-lock.yaml",
            "packages/runtime/src/scr_worker.c", "packages/runtime/src/scr_worker_events.c",
            "packages/runtime/src/scr_closure.c", "packages/runtime/src/scr_dyn_handle.c",
            "packages/compiler/src/ir/ir.ts", "packages/runtime/src/scr_node_island_export.c", "packages/runtime/src/scr_regex.c", "packages/runtime/src/scr_regex.h",
            "native/llvm-codegen/src/target.h", "native/llvm-codegen/src/main.cpp", "packages/compiler/src/backend/native-codegen-core.ts",
            "packages/libnode-common/fetch-dev-pack.mjs", "packages/libnode-common/build-pack.mjs",
            "packages/libnode-common/bridge/scr_node_bridge.cc", "packages/runtime/src/scr_node_bridge.h",
          ];
          const source = () => {
            assert.equal(capture("source-head", "git", ["rev-parse", "HEAD"]), head);
            assert.equal(capture("source-status", "git", ["status", "--porcelain"]), "");
            requireSuccess(execute("source-diff", "git", ["diff", "--exit-code", "HEAD"]));
            return Object.fromEntries(sourceFiles.map(file => [file, hash(file)]));
          };
          const moduleFiles = base => readdirSync(base, { withFileTypes: true }).sort((a, b) => a.name.localeCompare(b.name)).flatMap(entry => {
            const path = join(base, entry.name), info = lstatSync(path);
            assert.ok(!info.isSymbolicLink());
            if (info.isDirectory()) return moduleFiles(path).map(file => ({ ...file, path: entry.name + "/" + file.path }));
            assert.ok(info.isFile()); return [{ path: entry.name, bytes: info.size, sha256: hash(path) }];
          });
          const specs = [
            {
              "id": "shared-native-first-worker",
              "origin": "tests/harness/node-island.test.ts",
              "fixtureSource": "4706c0e22d1cc926593997d22eea84d495fbe4d6",
              "transform": "diagnostic-only parameter combination order=native-first root=worker from committed template; not a registered test.each row; no source rewrite",
              "islands": [
                "island.mjs"
              ],
              "files": {
                "package.json": "{\"type\":\"module\",\"scriptc\":{\"nodeIslands\":{\"auto\":false,\"modules\":[\"island.mjs\"]}}}",
                "main.mjs": "import { choose, choosePrivate, make } from \"./helper.mjs\";\nimport { checkSaved } from \"./island.mjs\";\nimport { read } from \"./observer.mjs\";\nconsole.log(\"native\", choose(), choosePrivate());\ncheckSaved();\nconsole.log(\"diamond\", read());\nconsole.log(\"class\", make().read(), make());\nimport { Worker } from \"node:worker_threads\";\nconst worker = new Worker(new URL(\"./worker.mjs\", import.meta.url));\nconsole.log(\"worker\", await new Promise((resolve) => worker.once(\"message\", resolve)));\n\n",
                "helper.mjs": "export function choose() {\n  // @ts-expect-error JavaScript permits reassignment of a function declaration.\n  choose = () => \"replacement\";\n  return \"original\";\n}\nfunction hidden() {\n  // @ts-expect-error JavaScript permits reassignment of a function declaration.\n  hidden = () => \"private-replacement\";\n  return \"private-original\";\n}\nexport function choosePrivate() { return hidden(); }\nclass Box { read() { return 7; } }\nexport function make() {\n  // @ts-expect-error JavaScript permits reassignment of a function declaration.\n  make = () => null;\n  return new Box();\n}\n",
                "island.mjs": "import { choose, choosePrivate } from \"./helper.mjs\";\nconst original = choose;\nconsole.log(\"island\", original === choose, original(), choose(), original === choose);\nconsole.log(\"private\", choosePrivate(), choosePrivate());\nexport function checkSaved() {\n  console.log(\"saved\", original === choose, original(), choose());\n}\n",
                "observer.mjs": "import { choose } from \"./helper.mjs\";\nexport function read() { return choose(); }\n",
                "worker.mjs": "import { parentPort } from \"node:worker_threads\";\nimport { choose, choosePrivate } from \"./helper.mjs\";\nparentPort.postMessage(choose() + \" \" + choosePrivate() + \" \" + choose());\n"
              },
              "expected": "island true original replacement false\nprivate private-original private-replacement\nnative replacement private-replacement\nsaved false original replacement\ndiamond replacement\nclass 7 null\nworker original private-original replacement\n",
              "fixtureDefinitionSha256": "c1c728473393b87c0fc61c7dcc95037c5bb862d3dc0586de7b024c732a50838d"
            }
          ];
          const fixtures = join(out, "fixtures"); mkdirSync(fixtures);
          for (const spec of specs) {
            const dir = join(fixtures, spec.id); mkdirSync(dir);
            for (const [file, contents] of Object.entries(spec.files))
              writeFileSync(join(dir, file), contents);
            writeFileSync(join(dir, "expected.stdout.log"), spec.expected);
          }
          const fixtureManifest = moduleFiles(fixtures);
          report.fixtureManifest = fixtureManifest; report.fixtureDigest = digest(JSON.stringify(fixtureManifest));
          const verifyFixtures = () => assert.deepEqual(moduleFiles(fixtures), fixtureManifest);
          const recordFile = path => ({ path: relative(out, path), bytes: lstatSync(path).size, sha256: hash(path) });
          save();
          try {
            assert.equal(report.fixtureDigest, "8fe5fd0de70a2e0c88849fca4cd4434579b08e5010339f03d045e407dc9abfab", "authored fixture bytes changed");
            report.sourceInputs = source(); report.sourceVerifiedBefore = true;
            assert.equal(process.platform, "linux"); assert.equal(process.arch, "x64"); assert.equal(process.version, "v24.22.1");
            report.tools = { node: process.version, pnpm: capture("pnpm", "pnpm", ["--version"]), llvm: capture("llvm", "llvm-config", ["--version"]), zig: capture("zig", "zig", ["version"]) };
            assert.deepEqual(report.tools, { node: "v24.22.1", pnpm: "11.1.3", llvm: "22.1.8", zig: "0.16.0" });
            requireSuccess(execute("verify-runtime", process.execPath, ["packages/runtime-linux-x64-gnu/scripts/verify.mjs"]));
            report.runtimeManifestSha256 = hash("packages/runtime-linux-x64-gnu/runtime-pack.json");
            report.build = execute("workspace-build", "pnpm", ["build"], 600); requireSuccess(report.build);
            report.helper = JSON.parse(capture("helper", "packages/llvm-linux-x64-gnu/bin/scriptc-llvm-codegen", ["version", "--format=json"]));
            assert.equal(report.helper.ok, true);
            report.helperBinarySha256 = hash("packages/llvm-linux-x64-gnu/bin/scriptc-llvm-codegen");
            assert.equal(report.helper.protocol_version, "1"); assert.equal(report.helper.llvm_version, "22.1.8");
            assert.equal(report.helper.scriptc_package_version, JSON.parse(readFileSync("packages/llvm-linux-x64-gnu/package.json", "utf8")).version);
            const toolIdentity = (name, command) => {
              const path = realpathSync(capture(name + "-path", "sh", ["-c", 'command -v "$1"', "diagnostic", command]));
              return { command, path, sha256: hash(path), version: capture(name + "-version", command, ["--version"]) };
            };
            const cxx = process.env.CXX || "g++";
            report.bridgeBuild = {
              kind: "independent-reproduction", sharedPack: false, crossRevisionByteIdentity: "not-assumed",
              compiler: toolIdentity("bridge-cxx", cxx), strip: toolIdentity("bridge-strip", "strip"),
              linker: toolIdentity("bridge-linker", capture("bridge-linker-name", cxx, ["-print-prog-name=ld"])),
              compilerTarget: capture("bridge-cxx-target", cxx, ["-dumpmachine"]),
              image: { os: process.env.ImageOS, version: process.env.ImageVersion },
              buildRecipe: "packages/libnode-common/build-pack.mjs:66", source: "packages/libnode-common/bridge/scr_node_bridge.cc",
              sourceSha256: report.sourceInputs["packages/libnode-common/bridge/scr_node_bridge.cc"],
              pinnedLibnodeSha256: "15daddf057366cf406653372774250049fe7b9ba3a347c60bebd14f9409c5838",
            };
            const packRoot = join(work, "libnode");
            requireSuccess(execute("fetch-libnode", process.execPath, ["packages/libnode-common/fetch-dev-pack.mjs", "--out", packRoot], 600));
            const { readLibnodePack } = await import(pathToFileURL(join(root, "packages/compiler/dist/node-islands/libnode-pack.js")));
            const { providedModulePlaceholder } = await import(pathToFileURL(join(root, "packages/compiler/dist/node-islands/modules.js")));
            const pack = readLibnodePack(packRoot, { verifyHashes: true });
            assert.equal(pack.manifest.nodeVersion, "24.22.1"); assert.equal(pack.manifest.bridgeAbi, 10);
            assert.equal(pack.manifest.platform, "linux"); assert.equal(pack.manifest.arch, "x64");
            report.libnode = { manifest: pack.manifest, manifestSha256: hash(join(packRoot, "manifest.json")) };
            report.bridgeBuild.currentBridgeSha256 = pack.manifest.files[pack.manifest.bridge].sha256;
            report.bridgeBuild.currentLibnodeSha256 = pack.manifest.files[pack.manifest.libnode].sha256;
            assert.equal(report.bridgeBuild.currentLibnodeSha256, report.bridgeBuild.pinnedLibnodeSha256);
            for (const spec of specs) {
              const observed = { id: spec.id, origin: spec.origin, fixtureSource: spec.fixtureSource, fixtureDefinitionSha256: spec.fixtureDefinitionSha256, transform: spec.transform, markedIslands: spec.islands, expectedStdoutSha256: digest(spec.expected), flavors: {} };
              report.cases.push(observed);
              const dir = join(fixtures, spec.id), entry = join(dir, "main.mjs"), markedIslands = spec.islands.map(file => join(dir, file));
              const artifacts = join(out, spec.id); mkdirSync(artifacts);
              verifyFixtures();
              try {
                observed.oracle = execute(spec.id + "-node", process.execPath, [entry], 30, { SCRIPTC_SAN: "", SCRIPTC_LIBNODE: "" });
                observed.oracle.attempted = observed.oracle.status !== "tool-error";
                observed.oracle.parityOutcome = parityOutcome(observed.oracle);
                observed.oracle.expectedMatched = observed.oracle.status === "completed" &&
                  observed.oracle.stdoutSha256 === digest(spec.expected) && observed.oracle.stderrBytes === 0;
              } catch (error) { observed.oracleError = scrub(error.stack ?? error); }
              const common = ["packages/cli/dist/main.js", "build", entry, "--print=diagnostics", "--node-islands=explicit", ...markedIslands.map(file => "--node-island=" + file)];
              const irPath = join(artifacts, "program.ir.json"), irCache = join(work, spec.id + "-ir-cache"); mkdirSync(irCache, { mode: 0o700 });
              observed.ir = { status: "running", attempted: false };
              try {
                observed.ir.compile = execute(spec.id + "-ir", process.execPath, [...common, "--emit=ir", "-o", irPath], 180,
                  { SCRIPTC_CACHE_DIR: irCache, SCRIPTC_SAN: "", SCRIPTC_LIBNODE: "" });
                observed.ir.attempted = observed.ir.compile.status !== "tool-error";
                if (existsSync(irPath)) observed.ir.artifact = recordFile(irPath);
                assert.ok(validateCompile(observed.ir.compile, entry, irPath, markedIslands), "IR compilation or diagnostics failed");
                assert.ok(observed.ir.artifact, "successful IR build did not produce its artifact");
                observed.ir.ownership = irEvidence(JSON.parse(readFileSync(irPath, "utf8")));
                observed.ir.status = "passed";
              } catch (error) { observed.ir.status = "failed"; observed.ir.error = scrub(error.stack ?? error); }
              finally { save(); }
              for (const flavor of ["plain", "san"]) {
                const result = observed.flavors[flavor] = { status: "running", execution: { status: "not-executed", attempted: false }, parity: "not-compared" };
                const build = join(work, spec.id + "-" + flavor); mkdirSync(build);
                const binary = join(build, "program"), cache = join(build, "cache"); mkdirSync(cache, { mode: 0o700 });
                const env = { SCRIPTC_CACHE_DIR: cache, SCRIPTC_SAN: "", SCRIPTC_LIBNODE: packRoot, ASAN_OPTIONS: "detect_leaks=0" };
                try {
                  const args = [...common, "-o", binary, "--keep-llvm", "--libnode=beside", ...(flavor === "san" ? ["--sanitize"] : [])];
                  result.compile = execute(spec.id + "-" + flavor + "-compile", process.execPath, args, 300, env);
                  // The compiler retains LLVM by entry stem, not executable name.
                  if (existsSync(join(build, "main.ll"))) {
                    const llvm = join(artifacts, flavor + ".ll"); copyFileSync(join(build, "main.ll"), llvm); result.llvm = recordFile(llvm);
                  }
                  assert.ok(validateCompile(result.compile, entry, binary, markedIslands), "native compilation or diagnostics failed");
                  result.execution = { status: "blocked-before-execution", attempted: false };
                  assert.equal(observed.ir.status, "passed", "native execution requires admitted IR");
                  const beside = readLibnodePack(binary + ".libnode", { verifyHashes: true });
                  assert.deepEqual(beside.manifest, pack.manifest);
                  const modules = join(beside.root, "modules");
                  result.moduleFiles = moduleFiles(modules);
                  assert.deepEqual(result.moduleFiles.map(file => file.path).sort(), ["helper.mjs", "package.json", ...spec.islands].sort());
                  for (const file of ["package.json", ...spec.islands]) assert.equal(hash(join(modules, file)), hash(join(dir, file)));
                  assert.deepEqual(readFileSync(join(modules, "helper.mjs")), Buffer.from(providedModulePlaceholder("helper.mjs")));
                  result.moduleOwners = { entry: "native", worker: "native", observer: "native", islands: spec.islands, helper: "native-provided-placeholder" };
                  result.binarySha256 = hash(binary);
                  const manifestCopy = join(artifacts, flavor + ".libnode-manifest.json");
                  copyFileSync(join(beside.root, "manifest.json"), manifestCopy); result.libnodeManifest = recordFile(manifestCopy);
                  result.execution = execute(spec.id + "-" + flavor + "-run", binary, [], 30, { ...env, SCRIPTC_LIBNODE: "" });
                  result.execution.attempted = result.execution.status !== "tool-error";
                  result.execution.workerResultReached = text(result.execution).split(/\r?\n/).includes("worker original private-original replacement");
                  result.execution.parityOutcome = parityOutcome(result.execution, flavor === "san");
                  const expectedOutcome = observed.oracle?.parityOutcome, actualOutcome = result.execution.parityOutcome;
                  result.parity = observed.oracle?.expectedMatched && expectedOutcome && result.execution.status === "completed" &&
                    actualOutcome.code === expectedOutcome.code && actualOutcome.signal === expectedOutcome.signal &&
                    actualOutcome.stdoutSha256 === expectedOutcome.stdoutSha256 && actualOutcome.stderrSha256 === expectedOutcome.stderrSha256 ? "matched" : "mismatch";
                  assert.equal(hash(binary), result.binarySha256);
                  assert.deepEqual(readLibnodePack(binary + ".libnode", { verifyHashes: true }).manifest, pack.manifest);
                  assert.deepEqual(moduleFiles(modules), result.moduleFiles);
                  result.inputsVerifiedAfter = true;
                  assert.ok(result.llvm, "successful native build did not retain LLVM");
                  assert.equal(result.parity, "matched"); result.status = "passed";
                } catch (error) { result.status = "failed"; result.error = scrub(error.stack ?? error); }
                finally { save(); }
              }
              observed.complete = completeCase(observed); save();
            }
            report.executionAttempts = report.cases.flatMap(item => Object.values(item.flavors)).filter(item => item.execution.attempted === true).length;
            report.diagnosticComplete = report.cases.length === specs.length && report.cases.every(item => item.complete);
            report.diagnosticComplete &&= report.executionAttempts === report.expectedExecutionAttempts;
            report.qualificationComplete = report.diagnosticComplete && report.cases.every(item =>
              ["plain", "san"].every(flavor => item.flavors[flavor].status === "passed" && item.flavors[flavor].parity === "matched"));
            report.status = report.qualificationComplete ? "passed" : "failed";
          } catch (error) { report.status = "failed"; report.error = scrub(error.stack ?? error); }
          finally {
            try { assert.deepEqual(source(), report.sourceInputs); report.sourceVerifiedAfter = true; verifyFixtures(); report.fixturesVerifiedAfter = true; }
            catch (error) { report.status = "failed"; report.diagnosticComplete = false; report.qualificationComplete = false; report.sourceError = scrub(error.stack ?? error); }
            report.finishedAt = new Date().toISOString(); save();
            writeFileSync(join(out, "summary.sha256"), hash(join(out, "summary.json")) + "\n");
            console.log(JSON.stringify({ label: report.label, status: report.status, diagnosticComplete: report.diagnosticComplete, qualificationComplete: report.qualificationComplete }));
            if (!report.qualificationComplete) { console.error("[shared-worker-diagnostic] FAILED (exit 1)"); process.exitCode = 1; }
          }
          PROOF
          ulimit -c 0
          node "$RUNNER_TEMP/shared-worker-diagnostic.mjs"
      - name: Remove this diagnostic's build scratch
        if: always()
        run: |
          node --input-type=module <<'CLEANUP'
          import assert from "node:assert/strict";
          import { existsSync, mkdirSync, readFileSync, rmSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const temp = process.env.RUNNER_TEMP, work = join(temp, "shared-worker-work"), out = join(temp, "shared-worker-proof");
          const owner = { runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, label: process.env.DIAGNOSTIC_LABEL, workflow: process.env.GITHUB_SHA };
          const receipt = { ...owner, work: "absent", payload: "absent" };
          try {
            if (existsSync(work)) {
              assert.deepEqual(JSON.parse(readFileSync(join(work, ".diagnostic-owner.json"), "utf8")), owner);
              rmSync(work, { recursive: true }); receipt.work = "removed";
            }
            const payload = join(temp, "shared-worker-diagnostic.mjs");
            if (existsSync(payload)) { rmSync(payload); receipt.payload = "removed"; }
          } catch (error) { receipt.error = String(error); process.exitCode = 1; }
          finally {
            mkdirSync(out, { recursive: true });
            writeFileSync(join(out, "cleanup.json"), JSON.stringify(receipt, null, 2) + "\n");
            if (process.exitCode) console.error("[shared-worker-cleanup] FAILED (exit 1)");
          }
          CLEANUP
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-lifetimes-${{ matrix.label }}
          path: ${{ runner.temp }}/shared-worker-proof
          if-no-files-found: error
          retention-days: 3

  aggregate:
    needs: diagnose
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@v4
        with:
          pattern: worker-lifetimes-*
          path: ${{ runner.temp }}/worker-lifetimes-results
      - name: Verify paired worker diagnostic evidence
        run: |
          node --input-type=module <<'COMPARE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const heads = { baseline: "71a9441c824262150f35acd2b8359f156ed3289c", candidate: "4706c0e22d1cc926593997d22eea84d495fbe4d6" };
          const id = "shared-native-first-worker", markedIslands = ["island.mjs"];
          const result = { workflow: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            scope: "shared-worker-lifetimes", diagnosticComplete: false, qualificationComplete: false, sources: {} };
          const digest = bytes => createHash("sha256").update(bytes).digest("hex");
          const ASAN_SWAP = /^==\d+==WARNING: ASan doesn't fully support makecontext\/swapcontext.*\n/gm;
          // Native verdict failures remain complete evidence only after compile admission and input readback.
          const completeCase = item => item.oracle?.expectedMatched === true && item.oracle.status === "completed" &&
            item.ir?.status === "passed" && item.ir.compile?.status === "completed" &&
            item.ir.compile.diagnosticsStatus === "passed" && Boolean(item.ir.artifact) &&
            ["plain", "san"].every(flavor => {
              const native = item.flavors[flavor], execution = native?.execution;
              return native?.compile?.status === "completed" && native.compile.diagnosticsStatus === "passed" &&
                Boolean(native.llvm && native.libnodeManifest && native.moduleOwners) && native.inputsVerifiedAfter === true &&
                execution?.attempted === true && execution.workerResultReached === true && !execution.error &&
                !["SIGKILL", "SIGTERM", "SIGHUP", "SIGINT"].includes(execution.signal) &&
                ![129, 130, 137, 143].includes(execution.code) &&
                ["completed", "nonzero-exit", "signal"].includes(execution.status) && Boolean(execution.parityOutcome);
            });
          const irEvidence = program => {
            assert.ok(Array.isArray(program.functions) && typeof program.entry === "string");
            assert.equal(program.workers, true, "IR must enable native worker roots");
            const workerCalls = [];
            const fileName = path => typeof path === "string" ? path.split(/[\\/]/).at(-1) : path;
            const walk = value => {
              if (!value || typeof value !== "object") return;
              if (value.kind === "libCall" && ["worker.root", "worker.isMainThread"].includes(value.fn))
                workerCalls.push({ fn: value.fn, file: fileName(value.loc?.file) });
              for (const child of Object.values(value)) {
                if (Array.isArray(child)) child.forEach(walk); else if (child && typeof child === "object") walk(child);
              }
            };
            for (const fn of program.functions) walk(fn.body);
            for (const name of ["worker.root", "worker.isMainThread"])
              assert.ok(workerCalls.some(call => call.fn === name), "missing native worker dispatch: " + name);
            for (const file of ["worker.mjs", "main.mjs"])
              assert.ok(program.functions.some(fn => fileName(fn.loc?.file) === file && Array.isArray(fn.body) && fn.body.length > 0),
                "missing authored native body: " + file);
            return { entry: program.entry, workers: program.workers, workerCalls, functions: program.functions.map(fn => ({
              name: fn.name, sourceName: fn.sourceName, file: fileName(fn.loc?.file), statements: fn.body.length,
            })) };
          };
          try {
            for (const [label, head] of Object.entries(heads)) {
              const dir = join(process.env.RUNNER_TEMP, "worker-lifetimes-results", "worker-lifetimes-" + label);
              const verifyFile = file => {
                const bytes = readFileSync(join(dir, file.path));
                assert.equal(digest(bytes), file.sha256); assert.equal(bytes.length, file.bytes);
              };
              const verifyOutcome = (execution, sanitize) => {
                const outcome = execution.parityOutcome;
                if (!outcome) return;
                let removedLines = 0;
                const raw = readFileSync(join(dir, execution.stderr), "utf8");
                const normalized = sanitize ? raw.replace(ASAN_SWAP, () => { removedLines += 1; return ""; }) : raw;
                assert.equal(readFileSync(join(dir, outcome.stderr), "utf8"), normalized);
                assert.equal(outcome.stderrSha256, digest(normalized)); assert.equal(outcome.stdoutSha256, execution.stdoutSha256);
                assert.equal(outcome.stdout, execution.stdout); assert.equal(outcome.status, execution.status);
                assert.equal(outcome.code, execution.code); assert.equal(outcome.signal, execution.signal);
                assert.deepEqual(outcome.normalization, { stdout: "none", stderr: sanitize ? "ASAN_SWAP" : "none", removedLines,
                  ruleSource: "tests/harness/node-island-order.test.ts:63", pattern: ASAN_SWAP.source, flags: ASAN_SWAP.flags });
              };
              const verifyDiagnostics = (compile, suffix) => {
                if (compile?.diagnosticsStatus !== "passed") return;
                const value = JSON.parse(readFileSync(join(dir, compile.stdout), "utf8"));
                const entrySuffix = "/shared-worker-proof/fixtures/" + id + "/main.mjs";
                assert.ok(value.entry.endsWith(entrySuffix));
                const temp = value.entry.slice(0, -entrySuffix.length);
                assert.equal(value.schema, "scriptc-diagnostics"); assert.equal(value.schemaVersion, 1);
                assert.equal(value.command, "build"); assert.equal(value.phase, "complete"); assert.equal(value.success, true);
                assert.equal(value.artifact, temp + suffix); assert.ok(Array.isArray(value.diagnostics));
                assert.equal(value.diagnostics.filter(item => item.severity === "error").length, 0);
                const marked = markedIslands.map(file => temp + "/shared-worker-proof/fixtures/" + id + "/" + file);
                assert.deepEqual(value.diagnostics.filter(item => item.code === "SC8001").map(item => item.file).sort(), marked.sort());
              };
              const bytes = readFileSync(join(dir, "summary.json")), summary = JSON.parse(bytes);
              result.sources[label] = { summarySha256: digest(bytes), summary };
              assert.equal(digest(bytes), readFileSync(join(dir, "summary.sha256"), "utf8").trim());
              assert.equal(summary.head, head); assert.equal(summary.label, label); assert.equal(summary.scope, result.scope);
              assert.equal(summary.templateCommit, "d7c2258da49c91f3cbd82277d285f32a40da2029");
              assert.equal(summary.workflow, result.workflow); assert.equal(summary.runId, result.runId); assert.equal(summary.attempt, result.attempt);
              assert.equal(summary.settledEvidence.repeated, false); assert.equal(summary.settledEvidence.usedForQualification, false);
              assert.equal(summary.fixtureDigest, "8fe5fd0de70a2e0c88849fca4cd4434579b08e5010339f03d045e407dc9abfab");
              assert.equal(digest(JSON.stringify(summary.fixtureManifest)), summary.fixtureDigest);
              assert.deepEqual(summary.tools, { node: "v24.22.1", pnpm: "11.1.3", llvm: "22.1.8", zig: "0.16.0" });
              assert.equal(summary.build.status, "completed"); assert.equal(summary.helper.protocol_version, "1");
              assert.equal(summary.helper.llvm_version, "22.1.8"); assert.match(summary.helperBinarySha256, /^[a-f0-9]{64}$/);
              assert.equal(summary.libnode.manifest.nodeVersion, "24.22.1"); assert.equal(summary.libnode.manifest.bridgeAbi, 10);
              assert.equal(summary.bridgeBuild.currentLibnodeSha256, "15daddf057366cf406653372774250049fe7b9ba3a347c60bebd14f9409c5838");
              const cleanup = JSON.parse(readFileSync(join(dir, "cleanup.json"), "utf8"));
              assert.equal(cleanup.runId, result.runId); assert.equal(cleanup.attempt, result.attempt);
              assert.equal(cleanup.workflow, result.workflow); assert.equal(cleanup.label, label);
              assert.equal(cleanup.error, undefined); assert.equal(cleanup.work, "removed"); assert.equal(cleanup.payload, "removed");
              result.sources[label].cleanup = cleanup;
              assert.deepEqual(summary.cases.map(item => item.id), [id]);
              for (const file of summary.fixtureManifest) verifyFile({ ...file, path: "fixtures/" + file.path });
              for (const step of summary.steps) for (const stream of ["stdout", "stderr"])
                verifyFile({ path: step[stream], sha256: step[stream + "Sha256"], bytes: step[stream + "Bytes"] });
              const item = summary.cases[0];
              assert.deepEqual(item.markedIslands, markedIslands); assert.equal(item.fixtureSource, heads.candidate);
              assert.equal(item.fixtureDefinitionSha256, "c1c728473393b87c0fc61c7dcc95037c5bb862d3dc0586de7b024c732a50838d");
              assert.equal(item.transform, "diagnostic-only parameter combination order=native-first root=worker from committed template; not a registered test.each row; no source rewrite");
              const expectedStdout = digest(readFileSync(join(dir, "fixtures", id, "expected.stdout.log")));
              assert.equal(expectedStdout, digest("island true original replacement false\nprivate private-original private-replacement\nnative replacement private-replacement\nsaved false original replacement\ndiamond replacement\nclass 7 null\nworker original private-original replacement\n")); assert.equal(item.expectedStdoutSha256, expectedStdout);
              if (item.oracle) {
                verifyOutcome(item.oracle, false);
                const step = summary.steps.find(step => step.name === id + "-node");
                assert.ok(step); assert.deepEqual(step.args, ["<temp>/shared-worker-proof/fixtures/" + id + "/main.mjs"]);
                assert.equal(step.stdoutSha256, item.oracle.stdoutSha256); assert.equal(step.stderrSha256, item.oracle.stderrSha256);
                assert.equal(item.oracle.expectedMatched, item.oracle.status === "completed" &&
                  item.oracle.stdoutSha256 === expectedStdout && item.oracle.stderrBytes === 0);
              }
              if (item.ir.artifact) {
                verifyFile(item.ir.artifact);
                if (item.ir.status === "passed") {
                  const ownership = irEvidence(JSON.parse(readFileSync(join(dir, item.ir.artifact.path), "utf8")));
                  assert.deepEqual(item.ir.ownership, ownership);
                }
              }
              verifyDiagnostics(item.ir.compile, "/shared-worker-proof/" + id + "/program.ir.json");
              for (const flavor of ["plain", "san"]) {
                const native = item.flavors[flavor], execution = native.execution;
                for (const file of [native.llvm, native.libnodeManifest].filter(Boolean)) verifyFile(file);
                verifyDiagnostics(native.compile, "/shared-worker-work/" + id + "-" + flavor + "/program");
                verifyOutcome(execution, flavor === "san");
                if (execution.attempted) {
                  assert.equal(item.ir.status, "passed");
                  assert.deepEqual(native.moduleOwners, { entry: "native", worker: "native", observer: "native",
                    islands: markedIslands, helper: "native-provided-placeholder" });
                  assert.deepEqual(native.moduleFiles.map(file => file.path).sort(), ["helper.mjs", "package.json", ...markedIslands].sort());
                  for (const file of ["package.json", ...markedIslands])
                    assert.equal(native.moduleFiles.find(item => item.path === file).sha256, digest(readFileSync(join(dir, "fixtures", id, file))));
                  const placeholder = 'throw new Error("helper.mjs is provided by the compiled program");\n';
                  assert.equal(native.moduleFiles.find(item => item.path === "helper.mjs").sha256, digest(placeholder));
                  const step = summary.steps.find(step => step.name === id + "-" + flavor + "-run");
                  assert.ok(step); assert.equal(step.command, "<temp>/shared-worker-work/" + id + "-" + flavor + "/program");
                  assert.notEqual(step.status, "tool-error"); assert.equal(step.stdoutSha256, execution.stdoutSha256); assert.equal(step.stderrSha256, execution.stderrSha256);
                  assert.equal(execution.workerResultReached, readFileSync(join(dir, execution.stdout), "utf8").split(/\r?\n/).includes("worker original private-original replacement"));
                  const actual = execution.parityOutcome, oracle = item.oracle?.parityOutcome;
                  const matched = Boolean(item.oracle?.expectedMatched && actual && oracle && execution.status === "completed" &&
                    actual.code === oracle.code && actual.signal === oracle.signal &&
                    actual.stdoutSha256 === oracle.stdoutSha256 && actual.stderrSha256 === oracle.stderrSha256);
                  assert.equal(native.parity, matched ? "matched" : "mismatch");
                }
              }
              assert.equal(item.complete, completeCase(item));
              const attempts = Object.values(item.flavors).filter(native => native.execution.attempted === true).length;
              assert.equal(summary.expectedExecutionAttempts, 2); assert.equal(summary.executionAttempts, attempts);
              const complete = item.complete && attempts === 2 && summary.sourceVerifiedBefore === true &&
                summary.sourceVerifiedAfter === true && summary.fixturesVerifiedAfter === true;
              assert.equal(summary.diagnosticComplete, complete);
              const qualified = complete && ["plain", "san"].every(flavor =>
                item.flavors[flavor].status === "passed" && item.flavors[flavor].parity === "matched");
              assert.equal(summary.qualificationComplete, qualified);
              assert.equal(summary.status, qualified ? "passed" : "failed");
            }
            const baseline = result.sources.baseline.summary, candidate = result.sources.candidate.summary;
            assert.equal(baseline.fixtureDigest, candidate.fixtureDigest);
            result.nativeIdentity = { runtimeManifestEqual: baseline.runtimeManifestSha256 === candidate.runtimeManifestSha256,
              helperBinaryEqual: baseline.helperBinarySha256 === candidate.helperBinarySha256,
              bridgeBinaryEqual: baseline.bridgeBuild.currentBridgeSha256 === candidate.bridgeBuild.currentBridgeSha256,
              sharedPack: false };
            result.diagnosticComplete = baseline.diagnosticComplete && candidate.diagnosticComplete;
            result.qualificationComplete = result.diagnosticComplete && baseline.qualificationComplete && candidate.qualificationComplete;
          } catch (error) { result.error = String(error); result.diagnosticComplete = false; result.qualificationComplete = false; }
          writeFileSync(join(process.env.RUNNER_TEMP, "worker-lifetimes-aggregate.json"), JSON.stringify(result, null, 2) + "\n");
          console.log(JSON.stringify({ diagnosticComplete: result.diagnosticComplete, qualificationComplete: result.qualificationComplete }));
          if (!result.qualificationComplete) { console.error("[shared-worker-comparison] FAILED (exit 1)"); process.exitCode = 1; }
          COMPARE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-lifetimes-aggregate
          path: ${{ runner.temp }}/worker-lifetimes-aggregate.json
          if-no-files-found: error
          retention-days: 3
