            const missing = spec.newFixtures.filter(fixture => !existsSync(orderBaselinePath(root, fixture)));
            for (const fixture of spec.newFixtures)
              assert.ok(entries.includes(join(root, fixture)), "fixture absent from canonical inventory: " + fixture);
            if (missing.length > 0) {
              const answers = JSON.parse(execute("generate-baselines", process.execPath,
                ["--import", "tsx", "--input-type=module", "--eval", "import { join } from \"node:path\";\nimport { pathToFileURL } from \"node:url\";\nconst root = process.cwd();\nconst { checkPreflightTs7 } = await import(pathToFileURL(join(root, \"packages/compiler/src/frontend/program-node.ts\")));\nconst { Ts7Host } = await import(pathToFileURL(join(root, \"packages/compiler/src/frontend/ts7/program-adapter.ts\")));\nconst rel = value => value.replaceAll(\"\\\\\", \"/\").split(root.replaceAll(\"\\\\\", \"/\") + \"/\").join(\"<repo>/\");\nconst host = new Ts7Host();\ntry {\n  const answers = process.argv.slice(1).map(fixture => {\n    const answer = checkPreflightTs7(join(root, fixture), host);\n    return { fixture, baseline: { order: answer.moduleOrder.map(rel),\n      diags: answer.diags.map(d => ({ ...d, message: rel(d.message), loc: { ...d.loc, file: rel(d.loc.file) } })) } };\n  });\n  console.log(JSON.stringify(answers));\n} finally { host.close(); }\n", ...missing], 240));
              assert.deepEqual(answers.map(answer => answer.fixture), missing);
