name: Qualify typed local JavaScript declaration sidecars

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/qualify-typed-local-js-sidecars.yml]

permissions:
  contents: read

concurrency:
  group: qualify-typed-local-js-sidecars
  cancel-in-progress: false

jobs:
  typed_local_js:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: 523633e0012d5282bd711c399d8e02ada35f752a
          persist-credentials: false
      - name: Verify source before setup
        run: |
          test "$(git rev-parse HEAD)" = 523633e0012d5282bd711c399d8e02ada35f752a
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: ./.github/actions/llvm-linux
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zig
      - uses: ./.github/actions/native-packages
        with:
          target: linux-x64-gnu
      - name: Disable piped core dumps
        run: sudo sysctl -w kernel.core_pattern=core
