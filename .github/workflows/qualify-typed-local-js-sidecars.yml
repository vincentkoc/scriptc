271757de51163bc83c31a3d732b026e1"},"units":["packages/compiler/src/frontend/project-sidecars.test.ts","packages/compiler/src/frontend/resolve.test.ts","packages/compiler/src/frontend/program.test.ts","packages/compiler/src/frontend/input-tracker.test.ts","packages/compiler/src/frontend/services.test.ts","packages/compiler/src/frontend/ts7/program-host.test.ts","packages/compiler/test/ts7/program-adapter.test.ts","packages/compiler/test/ts7/resolver-parity.test.ts","packages/compiler/src/frontend/source-phase-imports.test.ts"],"newFixtures":["tests/corpus/typed-local-js-sidecars/main.ts"],"orderFixtures":["tests/fixtures/npm/cases/dynamic-import-local/main.ts"],"corpus":["typed-local-js-sidecars/main.ts"],"formatFiles":["packages/compiler/src/frontend/program-node.ts","packages/compiler/src/frontend/program.ts","packages/compiler/src/frontend/project-sidecars.test.ts","packages/compiler/src/frontend/project-sidecars.ts","packages/compiler/src/frontend/resolve.test.ts","packages/compiler/src/frontend/resolve.ts","packages/compiler/src/frontend/source-phase-imports.test.ts","packages/compiler/src/frontend/ts7/program-host.ts","tests/harness/self-hosting-frontend-program.test.ts"]}, root = process.cwd(), out = join(process.env.RUNNER_TEMP, "typed-local-js-proof");
          mkdirSync(out, { recursive: true });
          const hash = path => createHash("sha256").update(readFileSync(path)).digest("hex");
          const scrub = value => String(value).split(root).join("<repo>").split(process.env.RUNNER_TEMP).join("<temp>");
          const report = { source: spec.head, workflow: process.env.GITHUB_SHA, runId: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
            status: "running", completeSuite: false, startedAt: new Date().toISOString(), steps: [], groups: [], generatedBaselines: {} };
          const save = () => writeFileSync(join(out, "summary.json"), scrub(JSON.stringify(report, null, 2)) + "\n");
          let sequence = 0;
          const execute = (name, command, args, seconds = 600, env = {}) => {
            const stem = String(++sequence).padStart(2, "0") + "-" + name, start = Date.now();
            const result = spawnSync("timeout", ["--signal=TERM", "--kill-after=5s", seconds + "s", command, ...args],
              { cwd: root, env: { ...process.env, ...env }, encoding: "utf8", maxBuffer: 8 * 1024 * 1024 });
            for (const channel of ["stdout", "stderr"]) writeFileSync(join(out, stem + "." + channel + ".log"), scrub(result[channel] ?? ""));
            report.steps.push({ name, command, args, seconds: (Date.now() - start) / 1000, limitSeconds: seconds,
