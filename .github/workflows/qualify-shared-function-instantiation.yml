                "closes nested structural types and index-signature values",
                "boxed child values retain native stdio classes through recursive storage",
                "preserves typed function bodies when other functions box classes",
                "discovers dispatch sites added during a later reachability pass",
                "shares method dispatch while preserving source error labels and callback evaluation order",
                "known class property bags preserve one owned receiver without boxing",
                "unknown receivers keep checked class property dispatch",
                "read-only class bags are never stored; a settled prototype bag is made per read",
                "the untyped read-only bag selects classes as the bag dispatch does, without storing",
                "normalizes base capsules before dispatching each derived member once",
                "class branches read their exact class's bag, also for classes with subclasses",
                "records a class's bag initializer only when all its class-table branches agree",
                "every collection of the lowerer is journaled, checked or left out by name",
                "every scalar field of the lowerer is journaled or left out by name",
                "every name the lists hold is a field of the lowerer",
                "a map table hands over the entries added after a size",
