              assert.equal(expectedStdout, digest("island true original replacement false\nprivate private-original private-replacement\nnative replacement private-replacement\nsaved false original replacement\ndiamond replacement\nclass 7 null\n")); assert.equal(item.expectedStdoutSha256, expectedStdout);
