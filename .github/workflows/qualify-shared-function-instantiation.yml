                execution?.attempted === true && !execution.error &&
                !["SIGKILL", "SIGTERM", "SIGHUP", "SIGINT"].includes(execution.signal) &&
                ![129, 130, 137, 143].includes(execution.code) &&
                ["completed", "nonzero-exit", "signal"].includes(execution.status) && Boolean(execution.parityOutcome);
            });
          const verifyGateData = (spec, data, collection) => {
            assert.ok(Array.isArray(data.testResults));
            const fileOf = value => {
              const matches = spec.files.filter(file => value === file || value.endsWith("/" + file));
              assert.equal(matches.length, 1, "unexpected test file: " + value); return matches[0];
            };
            const rows = data.testResults.flatMap(suite => suite.assertionResults.map(row => {
              assert.ok(Array.isArray(row.ancestorTitles) && typeof row.title === "string");
              // Vitest list uses " > "; the JSON reporter's fullName uses spaces.
              return { file: fileOf(suite.name), name: row.fullName, status: row.status,
                collectedName: [...row.ancestorTitles, row.title].join(" > ") };
            }));
            assert.deepEqual([...new Set(data.testResults.map(suite => fileOf(suite.name)))].sort(), [...spec.files].sort());
            const executed = rows.filter(row => !["pending", "skipped", "todo"].includes(row.status));
            let selected;
            if (spec.collect) {
              assert.ok(Array.isArray(collection) && collection.length > 0, "empty collection");
