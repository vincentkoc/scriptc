              "fixtureSource": "ffed371753d0124f8482b69540f58a37d43bb903",
              "transform": "instantiate test.each row order=island-first root=main; no source rewrite",
              "islands": [
                "island.mjs"
              ],
              "files": {
                "package.json": "{\"type\":\"module\",\"scriptc\":{\"nodeIslands\":{\"auto\":false,\"modules\":[\"island.mjs\"]}}}",
                "main.mjs": "import { checkSaved } from \"./island.mjs\";\nimport { choose, choosePrivate, make } from \"./helper.mjs\";\nimport { read } from \"./observer.mjs\";\nconsole.log(\"native\", choose(), choosePrivate());\ncheckSaved();\nconsole.log(\"diamond\", read());\nconsole.log(\"class\", make().read(), make());\n\n",
                "helper.mjs": "export function choose() {\n  choose = () => \"replacement\";\n  return \"original\";\n}\nfunction hidden() {\n  hidden = () => \"private-replacement\";\n  return \"private-original\";\n}\nexport function choosePrivate() { return hidden(); }\nclass Box { read() { return 7; } }\nexport function make() {\n  make = () => null;\n  return new Box();\n}\n",
                "island.mjs": "import { choose, choosePrivate } from \"./helper.mjs\";\nconst original = choose;\nconsole.log(\"island\", original === choose, original(), choose(), original === choose);\nconsole.log(\"private\", choosePrivate(), choosePrivate());\nexport function checkSaved() {\n  console.log(\"saved\", original === choose, original(), choose());\n}\n",
                "observer.mjs": "import { choose } from \"./helper.mjs\";\nexport function read() { return choose(); }\n"
              },
              "expected": "island true original replacement false\nprivate private-original private-replacement\nnative replacement private-replacement\nsaved false original replacement\ndiamond replacement\nclass 7 null\n",
              "fixtureDefinitionSha256": "68ecca08b7c3d82c9ad104d52e4d8d546171ac5f5befd9d58fc0b69e61974aaf"
            }
          ];
          const gateSpecs = [
            {
              "id": "lint",
              "args": [
                "lint"
              ],
              "seconds": 300
            },
            {
              "id": "format",
              "args": [
                "format:check"
              ],
              "seconds": 300
            },
            {
              "id": "units",
              "args": [
                "exec",
                "vitest",
                "run",
                "packages/compiler/src/frontend/lowering/deferred-module-initializers.test.ts",
                "tests/harness/node-island-shared-sources.test.ts",
                "packages/compiler/src/frontend/lowering/lower-modules.test.ts",
                "packages/compiler/src/frontend/lowering/class-dynamic-dispatch.test.ts",
                "packages/compiler/src/frontend/lowering/unit-journal.test.ts"
              ],
              "seconds": 300,
              "tests": [
                "materializes many demanded registries without a whole-program scan per action",
                "finds replaced blocks and references appended to an existing body in a later wave",
                "reuses the scan of an unchanged body while only bindings are pending",
                "indexes new subtrees for other demanded initializers in the same pass",
                "does not index a materialized subtree with no live insertion point",
                "fills every empty copy with the exact file and span while preserving populated blocks",
                "reports the functions whose placeholders it fills",
                "an update or an assignment of the binding demands its initializer",
                "a specifier in a comment of island code shares nothing",
                "a shared module's source stays out of the shipped tree",
                "retains dependencies from function storage, captures, generator channels and globals",
                "retains a constructible grandchild through an unused intermediate class",
