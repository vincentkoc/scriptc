              const item = summary.cases[0];
              assert.deepEqual(item.markedIslands, markedIslands); assert.equal(item.fixtureSource, heads.candidate);
              assert.equal(item.fixtureDefinitionSha256, "68ecca08b7c3d82c9ad104d52e4d8d546171ac5f5befd9d58fc0b69e61974aaf");
              assert.equal(item.transform, "instantiate test.each row order=island-first root=main; no source rewrite");
