              assert.deepEqual(selected.filter(row => row.file === file).map(row => row.name).sort(), [...names].sort(), "required unit inventory changed");
            return { tests: selected, executedCount: executed.length,
              fileCounts: Object.fromEntries(spec.files.map(file => [file, selected.filter(row => row.file === file).length])) };
          };
          const loweringFiles = ["results.json", "main.mjs/audit.json", "main.mjs/base.ir.json", "main.mjs/base.state.json",
