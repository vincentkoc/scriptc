              const key = row => row.file + "\u0000" + ("collectedName" in row ? row.collectedName : row.name);
              assert.equal(new Set(inventory.map(key)).size, inventory.length, "duplicate collected test");
              assert.deepEqual([...new Set(inventory.map(row => row.file))].sort(), [...spec.files].sort());
              assert.deepEqual(rows.map(key).sort(), inventory.map(key).sort(), "collected/run inventory mismatch");
              assert.equal(executed.length, inventory.length, "unit skipped or missing");
