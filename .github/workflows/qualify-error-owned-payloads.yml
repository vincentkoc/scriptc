name: Qualify Error owned payloads

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/qualify-error-owned-payloads.yml]

permissions:
  contents: read

concurrency:
  group: qualify-error-owned-payloads-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 9d2ab51cfabf5f0eeba10c4f8c8f265ad5c3c2d3

jobs:
  ownership:
    if: github.repository == 'vincentkoc/scriptc'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    env:
      SCRIPTC_TEST_WORKERS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 3
          persist-credentials: false
      - name: Verify exact candidate
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^)" = "de76c23436d36ad703fd385a4b8d1fdb98e19efc"
          test "$(git rev-parse HEAD^^)" = "8b9f7981e9198831474bbbe2eb47c48407daa380"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
