name: Qualify published message operations on Darwin

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/qualify-message-operations-darwin.yml]

permissions:
  contents: read

concurrency:
  group: qualify-message-operations-darwin
  cancel-in-progress: false

jobs:
  message_operations:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vercel-labs/scriptc
          ref: 9f099228ba180c9a8d42cbadcf27d176f1c5fa0e
          persist-credentials: false
      - name: Apply the exact uncommitted candidate
        run: |
          test "$(git rev-parse HEAD)" = 9f099228ba180c9a8d42cbadcf27d176f1c5fa0e
          git diff --exit-code HEAD
          python3 - <<'PATCH'
          import base64, hashlib, subprocess
          data = base64.b64decode("", validate=True)
          assert hashlib.sha256(data).hexdigest() == "4c137b52d376873ec8c572d40d1776104a82c7c7b60c468916e4722895a24eff"
          subprocess.run(["git", "apply", "--check", "-"], input=data, check=True)
          subprocess.run(["git", "apply", "-"], input=data, check=True)
          PATCH
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/native-packages
        with:
          target: darwin-arm64
      - run: pnpm build
      - name: Verify regression, ownership, frontend baseline, and siblings
        run: |
          cat > "$RUNNER_TEMP/message-proof.mjs" <<'PROOF'
          import { spawnSync, execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync, copyFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { join } from "node:path";
          const root=process.cwd(), temp=process.env.RUNNER_TEMP;
          const head="9f099228ba180c9a8d42cbadcf27d176f1c5fa0e";
          const manifest={"CHANGELOG.md":"801073368e25ce010dd56a513e5d736d48e562b91aaf21bf6339ad8a0e31aaa4","packages/runtime/src/scr_message.c":"12b7d3d7f7317cad6f3ee6ae8f5029737bff48961f959f0571d1c3484bb276bf","packages/runtime/src/scr_message.test.c":"440b40ff81d88535df02be5343e0ea9e5654b180a1a24b258c776449b2c5d022","packages/runtime/src/scr_message.test.ts":"55b354dedccd6a16dab664c83cbaed007c0b14c6cefeff2256dd2c5b867b8dcf","tests/corpus/native-worker-published-members.ts":"f8989aef5c614e98a14d5ab2c73ff00b73c1542a6e720f00164c74c1a715f0e0"}, tracked=["CHANGELOG.md","packages/runtime/src/scr_message.c","packages/runtime/src/scr_message.test.c","packages/runtime/src/scr_message.test.ts"];
          const fixture="tests/corpus/native-worker-published-members.ts";
          const baseline="packages/compiler/test/ts7/baselines/order-parity/"+fixture+".json";
          const report={head,patchSha256:"4c137b52d376873ec8c572d40d1776104a82c7c7b60c468916e4722895a24eff",workflow:process.env.GITHUB_SHA,node:process.version,platform:process.platform,arch:process.arch,status:"running",steps:[],flavors:[]};
          const summary=join(temp,"message-summary.json");
          const hash=data=>createHash("sha256").update(data).digest("hex");
          const scrub=text=>String(text).split(root).join("<repo>").split(temp).join("<temp>");
          const save=()=>writeFileSync(summary,JSON.stringify(report,null,2)+"\n");
          const git=args=>execFileSync("git",args,{encoding:"utf8"}).trim();
          const verify=()=>{
            if(git(["rev-parse","HEAD"])!==head)throw Error("source head changed");
            for(const [file,expected] of Object.entries(manifest))
              if(hash(readFileSync(file))!==expected)throw Error("source hash changed: "+file);
            if(JSON.stringify(git(["diff","--name-only","HEAD"]).split("\n").sort())!==JSON.stringify([...tracked].sort()))throw Error("unexpected tracked source changes");
            const extras=git(["ls-files","--others","--exclude-standard"]).split("\n").filter(Boolean);
            if(extras.some(p=>p!==fixture&&p!==baseline))throw Error("unexpected untracked source: "+extras.join(", "));
          };
          const run=(label,args,extra={})=>{
            console.log("START "+label);
            const result=spawnSync("pnpm",args,{cwd:root,env:{...process.env,SCRIPTC_TEST_WORKERS:"2",SCRIPTC_NO_CACHE:"1",SCRIPTC_SAN:"",ASAN_OPTIONS:"detect_leaks=0",...extra},encoding:"utf8",timeout:600000,maxBuffer:16*1024*1024});
            report.steps.push({label,code:result.status,signal:result.signal,error:result.error?.message,stdout:scrub(result.stdout??"").slice(-1500),stderr:scrub(result.stderr??"").slice(-1500)});
            save(); console.log("DONE "+label+" exit="+result.status); return result;
          };
          const pass=(label,args,extra)=>{
            const r=run(label,args,extra);
            if(r.status!==0||r.error||r.signal)throw Error(label+" failed");
          };
          const active=data=>data.testResults.flatMap(s=>s.assertionResults).filter(t=>!["pending","skipped","todo"].includes(t.status));
          const testFile="packages/runtime/src/scr_message.test.ts";
          const corpus=["native-worker-published-members.ts","native-worker-publish-classes.ts","native-worker-published-graphs.ts","worker-class-instance-clone.ts","5793-worker-message-channel.ts","5802-broadcast-channel-workers.ts","5803-worker-environment-data.ts","7139-message-typed-records.ts","7360-worker-typed-records.ts"].sort();
          const escape=s=>s.replace(/[.*+?^{}()|[\]\\$]/g,"\\$&");
          save();
          try {
            verify();
            if(process.version!=="v"+readFileSync(".node-version","utf8").trim())throw Error("wrong Node oracle");
            const runtime="packages/runtime/src/scr_message.c", patched=readFileSync(runtime);
            try {
              writeFileSync(runtime,execFileSync("git",["show",head+":"+runtime]));
              const r=run("unfixed C regression",["test",testFile,"--reporter=json","--outputFile="+join(temp,"message-negative.json")]);
              const data=JSON.parse(readFileSync(join(temp,"message-negative.json"),"utf8")), tests=active(data);
              const failure=tests.flatMap(t=>t.failureMessages).join("\n");
              if(r.status!==1||r.error||r.signal||data.success||tests.length!==1||tests[0].status!=="failed"||!failure.includes("check_published_operations")||!failure.includes("value->v.num == 7"))throw Error("negative control did not reproduce expected assertion");
              report.negativeControl={status:"expected failure",assertion:"published array operation missing after sender exit"};
            } finally {writeFileSync(runtime,patched);}
            verify();
            pass("fixed C regression",["test",testFile,"--reporter=json","--outputFile="+join(temp,"message-positive.json")]);
            const positive=JSON.parse(readFileSync(join(temp,"message-positive.json"),"utf8")), tests=active(positive);
            if(!positive.success||tests.length!==1||tests[0].status!=="passed")throw Error("fixed C coverage missing");
            report.cRegression={status:"passed",sanitizers:["address","undefined"],rcAudit:true};
            // Use the canonical frontend and normalization for this one new baseline.
            const generator=[
              'import { checkPreflightTs7 } from "./packages/compiler/src/frontend/program-node.ts";',
              'import { Ts7Host } from "./packages/compiler/src/frontend/ts7/program-adapter.ts";',
              'import { allOrderEntries, orderBaselinePath } from "./scripts/ts7-order-fixtures.mjs";',
              'import { writeFileSync, mkdirSync } from "node:fs";',
              'import { join, dirname } from "node:path";',
              'const root=process.cwd(), fixture='+JSON.stringify(fixture)+';',
              'const rel=s=>s.replaceAll("\\\\","/").split(root.replaceAll("\\\\","/")+"/").join("<repo>/");',
              'const host=new Ts7Host(); try {',
              'const a=checkPreflightTs7(join(root,fixture),host); if(a.diags.length)throw Error(JSON.stringify(a.diags));',
              'const b={order:a.moduleOrder.map(rel),diags:a.diags.map(d=>({...d,message:rel(d.message),loc:{...d.loc,file:rel(d.loc.file)}}))};',
              'const path=orderBaselinePath(root,fixture);mkdirSync(dirname(path),{recursive:true});writeFileSync(path,JSON.stringify(b,null,1)+"\\n");',
              'const all=allOrderEntries(root),index=all.indexOf(join(root,fixture));if(index<0)throw Error("fixture missing");',
              'console.log(JSON.stringify({first:rel(all[Math.floor(index/20)*20]).replace(/^<repo>\\//,""),count:Math.min(20,all.length-Math.floor(index/20)*20)}));',
              '} finally {host.close();}',
            ].join("\n");
            const generated=spawnSync(process.execPath,["--import","tsx","--input-type=module","-e",generator],{cwd:root,env:process.env,encoding:"utf8",timeout:240000,maxBuffer:8*1024*1024});
            if(generated.status!==0||generated.error||generated.signal)throw Error("baseline generation failed: "+scrub(generated.stderr));
            const batch=JSON.parse(generated.stdout);
            pass("baseline completeness",["test:ts7","--baselines-only"]);
            pass("order parity",["test","packages/compiler/test/ts7/order-parity.test.ts","-t",escape(batch.first)+" …","--reporter=json","--outputFile="+join(temp,"message-order.json")],{SCRIPTC_TS7_ALL:"1"});
            const order=JSON.parse(readFileSync(join(temp,"message-order.json"),"utf8"));
            if(!order.success||active(order).length!==1||active(order)[0].status!=="passed")throw Error("order batch missing");
            report.orderParity={first:batch.first,entries:batch.count,status:"passed",baselineSha256:hash(readFileSync(baseline))};
            copyFileSync(baseline,join(temp,"native-worker-published-members.ts.json"));
            pass("lint",["lint"]); pass("format",["format:check"]);
            const pattern="("+corpus.map(escape).join("|")+")$";
            for(const flavor of ["plain","san"]) {
              const file=join(temp,"message-"+flavor+".json");
              const outcome=run("worker corpus "+flavor,["test","tests/harness/differential.test.ts","-t",pattern,"--reporter=json","--outputFile="+file],{SCRIPTC_SAN:flavor==="san"?"1":""});
              const data=JSON.parse(readFileSync(file,"utf8")), cases=active(data);
              report.flavors.push({flavor,success:data.success,cases:cases.map(t=>({name:t.fullName,status:t.status,failures:t.failureMessages.map(scrub)}))});
              const names=cases.map(t=>corpus.find(n=>t.fullName.endsWith(" "+n))).sort();
              if(outcome.status!==0||outcome.error||outcome.signal||!data.success||cases.some(t=>t.status!=="passed")||JSON.stringify(names)!==JSON.stringify(corpus))throw Error("corpus coverage failed: "+flavor);
            }
            report.status="passed";
          } catch(error) {report.error=scrub(error);process.exitCode=1;}
          finally {
            try {verify();report.sourceVerifiedAfter=true;} catch(error){report.status="failed";report.sourceError=scrub(error);process.exitCode=1;}
            if(report.status!=="passed")report.status="failed";
            save();console.log(JSON.stringify(report));
            if(process.exitCode)console.error("[scriptc-message-proof] FAILED (exit 1)");
          }
          PROOF
          node "$RUNNER_TEMP/message-proof.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: darwin-message-operations-proof
          path: |
            ${{ runner.temp }}/message-summary.json
            ${{ runner.temp }}/native-worker-published-members.ts.json
          if-no-files-found: error
          retention-days: 1
