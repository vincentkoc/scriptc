name: Qualify release library cross-targets

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact integration source commit
        type: string
        required: true
        default: 2c4a6299f3bacf38677d96b645398f770ea41306

permissions:
  contents: read

concurrency:
  group: library-cross-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  cross_library:
    if: github.repository == 'vincentkoc/scriptc'
    runs-on: macos-15
    timeout-minutes: 75
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: candidate/.node-version
      - name: Prepare exact-source proof and admit capacity
        run: |
          mkdir "$RUNNER_TEMP/library-cross-proof"
          cat > "$RUNNER_TEMP/library-cross-proof/runner.mjs" <<'RUNNER'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { execFileSync, spawn, spawnSync } from "node:child_process";
          import { closeSync, copyFileSync, existsSync, lstatSync, mkdirSync, openSync, readdirSync, readFileSync, readlinkSync, realpathSync, rmSync, statSync, writeFileSync, writeSync } from "node:fs";
          import { join, relative } from "node:path";
          import { fileURLToPath } from "node:url";
          import { setTimeout as delay } from "node:timers/promises";
          const out = join(process.env.RUNNER_TEMP, "library-cross-proof");
          const packs = ["linux-arm64-gnu", "linux-x64-gnu", "linux-arm64-musl", "linux-x64-musl", "win32-x64-msvc", "darwin-x64"];
          const targets = ["aarch64-linux-gnu.2.36", "x86_64-linux-gnu.2.36", "aarch64-linux-musl", "x86_64-linux-musl", "x86_64-windows-gnu", "x86_64-macos"];
          const digest = bytes => createHash("sha256").update(bytes).digest("hex");
          const save = (name, value) => writeFileSync(join(out, name), JSON.stringify(value, null, 2) + "\n");
          const json = name => JSON.parse(readFileSync(name.startsWith("/") ? name : join(out, name), "utf8"));
          const capture = (cmd, args) => execFileSync(cmd, args, { encoding: "utf8", maxBuffer: 8 * 1024 * 1024, timeout: 30000 }).trim();
          function source() {
            const hash = createHash("sha256");
            const paths = capture("git", ["ls-files", "-z"]).split("\0").filter(Boolean).sort();
            for (const path of paths) {
              const symlink = lstatSync(path).isSymbolicLink();
              const bytes = symlink ? Buffer.from(readlinkSync(path)) : readFileSync(path);
              hash.update(path + "\0" + (symlink ? "link" : "file") + "\0" + digest(bytes) + "\0");
            }
            assert.equal(capture("git", ["status", "--porcelain", "--untracked-files=no"]), "");
            return { head: capture("git", ["rev-parse", "HEAD"]), tree: capture("git", ["rev-parse", "HEAD^{tree}"]), filesSha256: hash.digest("hex"), files: paths.length };
          }
          const self = fileURLToPath(import.meta.url), root = process.cwd();
          const work = join(process.env.RUNNER_TEMP, "library-cross-work");
          const owner = { workflow: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, source: process.env.SOURCE_SHA, platform: process.platform };
          const CAP = 16 * 1024 * 1024;
          const hash = path => digest(readFileSync(path));
          const record = path => ({ path: relative(out, path), bytes: statSync(path).size, sha256: hash(path) });
          function verifyWorkOwner() {
            const st = lstatSync(work);
            assert.ok(st.isDirectory() && !st.isSymbolicLink());
            assert.equal(st.mode & 0o777, 0o700);
            assert.deepEqual(json(join(work, "owner.json")), owner);
          }
          function files(base,prefix=""){return readdirSync(base,{withFileTypes:true}).sort((a,b)=>a.name.localeCompare(b.name)).flatMap(item=>{const p=join(base,item.name),name=prefix+item.name,st=lstatSync(p);assert.ok(!st.isSymbolicLink());if(st.isDirectory())return files(p,name+"/");assert.ok(st.isFile());return [{path:name,bytes:st.size,sha256:hash(p)}];});}
          function tool(command,args=["--version"]){const path=realpathSync(capture("/bin/sh",["-c",'command -v "$1"',"identity",command]));const result=spawnSync(command,args,{encoding:"utf8",timeout:30000,maxBuffer:CAP});assert.equal(result.error,undefined);assert.equal(result.status,0);return {path,sha256:hash(path),version:(result.stdout+result.stderr).trim()};}
          function groupMembers(group) {
            assert.ok(Number.isInteger(group) && group > 1 && group !== process.pid);
            const lines = capture("/bin/ps", ["-axo", "pid=,ppid=,pgid=,stat="]).split("\n");
            return lines.filter(Boolean).map(line => {
              const [pid, ppid, pgid, state] = line.trim().split(/\s+/);
              return { pid: Number(pid), ppid: Number(ppid), pgid: Number(pgid), state };
            }).filter(row => row.pgid === group);
          }
          async function runOwned(label, command, args, seconds, env = {}) {
            const stdoutPath = join(out, label + ".stdout.log"), stderrPath = join(out, label + ".stderr.log");
            const sinks = [stdoutPath, stderrPath].map(path => ({ fd: openSync(path, "wx"), bytes: 0, retained: 0, hash: createHash("sha256") }));
            const ready = join(work, label + ".ready"), permit = join(work, label + ".permit");
            const childEnv = { ...env, DIAGNOSTIC_READY: ready, DIAGNOSTIC_PERMIT: permit };
            for (const key of ["GH_TOKEN", "GITHUB_TOKEN", "NODE_AUTH_TOKEN", "NODE_OPTIONS", "NODE_CHANNEL_FD", "NODE_CHANNEL_SERIALIZATION_MODE", "OPENCLAW_CLI_RESPAWN_PARENT", "SCRIPTC_CC", "SCRIPTC_TARGET", "SCRIPTC_NO_CACHE", "SCRIPTC_LIBNODE", "SCRIPTC_LLVM_HELPER", "SCRIPTC_LLVM_TEST_MODE", "SCRIPTC_TEST_SHARD", "SCRIPTC_TEST_OPTIMIZATION", "CC", "CXX"]) delete childEnv[key];
            if (env.SCRIPTC_LIBNODE) { assert.equal(env.SCRIPTC_LIBNODE, process.env.SCRIPTC_LIBNODE); assert.ok(env.SCRIPTC_LIBNODE.startsWith("/")); childEnv.SCRIPTC_LIBNODE = env.SCRIPTC_LIBNODE; }
            const started = Date.now();
            const ownerPath = join(out, label + ".owner.json");
            // Reserve custody before spawning; a failed PID update leaves a marker that forbids cleanup.
            writeFileSync(ownerPath, JSON.stringify({ spawned: false, parent: process.pid, admitted: false }) + "\n");
            const child = spawn(process.execPath, [self, "--child", command, ...args], { cwd: root, env: childEnv, detached: true, stdio: ["ignore", "pipe", "pipe"] });
            const result = { status: "starting", code: null, signal: null, pid: child.pid ?? null, elapsedMs: 0, drained: false, storageComplete: true, forcedCleanup: false, groupSnapshots: [] };
            let exited = false, closed = false, launchError = null, stopReason = null;
            child.once("close", () => { closed = true; });
            child.once("error", error => { launchError = String(error); exited = true; });
            child.once("exit", (code, signal) => { exited = true; result.code = code; result.signal = signal; });
            for (const [index, stream] of [child.stdout, child.stderr].entries()) stream.on("data", bytes => {
              const sink = sinks[index]; sink.bytes += bytes.length;
              try {
                sink.hash.update(bytes);
                const keep = bytes.subarray(0, Math.max(0, CAP - sink.retained));
                if (keep.length) { writeAll(sink.fd, keep); sink.retained += keep.length; }
                if (sink.bytes > CAP) { result.storageComplete = false; stopReason = "diagnostic-storage-limit"; }
              } catch {
                result.storageComplete = false; stopReason = "diagnostic-storage-error";
              }
            });
            const interrupted = () => { stopReason = "interrupted"; };
            process.on("SIGTERM", interrupted); process.on("SIGINT", interrupted);
            try {
              if (Number.isInteger(child.pid) && child.pid > 1 && child.pid !== process.pid) {
                writeFileSync(ownerPath, JSON.stringify({ pid: child.pid, parent: process.pid, group: child.pid, admitted: false }) + "\n");
              }
              assert.ok(Number.isInteger(child.pid) && child.pid > 1 && child.pid !== process.pid, "no owned process group");
              for (let n = 0; n < 100 && !existsSync(ready) && !exited; n++) await delay(100);
              assert.ok(existsSync(ready) && !exited, "worker did not reach admission handshake");
              const members = groupMembers(child.pid);
              assert.ok(members.some(row => row.pid === child.pid && row.ppid === process.pid && row.pgid === child.pid), "detached process group identity mismatch");
              result.groupSnapshots.push({ phase: "admitted", members });
              writeFileSync(ownerPath, JSON.stringify({ pid: child.pid, parent: process.pid, group: child.pid, admitted: true }) + "\n");
              writeFileSync(permit, "go\n");
              const deadline = Date.now() + seconds * 1000;
              while (!exited && !stopReason && Date.now() < deadline) await delay(100);
              result.status = launchError ? "launcher-error" : stopReason ?? (!exited ? "timeout" : "exited");
              if (launchError) result.launchError = launchError;
            } catch (error) {
              result.status = "supervisor-error"; result.error = String(error);
            } finally {
              process.off("SIGTERM", interrupted); process.off("SIGINT", interrupted);
              if (Number.isInteger(child.pid) && child.pid > 1 && child.pid !== process.pid) {
                try {
                  let members = groupMembers(child.pid);
                  // Only this detached group is ours. Never signal a PID inferred from a process name.
                  if (members.length) {
                    result.forcedCleanup = true;
                    result.groupSnapshots.push({ phase: "before-term", members });
                    process.kill(-child.pid, "SIGTERM");
                    for (let n = 0; n < 50 && (members = groupMembers(child.pid)).length; n++) await delay(100);
                    if (members.length) {
                      result.groupSnapshots.push({ phase: "before-kill", members });
                      process.kill(-child.pid, "SIGKILL");
                      for (let n = 0; n < 50 && (members = groupMembers(child.pid)).length; n++) await delay(100);
                    }
                  }
                  result.groupSnapshots.push({ phase: "drained", members });
                  result.drained = members.length === 0;
                } catch (error) { result.drainError = String(error); }
              }
              for (let n = 0; n < 50 && !closed; n++) await delay(100);
              result.streamsClosed = closed;
              if (!closed) result.storageComplete = false;
              child.stdout.destroy(); child.stderr.destroy();
              for (const [index, sink] of sinks.entries()) {
                closeSync(sink.fd);
                result[index === 0 ? "stdout" : "stderr"] = { ...record([stdoutPath, stderrPath][index]), observedBytes: sink.bytes, observedSha256: sink.hash.digest("hex"), complete: result.storageComplete };
              }
              result.elapsedMs = Date.now() - started;
              save(label + ".process.json", result);
            }
            return result;
          }
          function writeAll(fd, bytes, write = writeSync) {
            let offset = 0;
            while (offset < bytes.length) {
              const count = write(fd, bytes, offset, bytes.length - offset);
              assert.ok(Number.isInteger(count) && count > 0 && count <= bytes.length - offset, "short capture write");
              offset += count;
            }
          }
          function requireSuccess(value) {
            for (const name of ["stdout", "stderr"]) {
              assert.ok(Number.isInteger(value[name].bytes) && value[name].bytes >= 0);
            assert.match(value[name].sha256, /^[0-9a-f]{64}$/);
            assert.match(value[name].observedSha256, /^[0-9a-f]{64}$/);
            assert.equal(value[name].complete, true);
              assert.equal(value[name].bytes, value[name].observedBytes);
              assert.equal(value[name].sha256, value[name].observedSha256);
            }
            assert.equal(value.status, "exited"); assert.equal(value.code, 0); assert.equal(value.signal, null);
            assert.equal(value.drained, true); assert.equal(value.storageComplete, true); assert.equal(value.streamsClosed, true); assert.equal(value.forcedCleanup, false);
          }


          function allDrained() {
            return readdirSync(out).filter(name => name.endsWith(".owner.json")).every(name => {
              const value = json(join(out, name)), path = join(out, name.replace(".owner.json", ".process.json"));
              if (!existsSync(path)) return false; const result = json(path);
              return value.admitted === true && value.pid > 1 && value.pid === value.group && result.pid === value.pid && result.drained === true &&
                result.streamsClosed === true && groupMembers(value.group).length === 0;
            });
          }

          async function childMain() {
            verifyWorkOwner(); writeFileSync(process.env.DIAGNOSTIC_READY, "ready\n");
            while (!existsSync(process.env.DIAGNOSTIC_PERMIT)) await delay(25);
            const child = spawn(process.argv[3], process.argv.slice(4), { cwd: root, stdio: "inherit" });
            child.once("error", error => { process.stderr.write(String(error)); process.exitCode = 1; });
            child.once("exit", (code, signal) => { if (signal) process.kill(process.pid, signal); else process.exitCode = code ?? 1; });
          }
          let report;
          function capacity(phase, gib = 16, inodes = 250000) {
            const rows = JSON.parse(capture("python3", ["-c", "import json,os; paths={'root':'/','workspace':os.getcwd(),'temp':os.environ['RUNNER_TEMP']}; print(json.dumps([dict(name=n,bytes=os.statvfs(p).f_bavail*os.statvfs(p).f_frsize,inodes=os.statvfs(p).f_favail) for n,p in paths.items()]))"]));
            report.capacity.push({ phase, minimumBytes: gib * 1024 ** 3, minimumInodes: inodes, rows });
            save("summary.json", report);
            assert.ok(rows.every(r => r.bytes >= gib * 1024 ** 3 && r.inodes >= inodes), "capacity admission failed: " + phase);
          }
          function environment(extra = {}) {
            const env = { ...process.env };
            for (const key of Object.keys(env)) if (key.startsWith("SCRIPTC_") || ["CC", "AR"].includes(key)) delete env[key];
            return { ...env, SCRIPTC_TEST_WORKERS: "1", ...extra };
          }
          async function run(label, cmd, args, seconds = 600, extra = {}) {
            verifyWorkOwner(); assert.ok(allDrained(), "previous process group still active");
            const remaining = Math.floor((report.deadline - Date.now() - 120000) / 1000);
            assert.ok(remaining > 0, "reserved drain/readback budget reached");
            const result = await runOwned(label, cmd, args, Math.min(seconds, remaining), environment(extra));
            report.commands.push({ label, ...result }); save("summary.json", report);
            requireSuccess(result);
          }
          function tools() {
            const llvm = join(capture("brew", ["--prefix", "llvm@22"]), "bin/llvm-config");
            const sdk = capture("xcrun", ["--show-sdk-path"]);
            return {
              node: tool(process.execPath), pnpm: tool("pnpm"), zig: tool("zig", ["version"]),
              llvm: tool(llvm), clang: tool("clang"), cmake: tool("cmake"), ninja: tool("ninja"),
              nm: tool("nm"), ld: tool("ld", ["-v"]),
              sdk: { path: sdk, version: capture("xcrun", ["--show-sdk-version"]), settingsSha256: hash(join(sdk, "SDKSettings.json")) },
              xcode: capture("xcodebuild", ["-version"]),
            };
          }
          function helper() {
            const path = "packages/llvm-darwin-arm64/bin/scriptc-llvm-codegen";
            return { sha256: digest(readFileSync(path)), version: JSON.parse(capture(path, ["version", "--format=json"])) };
          }
          async function verifyPacks(phase) {
            for (const pack of packs) await run("verify-" + phase + "-" + pack, process.execPath, ["packages/runtime-" + pack + "/scripts/verify.mjs"], 120);
          }
          function packHashes() {
            return Object.fromEntries(packs.map(pack => [pack, digest(readFileSync("packages/runtime-" + pack + "/runtime-pack.json"))]));
          }
          if (process.argv[2] === "--child") await childMain();
          else try {
            const mode = process.argv[2];
            if (mode === "init") {
              assert.match(process.env.SOURCE_SHA, /^[a-f0-9]{40}$/);
              assert.equal(process.platform, "darwin"); assert.equal(process.arch, "arm64");
              report = { source: process.env.SOURCE_SHA, workflow: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT, scope: "release cross-target library symbol, ambient and link contracts", commands: [], capacity: [], passed: false };
              report.sourceBefore = source(); assert.equal(report.sourceBefore.head, report.source);
              report.runnerSha256 = digest(readFileSync(join(out, "runner.mjs")));
              report.deadline = Date.now() + 65 * 60 * 1000;
              mkdirSync(work, { mode: 0o700 }); writeFileSync(join(work, "owner.json"), JSON.stringify(owner), { flag: "wx", mode: 0o600 });
              capacity("pre-llvm", 32, 1000000);
            } else {
              report = json("summary.json"); verifyWorkOwner(); assert.ok(allDrained(), "owned process closure unresolved");
              assert.equal(digest(readFileSync(join(out, "runner.mjs"))), report.runnerSha256);
              if (mode === "prepare") {
                capacity("post-llvm", 16, 500000);
                report.toolsBefore = tools();
                assert.equal(report.toolsBefore.node.version, "v" + readFileSync(".node-version", "utf8").trim());
                assert.equal(report.toolsBefore.pnpm.version, "11.1.3"); assert.equal(report.toolsBefore.zig.version, "0.16.0"); assert.equal(report.toolsBefore.llvm.version, "22.1.8");
                await run("install", "pnpm", ["install", "--frozen-lockfile"], 300);
                await run("workspace-build", "pnpm", ["build"], 600);
                capacity("before-helper");
                await run("helper-build", "pnpm", ["--filter", "@scriptc/llvm-darwin-arm64", "build:native"], 600);
                report.helper = helper();
                assert.equal(report.helper.version.llvm_version, "22.1.8"); assert.equal(report.helper.version.protocol_version, "1");
                for (const pack of packs) {
                  capacity("before-" + pack);
                  await run("build-" + pack, "pnpm", ["--filter", "@scriptc/runtime-" + pack, "build:native"], 1200, { SCRIPTC_BUILD_CROSS: "1" });
                  await run("verify-" + pack, process.execPath, ["packages/runtime-" + pack + "/scripts/verify.mjs"], 120);
                  const manifestPath = "packages/runtime-" + pack + "/runtime-pack.json";
                  assert.deepEqual(JSON.parse(readFileSync(manifestPath, "utf8")).runtime_abi, { version: 49, marker: "scr_runtime_abi_v49" });
                  copyFileSync(manifestPath, join(out, "runtime-" + pack + ".json"));
                }
                report.packsBefore = packHashes();
                report.prepared = true;
              } else if (mode === "test") {
                assert.equal(report.prepared, true); capacity("before-test");
                const resultPath = join(out, "tests.json");
                await run("library-cross", "pnpm", ["test", "tests/harness/library-cross.test.ts", "--reporter=verbose", "--reporter=json", "--outputFile=" + resultPath], 1200, { SCRIPTC_CROSS: "1" });
                const data = json("tests.json");
                assert.equal(data.success, true); assert.equal(data.numFailedTests, 0);
                const rows = data.testResults.flatMap(s => s.assertionResults);
                const fixtures = readdirSync("tests/library-mode").filter(name => existsSync(join("tests/library-mode", name, "profile.json"))).sort();
                assert.equal(fixtures.length, 20);
                for (const target of targets) {
                  const selected = rows.filter(r => r.ancestorTitles.includes("target " + target));
                  assert.equal(selected.length, fixtures.length);
                  assert.deepEqual(selected.map(r => r.title.split(":")[0]).sort(), fixtures);
                  assert.ok(selected.every(r => r.status === "passed" && r.failureMessages.length === 0));
                }
                assert.equal(rows.filter(r => r.title === "zig is on PATH" && r.status === "passed").length, 1);
                assert.ok(rows.every(r => ["passed", "pending", "skipped"].includes(r.status) && r.failureMessages.length === 0));
                report.tests = { required: 121, passed: data.numPassedTests, pending: data.numPendingTests, total: data.numTotalTests };
                report.testsAccepted = true;
              } else if (mode === "finalize") {
                assert.equal(report.prepared, true); await verifyPacks("after");
                assert.deepEqual(packHashes(), report.packsBefore); assert.deepEqual(helper(), report.helper);
                assert.deepEqual(tools(), report.toolsBefore); report.sourceAfter = source();
                assert.deepEqual(report.sourceAfter, report.sourceBefore);
                report.inputsVerifiedAfter = true;
                assert.equal(report.testsAccepted, true);
                assert.ok(allDrained()); verifyWorkOwner(); rmSync(work, { recursive: true });
                report.cleanup = { workRemoved: true }; report.passed = true;
              } else throw new Error("unknown runner mode");
              save("summary.json", report);
            }
          } catch (error) {
            if (report) { report.error = String(error.stack ?? error).replaceAll(process.cwd(), "<source>").replaceAll(process.env.RUNNER_TEMP, "<runner-temp>"); save("summary.json", report); }
            console.error(error); console.error("[library-cross] FAILED (exit 1)"); process.exitCode = 1;
          } finally {
            if (process.argv[2] === "finalize") save("artifact-manifest.json", files(out).filter(r => r.path !== "artifact-manifest.json"));
          }
          RUNNER
          node "$RUNNER_TEMP/library-cross-proof/runner.mjs" init
      - name: Install pinned LLVM
        run: |
          brew install llvm@22
          test "$( "$(brew --prefix llvm@22)/bin/llvm-config" --version )" = 22.1.8
          echo "LLVM_DIR=$(brew --prefix llvm@22)/lib/cmake/llvm" >> "$GITHUB_ENV"
      - uses: ./candidate/.github/actions/zig
      - name: Build exact-source helper and six runtime packs
        run: node "$RUNNER_TEMP/library-cross-proof/runner.mjs" prepare
      - name: Run the complete release library cross-target gate
        run: node "$RUNNER_TEMP/library-cross-proof/runner.mjs" test
      - name: Verify source, tools and all runtime packs after execution
        if: always()
        run: node "$RUNNER_TEMP/library-cross-proof/runner.mjs" finalize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-library-cross-proof
          path: ${{ runner.temp }}/library-cross-proof
          retention-days: 1
          if-no-files-found: error
