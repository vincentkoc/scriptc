name: Qualify remaining region sanitizer groups

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/qualify-region-san-remaining.yml]

permissions:
  contents: read

concurrency:
  group: qualify-region-san-remaining
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: 0e17511aaa44ede74b06d6483a0f802d30e7846e
          persist-credentials: false
      - name: Verify source before setup
        run: |
          test "$(git rev-parse HEAD)" = 0e17511aaa44ede74b06d6483a0f802d30e7846e
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: ./.github/actions/llvm-linux
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zig
      - uses: ./.github/actions/native-packages
        with:
          target: linux-x64-gnu
      - uses: ./.github/actions/native-packages
        with:
          target: wasm32-wasi
          helper: "false"
      - name: Archive verified native packages
        run: |
          mkdir -p "$RUNNER_TEMP/region-native"
          tar -czf "$RUNNER_TEMP/region-native/native.tar.gz" \
            packages/llvm-linux-x64-gnu/bin \
            packages/runtime-linux-x64-gnu/artifacts \
            packages/runtime-linux-x64-gnu/runtime-pack.json \
            packages/runtime-wasm32-wasi/artifacts \
            packages/runtime-wasm32-wasi/runtime-pack.json
          node --input-type=module <<'NATIVE'
          import { readFileSync,writeFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import { createHash } from "node:crypto";
          import { join } from "node:path";
          const head="0e17511aaa44ede74b06d6483a0f802d30e7846e",inputs={"packages/runtime/src/scr_region.c":"9f6c6ffac906d79c9c643a043cabdb117c5576cbc85190e174f2d863425fdf30","packages/runtime/src/scr_region.test.c":"a38ae232cab4b0526f65b3d57f6e946bc686d56353286b8e01b3b4839b03be34","packages/runtime/src/scr_region.test.ts":"3328b7dc3d2d80878574770f0fbbd41dbae11c3f09ba4e74a3ecdae1c17dc2a0","packages/compiler/src/backend/native/runtime-inputs.ts":"261d9462b2464d085d44f1c767e82adbbc3672c787b71c602de1046f3ccf45d8"};
          const git=(...args)=>execFileSync("git",args,{encoding:"utf8"}).trim();
          if(git("rev-parse","HEAD")!==head||git("status","--porcelain")!=="")throw Error("native build changed source");
          const hash=file=>createHash("sha256").update(readFileSync(file)).digest("hex");
          for(const [file,expected]of Object.entries(inputs))if(hash(file)!==expected)throw Error("source differs: "+file);
          const out=join(process.env.RUNNER_TEMP,"region-native");
          writeFileSync(join(out,"native.json"),JSON.stringify({head,inputs,runId:process.env.GITHUB_RUN_ID,workflow:process.env.GITHUB_SHA,node:process.version,archiveSha256:hash(join(out,"native.tar.gz")),sourceVerifiedAfter:true},null,2)+"\n");
          NATIVE
      - uses: actions/upload-artifact@v4
        with:
          name: region-san-native
          path: ${{ runner.temp }}/region-native
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  selected:
    needs: native
    name: ${{ matrix.id }}
