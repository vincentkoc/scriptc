            child.once("exit",(code,signal)=>{
             cleanup=drain().catch(error=>({groupDrained:false,groupError:String(error)}));
             cleanup.then(group=>{
              if(closed)return;
              // A descendant outside the drained group may still hold a captured pipe.
              // Bound observation too; keep unresolved ownership in the failed receipt.
              completionTimer=setTimeout(()=>{
               if(closed)return;
               child.stdout?.destroy();child.stderr?.destroy();
               finish(code,signal,{...group,groupDrained:false,pipeDrainIncomplete:true});
              },1000);
             });
            });
            child.once("close",async(code,signal)=>{
             closed=true;const group=await cleanup;finish(code,signal,group);
            });
           });
           report.steps.push({command,args,seconds:Math.round((Date.now()-start)/1000),code:result.code,signal:result.signal,timedOut:result.timedOut,cancelled:result.cancelled,scope,scopeDrained:result.scopeDrained,leftoverChildren:result.leftoverChildren,groupDrained:result.groupDrained});save();
           if(result.code!==0||result.signal||result.timedOut||result.cancelled||result.scopeDrained===false||result.cleanupErrors.length||result.spawnError||result.leftoverChildren||result.groupDrained===false)throw Error(command+" failed: "+JSON.stringify({...result,stdout:result.stdout.slice(-2000),stderr:result.stderr.slice(-2000)}));
           return result.stdout.trim();
          };

          const capture=(command,args)=>execute(command,args,{capture:true,timeoutMs:30_000});
          const expectedInputs={"packages/runtime/src/scr_region.c":"9f6c6ffac906d79c9c643a043cabdb117c5576cbc85190e174f2d863425fdf30","packages/runtime/src/scr_region.test.c":"a38ae232cab4b0526f65b3d57f6e946bc686d56353286b8e01b3b4839b03be34","packages/runtime/src/scr_region.test.ts":"3328b7dc3d2d80878574770f0fbbd41dbae11c3f09ba4e74a3ecdae1c17dc2a0","packages/compiler/src/backend/native/runtime-inputs.ts":"261d9462b2464d085d44f1c767e82adbbc3672c787b71c602de1046f3ccf45d8"};
          const source=async()=>{
           if(await capture("git",["rev-parse","HEAD"])!==head)throw Error("head differs");
           if(await capture("git",["status","--porcelain"])!=="")throw Error("source changed");
           for(const [file,expected]of Object.entries(expectedInputs))if(hash(file)!==expected)throw Error("input differs: "+file);
           report.inputs=expectedInputs;
          };
          const pending=t=>["skipped","todo"].includes(t.status);
          const emptyNames=id.endsWith("-self-hosting-llvm-emitter")
           ? ["emitter cases and programs","fixed point"].map(name=>"the complete LLVM emitter bootstraps natively (llvm) the complete LLVM emitter bootstraps natively (llvm): "+name)
           : id.endsWith("-three-js-library")
           ? ["dev","release"].map(mode=>"three.js native library three.js sends animated geometry, materials and resource lifecycle to a native host in "+mode)
           : null;
          save();
          try{
           await source();report.sourceVerifiedBefore=true;
           if(process.platform!=="linux"||process.arch!=="x64"||process.version!=="v24.22.0"||process.getuid()===0)throw Error("host or unprivileged Node pin differs");
           report.uid=process.getuid();
           report.capacity={memoryBytes:totalmem(),cores:cpus().length,swap:readFileSync("/proc/swaps","utf8"),cgroup:readFileSync("/proc/self/cgroup","utf8")};
           const swapKiB=report.capacity.swap.trim().split("\n").slice(1).reduce((sum,line)=>sum+Number(line.trim().split(/\s+/)[2]),0);
           if(totalmem()<14*1024**3||swapKiB<1024**2||!existsSync("/run/systemd/system"))throw Error("canonical memory/swap/systemd unavailable");
           report.tools={node:process.version,pnpm:await capture("pnpm",["--version"]),llvm:await capture("llvm-config",["--version"]),nm:await capture("llvm-nm",["--version"]),zig:await capture("zig",["version"])};
           if(report.tools.pnpm!=="11.1.3"||report.tools.llvm!=="22.1.8"||report.tools.zig!=="0.16.0"||!report.tools.nm.includes("22.1.8"))throw Error("tool pin differs");
           const native=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,"region-native","native.json"),"utf8"));
