      SCRIPTC_TEST_WORKERS: "4"
      SCRIPTC_SAN: "1"
      ASAN_OPTIONS: detect_leaks=0
      GROUP_ID: ${{ matrix.id }}
      PROOF_MINUTES: ${{ matrix.proof }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: 0e17511aaa44ede74b06d6483a0f802d30e7846e
          persist-credentials: false
      - name: Verify source before setup
        run: |
          test "$(git rev-parse HEAD)" = 0e17511aaa44ede74b06d6483a0f802d30e7846e
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: ./.github/actions/llvm-linux
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zig
      - uses: actions/download-artifact@v4
        with:
          name: region-san-native
          path: ${{ runner.temp }}/region-native
      - name: Verify and restore the native packages
        run: |
          node --input-type=module <<'RESTORE'
          import { readFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          const dir=process.env.RUNNER_TEMP+"/region-native";
          const receipt=JSON.parse(readFileSync(dir+"/native.json","utf8"));
          if(receipt.head!=="0e17511aaa44ede74b06d6483a0f802d30e7846e"||receipt.runId!==process.env.GITHUB_RUN_ID||receipt.workflow!==process.env.GITHUB_SHA||receipt.sourceVerifiedAfter!==true)throw Error("native artifact identity differs");
          if(createHash("sha256").update(readFileSync(dir+"/native.tar.gz")).digest("hex")!==receipt.archiveSha256)throw Error("native artifact hash differs");
          RESTORE
          tar -xzf "$RUNNER_TEMP/region-native/native.tar.gz"
          node packages/runtime-linux-x64-gnu/scripts/verify.mjs
          node packages/runtime-wasm32-wasi/scripts/verify.mjs
      - run: pnpm build
      - uses: ./.github/actions/libnode
      - name: Keep setup cache outside the source checkout
        run: |
          if [ -d .libnode-cache ]; then
            test ! -e "$RUNNER_TEMP/region-libnode-cache"
            mv .libnode-cache "$RUNNER_TEMP/region-libnode-cache"
          fi
      - name: Disable piped core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Run one canonical sanitizer group
        run: |
          cat > "$RUNNER_TEMP/region-san.mjs" <<'PROOF'
          import { spawn, spawnSync } from "node:child_process";
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync, existsSync, statSync } from "node:fs";
