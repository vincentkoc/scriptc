          import { join, relative } from "node:path";
          import { createHash } from "node:crypto";
          import { pathToFileURL } from "node:url";
          const head="0e17511aaa44ede74b06d6483a0f802d30e7846e",allowed=["san-3-case-sharded-corpus","san-3-cost-balanced-tests","san-3-fetch","san-3-npm-static","san-3-self-hosting-llvm-emitter","san-3-three-js-library","san-4-case-sharded-corpus","san-4-npm-static","san-4-self-hosting-llvm-emitter","san-4-self-hosting-serialization","san-4-surface-manifest","san-4-three-js-library"];
          const root=process.cwd(),id=process.env.GROUP_ID;
