          walk(root);
          const receipts=files.map(file=>({file,data:JSON.parse(readFileSync(file,"utf8"))}));
          if(JSON.stringify(receipts.map(r=>r.data.id).sort())!==JSON.stringify([...expected].sort()))throw Error("incomplete or duplicate selected group receipts");
          for(const {file,data}of receipts){
           if(data.head!==head||data.workflow!==process.env.GITHUB_SHA||data.runId!==process.env.GITHUB_RUN_ID||data.status!=="passed"||data.sourceVerifiedBefore!==true||data.sourceVerifiedAfter!==true||data.result.success!==true||data.result.failed.length!==0)throw Error("group did not qualify: "+data.id);
           const hash=name=>createHash("sha256").update(readFileSync(join(file,"..",name))).digest("hex");
           if(hash("vitest.json")!==data.result.reportSha256||hash("test.log")!==data.result.logSha256)throw Error("group evidence hash differs: "+data.id);
          }
          const summary={head,workflow:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,status:"passed",completeSuite:false,groupCount:receipts.length,groups:receipts.map(({data})=>({id:data.id,passed:data.result.passed,pending:data.result.pending.length,reportSha256:data.result.reportSha256})),priorVerifiedGroups:16};
          writeFileSync(process.env.RUNNER_TEMP+"/region-san-remaining.json",JSON.stringify(summary,null,2)+"\n");
          console.log(JSON.stringify(summary));
          AGGREGATE
      - uses: actions/upload-artifact@v4
        with:
          name: region-san-remaining-summary
          path: ${{ runner.temp }}/region-san-remaining.json
          if-no-files-found: error
          retention-days: 1
