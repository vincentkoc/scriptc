            proof: 150
          - id: san-3-cost-balanced-tests
            minutes: 90
            proof: 65
          - id: san-3-fetch
            minutes: 60
            proof: 40
          - id: san-3-npm-static
            minutes: 60
            proof: 40
          - id: san-3-self-hosting-llvm-emitter
            minutes: 30
            proof: 10
          - id: san-3-three-js-library
            minutes: 30
            proof: 10
          - id: san-4-case-sharded-corpus
            minutes: 180
            proof: 150
          - id: san-4-npm-static
            minutes: 60
            proof: 40
          - id: san-4-self-hosting-llvm-emitter
            minutes: 30
            proof: 10
          - id: san-4-self-hosting-serialization
            minutes: 60
            proof: 40
          - id: san-4-surface-manifest
            minutes: 60
            proof: 40
          - id: san-4-three-js-library
            minutes: 30
