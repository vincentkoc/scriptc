          const minutes=Number(process.env.PROOF_MINUTES);
          if(!allowed.includes(id)||!Number.isSafeInteger(minutes)||minutes<1||minutes>150)throw Error("invalid selected group or budget");
          const deadline=Date.now()+minutes*60_000;
          const scrub=s=>String(s).split(root).join("<repo>").split(process.env.RUNNER_TEMP).join("<temp>");
          const save=()=>writeFileSync(join(out,"receipt.json"),scrub(JSON.stringify(report,null,2))+"\n");
          const hash=file=>createHash("sha256").update(readFileSync(file)).digest("hex");
          const scopeState=unit=>{
           if(!/^region-san-\d+-\d+-san-[34]-[a-z-]+\.scope$/.test(unit))throw Error("invalid owned scope");
