           const {ciTestPlan}=await import(pathToFileURL(join(root,"scripts/ci-test-plan.mjs")));
           const shard=Number(id.split("-")[1]),plan=ciTestPlan({shard:shard+"/4",flavor:"san",workers:4,suite:"full",platform:"linux"});
           const matches=[plan.corpus,...plan.side].filter(task=>"san-"+shard+"-"+task.name.toLowerCase().replace(/[^a-z0-9]+/g,"-")===id);
           if(matches.length!==1)throw Error("canonical task selection differs");
           const task=matches[0],files=task.args.filter(arg=>arg.endsWith(".test.ts")).sort();
           if(files.length===0)throw Error("canonical test files missing");
           report.task={name:task.name,args:task.args,env:task.env,files,shard:shard+"/4"};
           report.baseEnv={NODE_OPTIONS:process.env.NODE_OPTIONS,ASAN_OPTIONS:process.env.ASAN_OPTIONS,SCRIPTC_TEST_WORKERS:process.env.SCRIPTC_TEST_WORKERS};
           const output=join(out,"vitest.json"),log=join(out,"test.log");
           if(existsSync(output)||existsSync(log))throw Error("test evidence already exists");
