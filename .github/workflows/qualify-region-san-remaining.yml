          };
          const execute=async(command,args,{capture=false,logfile,scope,env={},timeoutMs=deadline-Date.now()}={})=>{
           const start=Date.now();
           if(timeoutMs<=0)throw Error("qualification deadline expired");
           const result=await new Promise((resolve)=>{
            let stdout="",stderr="",timedOut=false,cancelled=false,spawnError,forceTimer,completionTimer,closed=false,settled=false,cleanup=Promise.resolve({}),cleanupErrors=[];
            const child=spawn(command,args,{cwd:root,env:{...process.env,...env},stdio:(capture||logfile)?["ignore","pipe","pipe"]:"inherit",detached:true});
            const alive=()=>{if(!Number.isInteger(child.pid)||child.pid<=1)return false;try{process.kill(-child.pid,0);return true;}catch(error){if(error.code==="ESRCH")return false;throw error;}};
