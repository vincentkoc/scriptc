           if(!existsSync(output)||statSync(output).mtimeMs<started)throw Error("fresh reporter output missing");
           const data=JSON.parse(readFileSync(output,"utf8")),cases=data.testResults.flatMap(suite=>suite.assertionResults);
           const observedFiles=data.testResults.map(suite=>relative(root,suite.name)).sort();
           report.result={success:data.success,passed:cases.filter(t=>t.status==="passed").length,pending:cases.filter(pending).map(t=>t.fullName),failed:cases.filter(t=>t.status==="failed").map(t=>t.fullName),files:observedFiles,reportSha256:hash(output),logSha256:hash(log)};
           if(failure)throw failure;
