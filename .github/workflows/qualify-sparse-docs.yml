name: Qualify native ABI documentation

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/qualify-sparse-docs.yml]

permissions:
  contents: read

concurrency:
  group: qualify-sparse-docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: 283ae0a3288149c9a9751d7d56c2a114bdf875cb
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Verify the standalone docs workspace
        run: |
          cat > "$RUNNER_TEMP/sparse-docs-proof.mjs" <<'PROOF'
          import { spawnSync, execFileSync } from "node:child_process";
          import { readFileSync, writeFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { join } from "node:path";
          import { homedir } from "node:os";
          const root=process.cwd(),docs=join(root,"docs"),temp=process.env.RUNNER_TEMP;
          const head="283ae0a3288149c9a9751d7d56c2a114bdf875cb";
          const report={head,workflow:process.env.GITHUB_SHA,node:process.version,platform:process.platform,arch:process.arch,status:"running",steps:[]};
          const summary=join(temp,"sparse-docs-summary.json");
          const scrub=s=>String(s).split(root).join("<repo>").split(temp).join("<temp>").split(homedir()).join("<home>");
          const git=args=>execFileSync("git",args,{encoding:"utf8",cwd:root}).trim();
          const save=()=>writeFileSync(summary,JSON.stringify(report,null,2)+"\n");
          const verify=()=>{
           if(git(["rev-parse","HEAD"])!==head||git(["status","--porcelain"])!=="")throw Error("source changed");
           if(process.version!=="v"+readFileSync(".node-version","utf8").trim())throw Error("wrong Node pin");
          };
          const run=(label,args,cwd=root)=>{
           console.log("START "+label);
           const r=spawnSync("pnpm",args,{cwd,env:{...process.env,NEXT_DIST_DIR:".next-check"},encoding:"utf8",timeout:1_200_000,maxBuffer:32*1024*1024});
           report.steps.push({label,code:r.status,signal:r.signal,error:r.error?.message,stdout:scrub(r.stdout??"").slice(-8000),stderr:scrub(r.stderr??"").slice(-4000)});
           save();
           if(r.stdout)console.log(scrub(r.stdout));if(r.stderr)console.error(scrub(r.stderr));
           if(r.status!==0||r.signal||r.error)throw Error(label+" failed");
           return r.stdout.trim();
          };
          save();
          try{
           verify();
           report.packageManagers={root:run("root package manager",["--version"]),docs:run("docs package manager",["--version"],docs)};
           if(report.packageManagers.root!=="11.1.3"||report.packageManagers.docs!=="10.23.0")throw Error("package manager pin differs");
           const files=["docs/content/docs/how-it-works.mdx","examples/native-object/README.md"];
           report.inputs=Object.fromEntries(files.map(p=>[p,createHash("sha256").update(readFileSync(p)).digest("hex")]));
           run("docs install",["install","--frozen-lockfile"],docs);
           verify();
           run("canonical docs check",["check"],docs);
           report.status="passed";
          }catch(error){report.status="failed";report.error=scrub(error);process.exitCode=1;}
          finally{
           try{verify();report.sourceVerifiedAfter=true;}catch(error){report.status="failed";report.sourceError=scrub(error);process.exitCode=1;}
           save();console.log(JSON.stringify(report));
           if(process.exitCode)console.error("[scriptc-docs-proof] FAILED (exit 1)");
          }
          PROOF
          node "$RUNNER_TEMP/sparse-docs-proof.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sparse-docs-proof
          path: ${{ runner.temp }}/sparse-docs-summary.json
          if-no-files-found: error
          retention-days: 1
