name: Diagnose Darwin three debug map

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/diagnose-darwin-three-debug-map.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-darwin-three-debug-map
  cancel-in-progress: false

jobs:
  replay:
    if: github.repository == 'vincentkoc/scriptc'
    runs-on: macos-15
    timeout-minutes: 80
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: 022f251fc38b4c169333f133398ee5150172f2bc
          path: source
          persist-credentials: false
      - name: Verify the frozen source
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = 022f251fc38b4c169333f133398ee5150172f2bc
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Authenticate the exact macOS native archive
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 <<'DOWNLOAD'
          import hashlib, json, os, shutil, stat, tarfile, urllib.error, urllib.parse, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          BASE = Path(os.environ["RUNNER_TEMP"])
          OUT, WORK = BASE / "darwin-three-debug-map-proof", BASE / "darwin-three-debug-map-work"
          SOURCE = Path(os.environ["GITHUB_WORKSPACE"]) / "source"
          ORIGIN = {"workflow": "ffee2a1cd75230aa556294cdac6fabd8d383ffe5", "run": "41219050544", "attempt": "1", "job": 124589635389, "source": "022f251fc38b4c169333f133398ee5150172f2bc"}
          ARTIFACT = 13049073593
          ZIP_SHA = "d80e2888047067c37708a156491d92478a455e17b99b5ebbf2e9a96f92b8f517"
          CONSUMER = {"workflow": os.environ["GITHUB_SHA"], "run": os.environ["GITHUB_RUN_ID"], "attempt": os.environ["GITHUB_RUN_ATTEMPT"]}
          OUT.mkdir()
          WORK.mkdir(mode=0o700)
          with (WORK / "owner.json").open("x") as marker:
              marker.write(json.dumps(CONSUMER, sort_keys=True) + "\n")
          receipt = {"origin": ORIGIN, "consumer": CONSUMER, "verified": False}
          def digest(path):
              value = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      value.update(block)
              return value.hexdigest()
          def safe_name(name):
              path = PurePosixPath(name)
              assert name and "\\" not in name and "\0" not in name, "invalid archive path characters"
              assert not path.is_absolute() and ".." not in path.parts, "absolute or parent archive path"
              assert path.as_posix() == name.rstrip("/") and path.parts, "noncanonical archive path"
              return path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, message, headers, newurl):
                  return None
          stage = "metadata"
          try:
              token = os.environ.pop("GH_TOKEN")
              opener = urllib.request.build_opener(NoRedirect)
              headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "scriptc-darwin-three-diagnostic"}
              def api(path):
                  with opener.open(urllib.request.Request("https://api.github.com/repos/vincentkoc/scriptc/" + path, headers=headers), timeout=120) as response:
                      raw = response.read(1024**2 + 1)
                  assert len(raw) <= 1024**2, "API response exceeds budget"
                  return json.loads(raw)
              metadata = api(f"actions/artifacts/{ARTIFACT}")
              assert metadata["id"] == ARTIFACT and metadata["name"] == "native-darwin-arm64" and metadata["expired"] is False, "artifact identity or expiry mismatch"
              assert metadata["size_in_bytes"] == 82387094 and metadata["digest"] == "sha256:" + ZIP_SHA, "artifact ZIP metadata mismatch"
              assert str(metadata["workflow_run"]["id"]) == ORIGIN["run"] and metadata["workflow_run"]["head_sha"] == ORIGIN["workflow"], "artifact producer mismatch"
              stage = "job"
              job = api(f"actions/jobs/{ORIGIN['job']}")
              assert job["run_id"] == int(ORIGIN["run"]) and job["head_sha"] == ORIGIN["workflow"], "native job producer mismatch"
              assert job["conclusion"] == "success" and job["status"] == "completed", "native producer did not complete successfully"
              assert job["name"] == "build (macOS arm64 native packages)", "native job name mismatch"
              assert all(step["conclusion"] in ("success", "skipped") for step in job["steps"]), "native job step failed"
              stage = "download"
              try:
                  response = opener.open(urllib.request.Request(f"https://api.github.com/repos/vincentkoc/scriptc/actions/artifacts/{ARTIFACT}/zip", headers=headers), timeout=120)
              except urllib.error.HTTPError as error:
                  assert error.code == 302, "artifact redirect refused"
                  location = error.headers.get("Location", "")
                  error.close()
                  parsed = urllib.parse.urlsplit(location)
                  assert parsed.scheme == "https" and parsed.hostname and not parsed.username and not parsed.password, "invalid artifact storage redirect"
                  response = opener.open(urllib.request.Request(location), timeout=120)
              archive = WORK / "native.zip"
              size = 0
              with response, archive.open("xb") as output:
                  while block := response.read(1024 * 1024):
                      size += len(block)
                      assert size <= 128 * 1024**2, "ZIP download exceeds budget"
                      output.write(block)
              assert size == 82387094 and digest(archive) == ZIP_SHA, "downloaded ZIP identity mismatch"
              tar_path = WORK / "native-darwin-arm64.tar.gz"
              stage = "zip"
              with zipfile.ZipFile(archive) as bundle:
                  entries = bundle.infolist()
                  assert len(entries) == 1 and entries[0].filename == tar_path.name, "ZIP member inventory mismatch"
                  item = entries[0]
                  assert stat.S_IFMT(item.external_attr >> 16) in (0, stat.S_IFREG) and not item.flag_bits & 1, "unsafe ZIP member type"
                  assert 0 < item.file_size <= 256 * 1024**2, "ZIP expansion exceeds budget"
                  with bundle.open(item) as stream, tar_path.open("xb") as output:
                      shutil.copyfileobj(stream, output, 1024 * 1024)
                  assert tar_path.stat().st_size == item.file_size, "ZIP entry size mismatch"
              allowed = ["packages/llvm-darwin-arm64/bin", "packages/runtime-darwin-arm64/artifacts", "packages/runtime-darwin-arm64/runtime-pack.json"]
              files, seen = [], set()
              stage = "tar"
              with tarfile.open(tar_path, "r:gz") as bundle:
                  members = bundle.getmembers()
                  assert 0 < len(members) <= 20000 and sum(item.size for item in members) <= 2 * 1024**3, "tar inventory exceeds budget"
                  for item in members:
                      name = safe_name(item.name).as_posix()
                      assert name not in seen, "duplicate tar member"
                      seen.add(name)
                      assert any(name == prefix or name.startswith(prefix + "/") for prefix in allowed), "tar member outside native artifact roots"
                      assert item.isdir() or item.isfile(), "links and special files are not admitted"
                      assert not item.mode & 0o7000, "unsafe tar permissions"
                      target = SOURCE / name
                      assert not target.is_symlink() and not target.exists(), "native artifact would overwrite an existing path"
                      assert all(not parent.is_symlink() for parent in target.parents if parent != SOURCE.parent), "symlink in extraction parent"
                  for item in members:
                      target = SOURCE / item.name
                      if item.isdir():
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with bundle.extractfile(item) as stream, target.open("xb") as output:
                          shutil.copyfileobj(stream, output, 1024 * 1024)
                      target.chmod(item.mode & 0o777)
                      assert target.stat().st_size == item.size, "tar entry size mismatch"
                      files.append({"path": item.name, "bytes": item.size, "sha256": digest(target)})
              receipt.update({"artifact": ARTIFACT, "name": metadata["name"], "zipBytes": size, "zipSha256": ZIP_SHA, "tarSha256": digest(tar_path), "files": sorted(files, key=lambda row: row["path"]), "verified": True})
              archive.unlink()
              tar_path.unlink()
          except Exception as error:
              # HTTP exception text can contain signed storage URLs; never publish it.
              receipt["failureType"] = type(error).__name__
              receipt["failureStage"] = stage
              if isinstance(error, urllib.error.HTTPError):
                  receipt["httpStatus"] = error.code
              if isinstance(error, AssertionError):
                  receipt["admissionReason"] = str(error)
              print("[darwin-three-download] FAILED (exit 1)")
              raise SystemExit(1)
          finally:
              (OUT / "native-origin.json").write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          DOWNLOAD
      - name: Prepare the bounded compile observer
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/darwin-three-debug-map-proof"
          cat > "$RUNNER_TEMP/darwin-three-debug-map-proof/runner.mjs" <<'RUNNER'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { spawn, spawnSync } from "node:child_process";
          import { closeSync, copyFileSync, createReadStream, existsSync, lstatSync, mkdirSync, openSync, readFileSync, readdirSync, realpathSync, rmSync, statSync, writeFileSync, writeSync } from "node:fs";
          import { basename, dirname, join, relative, resolve } from "node:path";
          import { pathToFileURL } from "node:url";
          import { setTimeout as delay } from "node:timers/promises";

          const root = join(process.env.GITHUB_WORKSPACE, "source");
          const out = join(process.env.RUNNER_TEMP, "darwin-three-debug-map-proof");
          const work = join(process.env.RUNNER_TEMP, "darwin-three-debug-map-work");
          const self = resolve(process.argv[1]);
          const consumerIdentity = { workflow: process.env.GITHUB_SHA, run: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT };
          const sourceHead = "022f251fc38b4c169333f133398ee5150172f2bc";
          const sourcePins = {"AGENTS.md":"11ccf7ab2f85791a40e8f497959e4e94df067807d1ac93ad23c7737578bd334c",".node-version":"a1c56e968c358e10872d64220b3ae759ffe7feaffc4da95fae425dbcca43fe44","package.json":"154f121f394b6c9d94120814de67c281d0f7505ffc340f88a8fdb0e9078d83fa","pnpm-lock.yaml":"f4bfbdc670252a428c20be1b9e104a573858ed596322294f80bed876b53d6353","pnpm-workspace.yaml":"57732c3fec5d4f4b879a11a073f9d85d26bf09fe361d4e2794d4cb2d00652632","vitest.config.ts":"96064c247379f195187a4eb99c1d5a62d64d41bb436d8e9fa5cbb8cd02b25f32","tests/harness/three.test.ts":"6260fb23d1f98752b201192db3a14e8c01f6c8419c9508a6d311c9962327c86a","tests/fixtures/three/procedural-geometry.mjs":"e6fa26f371d954d0f3473a649646234dfa455534646b319d3293fe979ade9615","packages/compiler/package.json":"6ab1024e6b8ec404121a9bd99d75d99f8882ef060dc04f79bbc9ba936a74b62f","packages/compiler/src/index.ts":"33d01caceab22072703683256a406c29894f9c1fc87c66d2878703dbec1f691c","packages/compiler/src/backend/debug-symbols.ts":"979ae280386fc98ab75643e925e7067357b31d495b69026e960e2376c280bbb3","packages/compiler/src/backend/native/executable.ts":"3af4b1034b7cb9750720d78c1e803743aeee1e1cf60b57396cf50d351ee33d39","packages/compiler/src/backend/native/driver.ts":"64d65bb08e9d9b97e9f9a48d55b02d8d4f0fd3bdc5eee4ae937b67abc57cd82e","packages/compiler/src/backend/native/session.ts":"b82407816ed96933fee39c9cd5dd7f47bb0be6a4a025bd1841e7c3ca2baf56ce","packages/compiler/src/backend/build-cache.ts":"f4a3dfa56c1063cb1b5fd9642bd30af79e6727e51e6250b2de27b2a2448c33e2","packages/compiler/src/backend/cache-root.ts":"7a9e30aa817aea4b45bf8866d5b53677872885ce5b9f43536ca94f9bb677e628","packages/compiler/src/backend/runtime-abi.ts":"410942a8aec11d7ca9a7e2c9c2eb5f2881978b2bce77c867a48bdc8859e2691f","packages/runtime-darwin-arm64/package.json":"955755aff1488955fb3181895559ed72ed9cc2f1103ef7a3fcbbee9dff94ecd0","packages/runtime-darwin-arm64/scripts/verify.mjs":"758b2fef508d2a2ff23ce43a709adb15166461aac66ece808578abea85d2f357","packages/runtime-pack-common/scripts/verify.mjs":"a708bddecf7af5d2446cf5cd575299041522bc4f5d7fd99113876e26dee44c13","packages/llvm-darwin-arm64/package.json":"aa242a8579d99df616078e805e7b7441c94e3867dd8f722ed32929fba4b4e383","native/llvm-codegen/src/main.cpp":"22c13ad337cccd043b3a6e477e84454090d849c0578826823c3e6b413e9f708e",".github/actions/native-packages/action.yml":"66ccdecfc85530af8cee2c61f33c4429abcedc615ccae38b5654ef7c309d2631","packages/compiler/src/backend/native/process.ts":"341c216690b7f5d401786f46e80e5bba3c7f8b5c22896d1d0c047e5f328c75ea","packages/compiler/src/backend/native/runtime-inputs.ts":"261d9462b2464d085d44f1c767e82adbbc3672c787b71c602de1046f3ccf45d8","packages/compiler/src/backend/native/tool-identity.ts":"2d239087986b664aff948f9a8fa18ac2ada65b0102cd65e3fe9472147deb4cb8","packages/compiler/src/backend/native/object-merge.ts":"cf92ea4c8e7bfc8961aa928564ca193d6b81ee735dd74ea33b4b7eb6ae2c0123","packages/compiler/src/backend/native/program-shards.ts":"b01f954a589c3ccbd0d0f2a71bc2fe7b66994db2bdf1378037c3ccec852bc792","packages/compiler/src/backend/native/runtime-objects.ts":"8722f813926a202b4cae5e1dff2829f30542d611fa09cddedaf36481c26ae630","packages/compiler/src/backend/native/vendor.ts":"371db343d518806187218379a64a8446f67773a509f7b65a9fd88425a264816c","tsconfig.base.json":"efc9a98b93b487ec0397287f90c59a89a039443a4eae3d023294a8724d2c22d4","packages/compiler/tsconfig.json":"8465ef2358e3a6fe7c91db8c3ba1b53fec5af62398b827209ded67ed653228d7"};
          const nativeInputSha256 = "58c107d92ab7198a09742b442ed77d07e88d0ce81d720ea93c88a71b3591db25";
          const entry = join(root, "tests/fixtures/three/procedural-geometry.mjs");
          const build = join(work, "compile"), cache = join(work, "cache"), scratch = join(work, "tmp");
          const compileOptions = { outDir: build, outPath: join(build, "procedural-geometry"), backend: "llvm", npmStatic: ["three"], optimization: "dev", sanitize: true };
          const CAP = 16 * 1024 * 1024;
          const digest = bytes => createHash("sha256").update(bytes).digest("hex");
