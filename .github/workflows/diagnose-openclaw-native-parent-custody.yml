          const reaperSource = "import ctypes, errno, hashlib, json, os, pathlib, selectors, signal, sys, time\n\ncommand, entry, native, gate, receipt, node, parent_native = sys.argv[1:]\nlauncher_command = command if parent_native == \"1\" else node\nlauncher_args = [launcher_command] if parent_native == \"1\" else [node, entry]\ngate = pathlib.Path(gate)\nreceipt = pathlib.Path(receipt)\nCAP = 1024 * 1024\nstarted = time.monotonic()\nnonce = os.urandom(16).hex()\nreport = {\"schemaVersion\": 1, \"evidence\": \"waitpid-adopted\", \"complete\": False,\n          \"cleanupUsed\": False, \"nonce\": nonce, \"groupDrained\": False, \"events\": [], \"supervisor\": os.getpid()}\ndef save():\n    # This file exists before fork, so a dead supervisor leaves unresolved custody.\n    receipt.write_text(json.dumps(report, indent=2) + \"\\n\")\ndef identity(pid):\n    text = pathlib.Path(\"/proc\", str(pid), \"stat\").read_text()\n    fields = text[text.rindex(\")\") + 2:].split()\n    return {\"pid\": pid, \"ppid\": int(fields[1]), \"group\": int(fields[2]),\n            \"session\": int(fields[3]), \"starttime\": fields[19], \"state\": fields[0]}\ndef same(wanted, parent=None):\n    current = identity(wanted[\"pid\"])\n    for key in (\"pid\", \"group\", \"session\", \"starttime\"):\n        assert current[key] == wanted[key], \"process identity changed\"\n    if parent is not None:\n        assert current[\"ppid\"] == parent, \"process parent changed\"\n    return current\ndef decoded(status):\n    return {\"raw\": status, \"exited\": os.WIFEXITED(status),\n            \"code\": os.WEXITSTATUS(status) if os.WIFEXITED(status) else None,\n            \"signaled\": os.WIFSIGNALED(status),\n            \"signal\": os.WTERMSIG(status) if os.WIFSIGNALED(status) else None,\n            \"coreDumped\": bool(os.WCOREDUMP(status)) if os.WIFSIGNALED(status) else False}\ninterrupted = False\ncleaning = False\ndef interrupt(signum, frame):\n    global interrupted\n    interrupted = True\