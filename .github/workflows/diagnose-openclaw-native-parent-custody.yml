estCliParentTermination);\n  process.channel.unref();\n  if (!process.connected) {\n    requestCliParentTermination();\n  }\n}\n","sha256":"ea3e4018367731671600be70437f44ccac3a767c6d6db6310951cb0c70ab3825","gitBlob":"c6764bb78193a43fa3b60bfe46d2532060a60152"},"gateway-shutdown-budget.mjs":{"text":"// Shared stop policy; v2026.9.5 restart-health.constants.ts fixes the replacement window.\nexport const GATEWAY_RESTART_REPLACEMENT_TIMEOUT_MS = 60_000;\nconst GATEWAY_SHUTDOWN_DRAIN_TIMEOUT_MS = 315_000;\nexport const GATEWAY_SHUTDOWN_RESERVE_MS = 10_000;\nexport const GATEWAY_SUPERVISOR_EXIT_MARGIN_MS = 5_000;\nexport const GATEWAY_SHUTDOWN_TIMEOUT_MS =\n  GATEWAY_SHUTDOWN_DRAIN_TIMEOUT_MS + GATEWAY_SHUTDOWN_RESERVE_MS;\nexport const GATEWAY_SERVICE_STOP_TIMEOUT_MS =\n  GATEWAY_SHUTDOWN_TIMEOUT_MS + GATEWAY_SUPERVISOR_EXIT_MARGIN_MS;\n\nexport const LAUNCH_AGENT_EXIT_TIMEOUT_SECONDS = GATEWAY_SERVICE_STOP_TIMEOUT_MS / 1_000;\n\n// Keep a positive shutdown budget when a supervisor's deadline is under 20s.\nconst GATEWAY_SUPERVISOR_EXIT_MARGIN_SHARE = 0.25;\n\n// Preserve a legacy job's 5s drain where possible. Under 20s, trade some cleanup\n// reserve for drain; on very short jobs, split the remaining budget in half.\n// Inspection time is debited before this allocation, so a slow probe can also\n// reduce the drain. The measured upgrade tradeoff is documented in restart-recovery.\nconst GATEWAY_SHUTDOWN_DRAIN_FLOOR_MS = 5_000;\nconst GATEWAY_SHUTDOWN_DRAIN_FLOOR_SHARE = 0.5;\n\n/** The exit margin to hold back from a supervisor-enforced stop deadline. */\nexport const resolveSupervisorExitMarginMs = (stopTimeoutMs) =>\n  Math.min(\n    GATEWAY_SUPERVISOR_EXIT_MARGIN_MS,\n    Math.floor(Math.max(0, stopTimeoutMs) * GATEWAY_SUPERVISOR_EXIT_MARGIN_SHARE),\n  );\n\n/** The post-drain reserve to hold back from a resolved shutdown budget. */\nexport const resolveShutdownReserveMs = (shutdownTimeoutMs) => {\n  const budgetMs = Math.max(0, shutdownTimeoutMs);\n  const drainFloorMs = Math.min(\n    GATEWAY_SHUTDOWN_DRAIN_FLOOR_MS,\n    Math.floor(budgetMs * GATEWAY_SHUTDOWN_DRAIN_FLOOR_SHARE),\n  );\n  return Math.min(GATEWAY_SHUTDOWN_RESERVE_MS, budgetMs - drainFloorMs);\n};\n\n// Escalation graces the Node recovery launcher applies to a stopping child. Kept\n// here rather than in the launcher so both use the same escalation policy.\nconst RESPAWN_SIGNAL_EXIT_GRACE_MS = 1_000;\nexport const RESPAWN_SIGNAL_FORCE_KILL_GRACE_MS = 1_000;\nconst RESPAWN_SIGNAL_HARD_EXIT_GRACE_MS = 1_000;\n\n// Every runRespawnedChild call site stamps one of these. The compile-cache\n// marker is also used by a different respawner, but that one refuses foreground\n// Gateway runs on darwin. Keep this list with the launcher deadline it authorizes.\nconst RESPAWN_LAUNCHER_MARKER_ENV_VARS = [\n  \"OPENCLAW_NODE_UPDATE_RESPAWNED\",\n  \"OPENCLAW_COMPILE_CACHE_DISABLED_RESPAWNED\",\n  \"OPENCLAW_PACKAGED_COMPILE_CACHE_RESPAWNED\",\n];\n\n/** Whether a `runRespawnedChild` parent started this process. */\nexport const isRespawnedByLauncher = (env) =>\n  RESPAWN_LAUNCHER_MARKER_ENV_VARS.some((name) => env[name] === \"1\");\n\n// New launchers use the shared service policy. A serving Gateway separately\n// retains the shorter deadline of an unidentified, already-running old launcher.\nexport const resolveLauncherStopTimeoutMs = ({ platform, foreground }) => {\n  const signalExitGraceMs =\n    platform !== \"win32\" && foreground\n      ? GATEWAY_SERVICE_STOP_TIMEOUT_MS -\n        RESPAWN_SIGNAL_FORCE_KILL_GRACE_MS -\n        RESPAWN_SIGNAL_HARD_EXIT_GRACE_MS\n      : RESPAWN_SIGNAL_EXIT_GRACE_MS;\n  return signalExitGraceMs + RESPAWN_SIGNAL_FORCE_KILL_GRACE_MS;\n};\n","sha256":"02757141fd71a0e03ee885d952edbcd664395a420b26c6b7ba596529336baa3a","gitBlob":"d32df227cd225f4d6e75afbeddc9b14a0a4a5cbd"}}};
          const fixtureSource = "import { requireModule } from \"@scriptc/node\";\n\nconst transport = requireModule(\"./transport.mjs\");\nconst mode = process.env.CUSTODY_CASE ?? \"\";\nconst role = process.env.CUSTODY_ROLE ?? \"child\";\n\nfunction runParent(): void {\n  let work = 0;\n  setInterval(() => { work += 1; }, 1000);\n  transport.spawnOwned(process.env.CUSTODY_CHILD_COMMAND ?? process.execPath, process.env.CUSTODY_CHILD_ENTRY ?? process.argv[1], process.env.CUSTODY_NATIVE === \"1\");\n}\n\nfunction runChild(): void {\n  if (mode === \"unref\") {\n    transport.watch();\n    transport.ready(mode);\n    return;\n  }\n  let work = 0;\n  let terms = 0;\n  const timer = setInterval(() => { work += 1; }, 50);\n  function onTermination(): void {\n    terms += 1;\n    console.log(JSON.stringify({ kind: \"native-handler\", pid: process.pid, terms, work }));\n    if (mode !== \"stubborn\") clearInterval(timer);\n  }\n  function onFinish(): void {\n    console.log(JSON.stringify({ kind: \"native-finish\", pid: process.pid, terms, work }));\n    clearInterval(timer);\n  }\n  function onExit(code: number): void {\n    console.log(JSON.stringify({ kind: \"native-exit\", pid: process.pid, terms, code }));\n  }\n  process.on(\"SIGTERM\", onTermination);\n  process.on(\"SIGINT\", onFinish);\n  process.on(\"exit\", onExit);\n  if (mode === \"late-watch\") {\n    transport.armLate();\n  } else {\n    transport.watch();\n    if (mode !== \"parent-death\") transport.armDisconnect();\n  }\n  transport.ready(mode);\n}\nif (role === \"parent\") runParent();\nelse runChild();\n";
          const transportSource = "import assert from \"node:assert/strict\";\nimport { spawn } from \"node:child_process\";\nimport { existsSync, writeFileSync } from \"node:fs\";\nimport { getCliParentPid, watchCliRespawnParent } from \"./openclaw/cli-parent-lifetime.mjs\";\n\n// A test-only startup barrier admits the actual process before application work.\n// It does not add an event-loop handle or change the unchanged helper.\nconst gate = process.env.CUSTODY_GATE;\nassert.ok(gate?.startsWith(\"/\"));\nwriteFileSync(gate + \".ready\", JSON.stringify({ pid: process.pid, ppid: process.ppid, nonce:process.env.CUSTODY_NONCE }), { flag: \"wx\", mode: 0o600 });\nconst gateDeadline = Date.now() + 10000;\nwhile (!existsSync(gate + \".permit\")) {\n  if (Date.now() >= gateDeadline) throw new Error(\"custody startup admission expired\");\n  Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 10);\n}\nfunction facts(kind, mode) {\n  console.log(JSON.stringify({\n    kind, mode, pid: process.pid, ppid: process.ppid, nonce:process.env.CUSTODY_NONCE,\n    parentPid: getCliParentPid() ?? null, watching:globalThis[Symbol.for(\"openclaw.cliRespawnParent\")]?.watching===true,\n    connected: process.connected === true, channel: Boolean(process.channel),\n    markerConsumed: !Object.hasOwn(process.env, \"OPENCLAW_CLI_RESPAWN_PARENT\"),\n  }));\n}\nexport function watch() { watchCliRespawnParent(); }\nexport function ready(mode) { facts(\"ready\", mode); }\nexport function armDisconnect() {\n  process.once(\"disconnect\", () => facts(\"disconnected\", process.env.CUSTODY_CASE));\n  process.once(\"message\", message => {\n    assert.equal(message, \"disconnect\");\n    facts(\"disconnect-request\", process.env.CUSTODY_CASE);\n    process.disconnect();\n  });\n}\nexport function armLate() {\n  process.once(\"disconnect\", () => {\n    facts(\"late-before-watch\", process.env.CUSTODY_CASE);\n    watchCliRespawnParent();\n    facts(\"late-watch\", process.env.CUSTODY_CASE);\n  });\n  process.once(\"message\", message => {\n    assert.equal(message, \"disconnect\");\n    facts(\"disconnect-request\", process.env.CUSTODY_CASE);\n    process.disconnect();\n  });\n}\nexport function spawnOwned(command, entry, native) {\n  assert.equal(process.env.CUSTODY_ROLE, \"parent\");\n  assert.equal(process.env.CUSTODY_CASE, \"parent-death\");\n  assert.equal(command, process.env.CUSTODY_CHILD_COMMAND ?? process.execPath);\n  const args = native ? [] : [entry];\n  const child = spawn(command, args, {\n    stdio: [\"ignore\", \"inherit\", \"inherit\", \"ipc\"],\n    env: { ...process.env, CUSTODY_ROLE: \"child\", CUSTODY_GATE: gate + \"-child\", OPENCLAW_CLI_RESPAWN_PARENT: String(process.pid) },\n  });\n  child.once(\"error\", error => { throw error; });\n  console.log(JSON.stringify({ kind: \"spawned\", pid: process.pid, childPid: child.pid, command, args }));\n}\n";
          const controllerSource = "import assert from \"node:assert/strict\";\nimport { spawn } from \"node:child_process\";\nimport { createHash, randomUUID } from \"node:crypto\";\nimport { existsSync, readFileSync, writeFileSync } from \"node:fs\";\nimport { setTimeout as delay } from \"node:timers/promises\";\n\nconst [mode, command, entry, native, gate, receipt] = process.argv.slice(2);\nconst report = { schemaVersion: 1, mode, parentPid: process.pid, custody: \"ChildProcess exit + close + independent stdout/stderr end/close\", complete: false, cleanupUsed: false, events: [] };\nconst cap = 1024 * 1024;\nconst now = () => Number(process.hrtime.bigint() / 1000000n);\nconst started = now();\nfunction proc(pid) {\n  assert.ok(Number.isInteger(pid) && pid > 1);\n  const text = readFileSync(\"/proc/\" + pid + \"/stat\", \"utf8\");\n  const fields = text.slice(text.lastIndexOf(\")\") + 2).trim().split(/\\s+/);\n  return { pid, ppid: Number(fields[1]), group: Number(fields[2]), session: Number(fields[3]), starttime: fields[19], state: fields[0] };\n}\nconst parent = proc(process.pid);\nconst nonce=randomUUID();report.nonce=nonce;\nconst env = { ...process.env, CUSTODY_ROLE: \"child\", CUSTODY_CASE: mode, CUSTODY_NATIVE: native, CUSTODY_GATE: gate, CUSTODY_NONCE:nonce };\ndelete env.OPENCLAW_CLI_RESPAWN_PARENT;\nif (mode !== \"absent-marker\") env.OPENCLAW_CLI_RESPAWN_PARENT = String(process.pid + (mode === \"wrong-marker\" ? 1000000 : 0));\nconst args = native === \"1\" ? [] : [entry];\nconst child = spawn(command, args, { stdio: [\"ignore\", \"pipe\", \"pipe\", \"ipc\"], env });\nreport.command = command; report.args = args; report.marker = env.OPENCLAW_CLI_RESPAWN_PARENT ?? null;\nlet exited = false, closed = false, disconnected = false, error = null, interrupted = false;\nconst streams = [child.stdout, child.stderr].map(() => ({ bytes: 0, text: \"\", chunks: [], end: false, close: false, hash: createHash(\"sha256\") }));\nlet pending = \"\";\nchild.once(\"error\", value => { error = value.code ?? value.name; });\nchild.once(\"exit\", (code, signal) => { exited = true; report.exit = { code, signal, atMs: now() - started }; });\nchild.once(\"close\", (code, signal) => { closed = true; report.close = { code, signal, atMs: now() - started }; });\nchild.once(\"disconnect\", () => { disconnected = true; report.parentDisconnectAtMs = now() - started; });\nfor (const [index, stream] of [child.stdout, child.stderr].entries()) {\n  stream.on(\"data\", bytes => {\n    const sink = streams[index]; sink.bytes += bytes.length; sink.hash.update(bytes);\n    if (sink.bytes > cap) { error = \"stream-limit\"; return; }\n    sink.chunks.push(Buffer.from(bytes));\n    sink.text += bytes.toString(\"utf8\");\n    if (index === 0) {\n      pending += bytes.toString(\"utf8\");\n      while (pending.includes(\"\\n\")) {\n        const at = pending.indexOf(\"\\n\"), line = pending.slice(0, at); pending = pending.slice(at + 1);\n        try { const value = JSON.parse(line); report.events.push({ ...value, observedAtMs: now() - started }); }\n        catch { error = \"malformed-child-record\"; }\n      }\n    }\n  });\n  stream.once(\"end\", () => { streams[index].end = true; });\n  stream.once(\"close\", () => { streams[index].close = true; });\n}\nconst stop = () => { interrupted = true; };\nprocess.on(\"SIGTERM\", stop); process.on(\"SIGINT\", stop);\nasync function wait(predicate, milliseconds, allowExit = false) {\n  const end = now() + milliseconds;\n  while (!predicate() && !error && !interrupted && !(allowExit && exited) && now() < end) await delay(10);\n  assert.equal(error, null); assert.equal(interrupted, false);\n  assert.ok(predicate() || (allowExit && exited), \"bounded custody observation expired\");\n}\nfunction sameChild() {\n  const current = proc(child.pid);\n  assert.equal(current.pid, report.admission.pid);\n  assert.equal(current.starttime, report.admission.starttime);\n  assert.equal(current.ppid, process.pid); assert.equal(current.group, parent.group);\n  return current;\n}\ntry {\n  assert.ok(child.pid > 1 && child.pid !== process.pid && parent.group > 1);\n  await wait(() => existsSync(gate + \".ready\"), 10000);\n  const ready = JSON.parse(readFileSync(gate + \".ready\", \"utf8\"));\n  report.admission = proc(child.pid);\n  assert.equal(ready.nonce,nonce); assert.equal(ready.pid, child.pid); assert.equal(ready.ppid, process.pid);\n  assert.equal(report.admission.ppid, process.pid); assert.equal(report.admission.group, parent.group);\n  writeFileSync(gate + \".permit\", \"go\\n\", { flag: \"wx\", mode: 0o600 });\n  await wait(() => report.events.some(row => row.kind === \"ready\"), 10000, true);\n  const facts = report.events.find(row => row.kind === \"ready\");\n  assert.ok(facts, \"child never reached application readiness\"); assert.equal(facts.pid, child.pid);\n  assert.equal(facts.nonce,nonce); assert.equal(facts.ppid, process.pid); assert.equal(facts.connected, true); assert.equal(facts.channel, true);\n  assert.equal(facts.markerConsumed, true);\n  assert.equal(facts.parentPid, [\"wrong-marker\", \"absent-marker\"].includes(mode) ? null : process.pid);\n  assert.equal(facts.watching,![\"late-watch\",\"wrong-marker\",\"absent-marker\"].includes(mode));\n  report.readinessAdmitted = true;\n  if (mode !== \"unref\" && !exited) {\n    sameChild(); assert.equal(child.connected, true);\n    report.disconnectRequestAtMs = now() - started;\n    report.disconnectEndpoint = \"child process.disconnect(), requested over canonical IPC\";\n    await new Promise((resolve, reject) => child.send(\"disconnect\", failure => failure ? reject(failure) : resolve()));\n    const eventName = mode === \"late-watch\" ? \"late-watch\" : \"disconnected\";\n    await wait(() => report.events.some(row => row.kind === eventName), 10000, true);\n    if (([\"wrong-marker\", \"absent-marker\"].includes(mode) || (mode === \"late-watch\" && process.env.CUSTODY_EXPECT_LATE_BUG === \"1\")) && !exited) {\n      sameChil