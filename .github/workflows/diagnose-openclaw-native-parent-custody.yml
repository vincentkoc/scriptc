name: Diagnose OpenClaw native parent custody

on:
  push:
    branches: [qualify/region-darwin-20261030]
    paths: [.github/workflows/diagnose-openclaw-native-parent-custody.yml]

permissions:
  contents: read

concurrency:
  group: diagnose-openclaw-native-parent-custody-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_SHA: 8b9f7981e9198831474bbbe2eb47c48407daa380

jobs:
  diagnose:
    if: github.repository == 'vincentkoc/scriptc'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    env:
      PROOF_CAPACITY_NAME: openclaw-native-parent-custody-capacity
      DIAGNOSTIC_SOURCE: 8b9f7981e9198831474bbbe2eb47c48407daa380
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vincentkoc/scriptc
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Verify immutable source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - name: Admit disk capacity before LLVM
        shell: python
        run: |
          probe = r"""import json
          import os
          import pathlib
          import sys

          phase = sys.argv[1]
          minimum_gib, minimum_inodes = {
              "pre-llvm": (32, 1000000),
              "post-llvm": (16, 500000),
              "pre-proof": (16, 250000),
          }[phase]
          owner = {
              "workflow": os.environ["GITHUB_SHA"],
              "run": os.environ["GITHUB_RUN_ID"],
              "attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source": os.environ.get("CALLBACK_SOURCE") or os.environ["DIAGNOSTIC_SOURCE"],
          }
          devices = {}
          errors = {}
          for label, path in {
              "root": "/",
              "workspace": os.environ["GITHUB_WORKSPACE"],
              "runnerTemp": os.environ["RUNNER_TEMP"],
          }.items():
              try:
                  info = os.statvfs(path)
                  device = str(os.stat(path).st_dev)
                  row = devices.setdefault(device, {"device": device, "paths": [], "measurements": []})
                  row["paths"].append(label)
                  row["measurements"].append({
                      "path": label,
                      "availableBytes": info.f_bavail * info.f_frsize,
                      "availableInodes": info.f_favail,
                  })
              except OSError as error:
                  errors[label] = {"type": type(error).__name__, "errno": error.errno}
          for row in devices.values():
              row["availableBytes"] = min(item["availableBytes"] for item in row["measurements"])
              row["availableInodes"] = min(item["availableInodes"] for item in row["measurements"])
              row["admitted"] = row["availableBytes"] >= minimum_gib * 1024 ** 3 and row["availableInodes"] >= minimum_inodes
          report = {
              **owner, "phase": phase,
              "imageOS": os.environ.get("ImageOS"),
              "imageVersion": os.environ.get("ImageVersion"),
              "runnerOS": os.environ.get("RUNNER_OS"),
              "runnerArch": os.environ.get("RUNNER_ARCH"),
              "budgetKind": "conservative execution budget, not a measured peak",
              "minimumBytes": minimum_gib * 1024 ** 3,
              "minimumInodes": minimum_inodes,
              "devices": list(devices.values()), "measurementErrors": errors,
              "admitted": not errors and bool(devices) and all(row["admitted"] for row in devices.values()),
              "toolsRemoved": False,
          }
          text = json.dumps(report, indent=2) + "\n"
          print(text, flush=True)
          capacity_dir = pathlib.Path(os.environ["RUNNER_TEMP"], os.environ["PROOF_CAPACITY_NAME"])
          os.umask(0o077)
          if phase == "pre-llvm":
              capacity_dir.mkdir(mode=0o700)
          else:
              previous = json.loads((capacity_dir / "pre-llvm.json").read_text())
              assert {key: previous[key] for key in owner} == owner, "capacity receipt owner mismatch"
          with (capacity_dir / (phase + ".json")).open("x") as receipt:
              receipt.write(text)
          if not report["admitted"]:
              print("[proof-capacity] FAILED (exit 1): disk or inode admission refused", file=sys.stderr)
              raise SystemExit(1)
          """
          import os, pathlib, sys
          sys.argv = ["capacity.py", "pre-llvm"]
          exec(compile(probe, "capacity.py", "exec"))
          payload = pathlib.Path(os.environ["RUNNER_TEMP"], os.environ["PROOF_CAPACITY_NAME"], "capacity.py")
          with payload.open("x") as script:
              script.write(probe)
      - uses: ./.github/actions/llvm-linux
      - name: Recheck disk capacity after LLVM
        run: |
          test "$(sha256sum "$RUNNER_TEMP/$PROOF_CAPACITY_NAME/capacity.py" | cut -d ' ' -f 1)" = "13e2743a6dea3948dae2f0f8e25e03f0dd775a5968ca1471f4989684668764e9"
          python3 "$RUNNER_TEMP/$PROOF_CAPACITY_NAME/capacity.py" post-llvm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/zig
      - uses: ./.github/actions/native-packages
        with:
          target: linux-x64-gnu
      - name: Disable piped core dumps
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Prepare owned diagnostic runner
        run: |
          umask 077
