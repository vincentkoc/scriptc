              report.gatesComplete = report.gates.length === gateSpecs.length && report.gates.every(gate => gate.status === "passed");
              assert.deepEqual(report.gates.map(gate => gate.id), gateSpecs.map(spec => spec.id));
              report.units = report.gates.find(gate => gate.id === "fallback-units")?.inventory?.executedCount ?? 0;
              report.differentialSelections = report.gates.filter(gate => /^(llvm-)?differential-/.test(gate.id))
                .reduce((sum, gate) => sum + (gate.inventory?.executedCount ?? 0), 0);
              report.orderBatchCount = report.gates.find(gate => gate.id === "order-parity")?.inventory?.executedCount ?? 0;
              assert.equal(report.units, 32); assert.equal(report.differentialSelections, 48); assert.equal(report.orderBatchCount, 2);
              report.status = report.gatesComplete ? "passed" : "failed";
            } catch (error) { report.status = "failed"; report.error = scrub(error.stack ?? error); }
            finally {
              try {
                assert.ok(verifyInputs, "native preparation incomplete"); await verifyInputs();
                report.sourceAfter = source(); assert.deepEqual(report.sourceAfter, report.sourceBefore);
                report.sourceVerifiedAfter = true;
              } catch (error) { report.status = "failed"; report.inputError = scrub(error.stack ?? error); }
              report.qualificationComplete = report.status === "passed" && report.gatesComplete &&
                report.nativeVerifiedAfter === true && report.sourceVerifiedAfter === true &&
                report.steps.every(step => step.groupDrained === true && !step.leftoverChildren);
              report.finishedAt = new Date().toISOString(); save();
            }
            if (!report.qualificationComplete) throw new Error("callback qualification failed");
          }
          function artifactAfterCopy(file, name) {
            const target = join(out, name); copyFileSync(file, target); return artifact(target);
          }
          function finish() {
            const cleanup = { ...owner, work: "absent", payload: "absent", passed: false };
            try {
              assert.deepEqual({ workflow: report.workflow, run: report.run, attempt: report.attempt }, owner);
              if (existsSync(work)) {
                assertOwner();
                assert.ok(report.steps.every(step => step.groupDrained === true), "unresolved spawned process; retain scratch");
                const link = lstatSync(harnessLink, { throwIfNoEntry: false });
                if (link) {
                  assert.equal(link.isSymbolicLink(), true); assert.equal(readlinkSync(harnessLink), harnessOutput);
                  rmSync(harnessLink); cleanup.harnessLink = "removed";
                }
                rmSync(work, { recursive: true }); cleanup.work = "removed";
              }
              report.sourceAfterCleanup = source();
              assert.deepEqual(report.sourceAfterCleanup, report.sourceBefore);
              assert.equal(hash(payload), report.runnerSha256);
              rmSync(payload); cleanup.payload = "removed"; cleanup.passed = true;
            } catch (error) { cleanup.error = scrub(error.stack ?? error); report.qualificationComplete = false; }
            report.cleanup = cleanup;
            report.qualificationComplete &&= cleanup.passed;
            report.status = report.qualificationComplete ? "passed" : "failed"; save();
            writeFileSync(join(out, "cleanup.json"), JSON.stringify(cleanup, null, 2) + "\n");
            writeFileSync(join(out, "artifact-manifest.json"), JSON.stringify(inventoryFiles(out).filter(item => item.path !== "artifact-manifest.json"), null, 2) + "\n");
            if (!report.qualificationComplete) throw new Error("callback qualification incomplete or failed");
          }
          for (const key of ["FORCE_COLOR", "NO_COLOR", "SCRIPTC_LLVM_TEST_MODE", "SCRIPTC_TEST_OPTIMIZATION", "SCRIPTC_TEST_SHARD",
            "SCRIPTC_CPU_DISPATCH", "SCRIPTC_UPDATE_BASELINES", "SCRIPTC_TS7_ALL", "SCRIPTC_NO_CACHE", "SCRIPTC_CC", "SCRIPTC_TARGET"])
            delete process.env[key];
          try { if (process.argv[2] === "finish") finish(); else await main(); }
          catch (error) { console.error(scrub(error.stack ?? error)); console.error("[callback-contracts] FAILED (exit 1)"); process.exitCode = 1; }

          PROOF
          ulimit -c 0
          node "$RUNNER_TEMP/callback-contracts.mjs"
      - name: Verify inputs and remove owned scratch
        if: always()
        run: |
          if test ! -f "$RUNNER_TEMP/callback-contracts.mjs"; then
            echo '[callback-contracts] FAILED (exit 1): setup did not reach qualification' >&2
            exit 1
          fi
          node "$RUNNER_TEMP/callback-contracts.mjs" finish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-fallback-callback-contracts
          path: ${{ runner.temp }}/callback-contracts-proof
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: callback-contracts-capacity
          path: ${{ runner.temp }}/callback-contracts-capacity
          if-no-files-found: error
          retention-days: 1
